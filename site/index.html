<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수출 섹터 로테이션</title>
<meta name="description" content="관세청 시군구별 수출 데이터로 섹터·카테고리 비중 이동을 추적합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f4f1; --surface:#fbfbfa; --surface-2:#f0f0ec;
  --ink:#0d0f0e; --ink-2:#4e5250; --ink-3:#868a86;
  --grid:#e2e2db; --axis:#c4c5bd; --rule:rgba(13,15,14,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --pos:#2a78d6; --neg:#e34948; --mid:#a8a9a2;
  --good:#0ca30c; --crit:#d03b3b;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e100f; --surface:#171917; --surface-2:#1f221f;
  --ink:#f3f4f1; --ink-2:#b9bdb8; --ink-3:#83877f;
  --grid:#282b28; --axis:#3a3e3a; --rule:rgba(243,244,241,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --pos:#3987e5; --neg:#e66767; --mid:#6d716b;
  --good:#0ca30c; --crit:#e05c5c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e100f; --surface:#171917; --surface-2:#1f221f;
  --ink:#f3f4f1; --ink-2:#b9bdb8; --ink-3:#83877f;
  --grid:#282b28; --axis:#3a3e3a; --rule:rgba(243,244,241,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --pos:#3987e5; --neg:#e66767; --mid:#6d716b;
  --good:#0ca30c; --crit:#e05c5c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:26px 48px}

.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  padding-bottom:14px;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 4px}
h1{font-size:clamp(21px,3.4vw,29px);line-height:1.15;margin:0;font-weight:700;
  letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--ink-2);font-size:13px;margin:6px 0 0;max-width:62ch}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.7}
.meta b{color:var(--ink-2);font-weight:500}

/* tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:18px 0 20px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px 10px;
  font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink-3);cursor:pointer;
  display:inline-flex;align-items:baseline;gap:7px;margin-bottom:-1px}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
.tab .tnum{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tab[disabled]{cursor:not-allowed;opacity:.45}
.tab:focus-visible{outline:2px solid var(--s1);outline-offset:-2px;border-radius:2px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--surface);padding:14px 16px 15px}
.stat .k{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;margin-bottom:7px}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1}
.stat .d{font-size:11.5px;color:var(--ink-2);margin-top:7px;font-family:var(--mono)}
.up{color:var(--good)}.down{color:var(--crit)}

.panels{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:16px 16px 14px;min-width:0;display:flex;flex-direction:column}
.p7{grid-column:span 7}.p5{grid-column:span 5}.p12{grid-column:span 12}
/* 동적으로 채우는 컨테이너. display:contents 가 없으면 이 div 자체가 격자 한 칸을
   차지해 버려서, 안의 패널들은 1/12 폭으로 찌그러지고 옆 패널까지 밀린다.
   (실측: 로테이션 맵이 세로 한 줄로 눌렸다) */
#nation,#pinned,#bcharts,#bdem{display:contents}
.p6{grid-column:span 6}
/* 속보 표에서 조업일수에 중립인 유일한 열. 여기를 눈에 먼저 들어오게 한다. */
.wt th.hicol,.wt td.hicol{background:var(--surface-2)}
.wt th.hicol{color:var(--ink-2);font-weight:600}
@media(max-width:860px){.p7,.p5{grid-column:span 12}}
.ptitle{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.pnote{font-size:11.5px;color:var(--ink-3);margin:4px 0 12px;line-height:1.5}
.phead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.unit{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans)}
.lg:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:2px}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.lg[aria-pressed="false"]{opacity:.35}

svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.tk{fill:var(--ink-3);font-size:10px;font-family:var(--mono)}
.dlab{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--sans)}
.dlab2{fill:var(--ink-2);font-size:10px;font-family:var(--mono)}

table{border-collapse:collapse;width:100%;font-size:12.5px}
.tscroll{overflow-x:auto}
th{text-align:right;font-weight:600;color:var(--ink-3);font-size:10.5px;letter-spacing:.05em;
  padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:7px 9px;border-bottom:1px solid var(--rule);font-family:var(--mono);text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{font-family:var(--sans)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.newcat td{border-top:1px solid var(--rule)}
.catcell{font-weight:600}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;
  border-radius:2px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.chip.down{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.spark{width:78px;height:20px;display:block}
.warn{background:var(--surface-2);border-left:2px solid var(--s4);padding:9px 12px;
  font-size:11.5px;color:var(--ink-2);border-radius:0 3px 3px 0;margin-top:12px;line-height:1.55}

.empty{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:34px 22px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 8px;font-size:16px;color:var(--ink);font-weight:600}
.empty p{margin:0 auto;max-width:56ch;font-size:13px;line-height:1.7}
.empty code{font-family:var(--mono);font-size:12px;background:var(--surface-2);
  padding:2px 6px;border-radius:2px;display:inline-block;margin-top:10px}

#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:7px 10px;font-size:11.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.14);font-family:var(--mono);line-height:1.6;max-width:240px}
#tip[hidden]{display:none}
#tip b{font-family:var(--sans);font-size:12px}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);font-size:11.5px;
  color:var(--ink-3);line-height:1.7}
.foot code{font-family:var(--mono);font-size:11px;background:var(--surface-2);
  padding:1px 5px;border-radius:2px}
.toggle{background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);
  font-family:var(--sans);font-size:11.5px;padding:4px 10px;border-radius:2px;cursor:pointer}
.toggle:hover{color:var(--ink)}
.toggle:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 전산업 스캐너 ===== */
.thesis{color:var(--ink-2);font-size:13px;margin:0 0 16px;max-width:76ch}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.sigcard{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:12px 14px}
.sigcard h4{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.02em}
.sigcard .sub{font-size:11px;color:var(--ink-3);margin-bottom:8px}
.sigcard ol{margin:0;padding-left:0;list-style:none;font-size:13px}
.sigcard li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
  border-top:1px solid var(--rule)}
.sigcard li:first-child{border-top:0}
.sigcard .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sigcard .vl{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.sigcard.empty-c ol{color:var(--ink-3);font-size:12px}
.gname{font-size:12px;font-weight:600;letter-spacing:.02em;margin:26px 0 2px;
  padding-top:14px;border-top:1px solid var(--rule)}
.gthesis{font-size:11.5px;color:var(--ink-3);margin:0 0 8px}
.wt{width:100%;border-collapse:collapse;font-size:12.5px}
.wt th{font-weight:500;color:var(--ink-3);font-size:11px;text-align:right;padding:5px 7px;
  border-bottom:1px solid var(--rule);white-space:nowrap}
.wt td{text-align:right;padding:6px 7px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.wt th.l,.wt td.l{text-align:left;font-family:var(--sans)}
.wt tr.dim td{color:var(--ink-3)}
/* 교차표에서 '집계 안 됨'을 옅게 — 0 과 미집계를 눈으로 구분한다 */
.wt td.dimc{color:var(--ink-3);opacity:.5}
.wt tbody tr:hover{background:var(--surface-2)}
.wt .it{font-weight:600;color:var(--ink)}
.wt .tk{font-size:11px;color:var(--ink-3);display:block;font-family:var(--sans)}
.pu{display:inline-block;font-size:9.5px;padding:0 4px;border-radius:2px;line-height:15px;
  border:1px solid var(--rule);color:var(--ink-3);margin-left:5px;vertical-align:1px}
.pu.high{border-color:var(--s3);color:var(--s3)}
.idea{font-size:11.5px;color:var(--ink-2);font-family:var(--sans);white-space:normal;
  max-width:44ch;line-height:1.45}
.quad{font-size:10px;fill:var(--ink-3)}

.wt td.hsk{font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.5}
.wt td.cty{font-family:var(--sans);font-size:11px;line-height:1.5}
.wt td.cty .sh{font-family:var(--mono);color:var(--ink-3);font-size:10px}
.wt tr.itemrow td{border-bottom:0;padding-bottom:3px}
.wt tr.idearow td{padding:0 7px 8px;color:var(--ink-3);font-size:11.5px;font-family:var(--sans);
  white-space:normal;line-height:1.5;max-width:none}
.wt tr.itemrow:hover td,.wt tr.itemrow:hover + tr.idearow td{background:var(--surface-2)}
.wt tbody tr:hover{background:none}

.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 12px}
.seg{background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);
  font-family:var(--sans);font-size:11.5px;padding:4px 10px;border-radius:2px;cursor:pointer}
.seg:hover{color:var(--ink)}
.seg.on{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.seg:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.srch{margin-left:auto;background:var(--surface);border:1px solid var(--rule);color:var(--ink);
  font-family:var(--sans);font-size:12px;padding:4px 9px;border-radius:2px;min-width:180px}
.srch:focus{outline:2px solid var(--s1);outline-offset:-1px}
.subtabs{display:flex;gap:6px;margin:0 0 18px}
.subtab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);
  font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 2px 7px;cursor:pointer;
  display:inline-flex;gap:6px;align-items:baseline;margin-right:14px}
.subtab .tnum{font-family:var(--mono);font-size:10.5px}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
.subtab:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

.wt th.sortable{cursor:pointer;user-select:none}
.wt th.sortable:hover{color:var(--ink)}
.wt th.sorted{color:var(--ink);font-weight:600}
.wt th.sortable:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.pu.warn{border-color:var(--s4);color:var(--s4)}

.chain{margin-bottom:34px}
.vd{border-left:3px solid var(--mid);background:var(--surface-2);padding:10px 13px;
  border-radius:0 3px 3px 0;font-size:12.5px;color:var(--ink-2);margin:0 0 16px;line-height:1.6}
.vd b{color:var(--ink);font-size:13px}
.vd.vd-loc{border-left-color:var(--s4)}
.vd.vd-mix{border-left-color:var(--s2)}
.vd.vd-bad{border-left-color:var(--crit)}
.vd.vd-good{border-left-color:var(--good)}
.pu.loc{border-color:var(--s4);color:var(--s4)}
/* 표 안에 들어가는 판정 배지. .vd 는 블록 카드라 셀에 넣으면 행이 부풀어 오른다. */
.vdi{display:inline-block;font-size:11px;padding:1px 7px;border-radius:2px;
  border:1px solid var(--rule);border-left-width:3px;color:var(--ink-2);
  font-family:var(--sans);white-space:nowrap}
.vdi.vd-loc{border-left-color:var(--s4)}
.vdi.vd-mix{border-left-color:var(--s2)}
.vdi.vd-bad{border-left-color:var(--crit);color:var(--crit)}
.vdi.vd-good{border-left-color:var(--good);color:var(--good)}
.vdi.vd-na{border-left-color:var(--mid)}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow">관세청 시군구별 품목별 수출입실적</p>
      <h1>수출 섹터 로테이션</h1>
      <p class="sub">통관 데이터를 시군구 단위로 전수 수집해, 어느 카테고리가 비중을 가져가고
        어느 지역이 그 변화를 끌고 있는지 추적합니다. 월별 확정치는 매월 17일,
        <b>10일 단위 속보는 1·11·21일</b>에 자동 갱신됩니다.</p>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>

  <p class="foot" id="foot"></p>
</div>
<div id="tip" hidden></div>

<script>
const SER = ["--s1","--s2","--s3","--s4","--s5"];
const NS = "http://www.w3.org/2000/svg";
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = (t,a={}) => { const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
const fm = n => n>=1000 ? Math.round(n).toLocaleString() : (n>=100 ? Math.round(n) : n.toFixed(1));
const pct = n => n==null ? "–" : (n>0?"+":"") + n.toFixed(Math.abs(n)>=100?0:1) + "%";
const pp  = n => n==null ? "–" : (n>0?"+":"") + n.toFixed(2) + "%p";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 파이썬 쪽 설명문은 **이렇게** 강조를 표시한다. 먼저 이스케이프하고 그다음
// 강조만 되살린다 — 순서를 바꾸면 설명문에 태그를 넣어 화면을 깨뜨릴 수 있다.
const mdb = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");

const tip = document.getElementById("tip");
function showTip(ev, html){
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y < 8) y = ev.clientY + 16;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
const hideTip = () => { tip.hidden = true; };
addEventListener("scroll", hideTip, {passive:true});

let MANIFEST = null, CUR = null, CACHE = {};

// Artifact 배포 시 퍼블리시 스크립트가 채워 넣는다. Pages 에서는 비어 있고 fetch 를 탄다.
const BOOT = (typeof window !== "undefined" && window.__BOOTSTRAP__) || null;
function getJSON(path){
  if (BOOT && BOOT[path]) return Promise.resolve(BOOT[path]);
  return fetch(path, {cache:"no-cache"}).then(r => {
    if (!r.ok) throw new Error(r.status); return r.json();
  });
}

/* ================= charts ================= */
function drawMap(mount, S){
  const W=620,H=400,M={t:16,r:24,b:40,l:52}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const cats = S.cats.filter(c => c.yoy!=null && c.share_chg!=null);
  if (!cats.length){ mount.innerHTML = '<p class="pnote">전년 동기 비교가 가능한 12개월 이상 데이터가 아직 없습니다.</p>'; return; }
  const xs=cats.map(c=>c.yoy), ys=cats.map(c=>c.share_chg);
  const x0=Math.min(-20,Math.min(...xs)-10), x1=Math.max(...xs)+14;
  // 비중변화가 전부 0 근처일 때 축을 거기 맞추면 노이즈를 로테이션으로 오독한다 → 하한 ±0.5%p
  const Y_FLOOR=0.5;
  const yA=Math.max(Math.max(...ys.map(Math.abs))*1.25, Y_FLOOR);
  const X=v=>M.l+(v-x0)/(x1-x0)*iw, Y=v=>M.t+(yA-v)/(2*yA)*ih;
  const vmax=Math.max(...cats.map(c=>c.ytd))||1;
  const R=v=>6+Math.sqrt(Math.max(v,0)/vmax)*44;
  const big=new Set([...cats].sort((a,b)=>b.ytd-a.ytd).slice(0,3).map(c=>c.hs));

  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img",
    "aria-label":"카테고리 로테이션 산점도. 가로축 전년 대비 성장률, 세로축 섹터 내 비중 변화."});
  s.appendChild(el("rect",{x:X(0),y:M.t,width:Math.max(0,M.l+iw-X(0)),height:ih/2,fill:cv("--s1"),opacity:.045}));
  s.appendChild(el("rect",{x:M.l,y:M.t+ih/2,width:Math.max(0,X(0)-M.l),height:ih/2,fill:cv("--neg"),opacity:.05}));

  const step = yA>4 ? 2 : (yA>1.5 ? 1 : 0.5);
  for(let gy=-Math.ceil(yA/step)*step; gy<=yA; gy+=step){
    if(Math.abs(gy)>yA) continue;
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(gy),y2:Y(gy),class:gy===0?"ax":"gl"}));

    t.textContent=(gy>0?"+":"")+ (Number.isInteger(gy)?gy:gy.toFixed(1)); s.appendChild(t);
  }
  for(let gx=Math.ceil(x0/20)*20; gx<=x1; gx+=20){
    s.appendChild(el("line",{x1:X(gx),x2:X(gx),y1:M.t,y2:M.t+ih,class:gx===0?"ax":"gl"}));
    const t=el("text",{x:X(gx),y:M.t+ih+18,class:"tk","text-anchor":"middle"});
    t.textContent=gx+"%"; s.appendChild(t);
  }
  let t=el("text",{x:M.l+iw,y:M.t+ih+34,class:"tk","text-anchor":"end"});
  t.textContent="전년 동기 대비 성장률 →"; s.appendChild(t);
  t=el("text",{x:M.l-9,y:M.t-4,class:"tk","text-anchor":"end"});
  t.textContent="비중변화 %p"; s.appendChild(t);

  const placed=[];
  for(const c of [...cats].sort((a,b)=>b.ytd-a.ytd)){
    const cx=X(c.yoy), cy=Y(c.share_chg), r=R(c.ytd);
    const col = c.share_chg>0.02 ? cv("--pos") : (c.share_chg<-0.02 ? cv("--neg") : cv("--mid"));
    const g=el("g",{tabindex:"0",role:"group",
      "aria-label":`${c.name}: 성장률 ${pct(c.yoy)}, 비중변화 ${pp(c.share_chg)}, ${fm(c.ytd)}백만달러`});
    g.appendChild(el("circle",{cx,cy,r,fill:col,"fill-opacity":.2,stroke:col,"stroke-width":2}));
    let two=big.has(c.hs);
    const up=r+(two?20:8);
    let ly=(cy-up<M.t+12)?cy+r+18:cy-up, tries=0;
    const clash=y=>placed.some(p=>Math.abs(p.x-cx)<52 && Math.abs(p.y-y)<15);
    while(clash(ly) && tries<12){
      const d=Math.ceil((tries+1)/2)*19;
      ly = tries%2 ? cy+r+18+d : cy-up-d;
      if(ly<M.t+12) ly=cy+r+18+d;
      if(ly>M.t+ih-6) ly=cy-up-d;
      tries++;
    }
    if(clash(ly)) two=false;          // 끝내 자리가 없으면 값 줄은 접고 이름만
    placed.push({x:cx,y:ly});
    const t1=el("text",{x:cx,y:ly,class:"dlab","text-anchor":"middle"});
    t1.textContent=c.name; g.appendChild(t1);
    if(two){ const t2=el("text",{x:cx,y:ly+12,class:"dlab2","text-anchor":"middle"});
      t2.textContent="$"+fm(c.ytd)+"M"; g.appendChild(t2); }
    const html=`<b>${esc(c.name)}</b> (HS ${c.hs})<br>$${fm(c.ytd)}M · 비중 ${c.share?.toFixed(1)??"–"}%
      <br>YoY ${pct(c.yoy)} → 최근 ${pct(c.q3)}<br>비중변화 ${pp(c.share_chg)} · 가속 ${pp(c.accel)}`;
    g.addEventListener("pointermove",e=>showTip(e,html));
    g.addEventListener("pointerleave",hideTip);
    g.addEventListener("focus",()=>{const b=g.getBoundingClientRect();
      showTip({clientX:b.left+b.width/2,clientY:b.top},html)});
    g.addEventListener("blur",hideTip);
    s.appendChild(g);
  }
  let q=el("text",{x:M.l+iw-4,y:M.t+14,class:"tk","text-anchor":"end"});
  q.textContent="몫을 키우며 성장"; s.appendChild(q);
  q=el("text",{x:M.l+6,y:M.t+ih-8,class:"tk"});
  q.textContent="밀려나는 축"; s.appendChild(q);
  mount.replaceChildren(s);
}

function lineChart(mount, months, series, o){
  const W=o.w||980,H=o.h||260,M={t:12,r:o.padR??58,b:28,l:o.padL??46};
  const iw=W-M.l-M.r, ih=H-M.t-M.b, n=months.length;
  const live=series.filter(s=>!s.off);
  const vals=live.flatMap(s=>s.v).filter(v=>v!=null);
  if(!vals.length){ mount.innerHTML=""; return; }
  let lo=o.zero?0:Math.min(...vals), hi=Math.max(...vals);
  const padv=(hi-lo)*0.12||1; hi+=padv; if(!o.zero) lo-=padv;
  const X=i=>M.l+(n===1?iw/2:i/(n-1)*iw), Y=v=>M.t+(hi-v)/(hi-lo)*ih;

  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":o.label||""});
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4;
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(v),y2:Y(v),class:"gl"}));
    const t=el("text",{x:M.l-8,y:Y(v)+3.5,class:"tk","text-anchor":"end"});
    t.textContent=o.fmtY?o.fmtY(v):Math.round(v); s.appendChild(t);
  }
  months.forEach((m,i)=>{
    if(!m.endsWith("-01")&&!m.endsWith("-07")) return;
    const t=el("text",{x:X(i),y:M.t+ih+17,class:"tk","text-anchor":"middle"});
    t.textContent=m.slice(2).replace("-","."); s.appendChild(t);
  });
  s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:M.t+ih,y2:M.t+ih,class:"ax"}));

  live.forEach(sr=>{
    const pts=sr.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    s.appendChild(el("path",{d:"M"+pts.map(p=>p.join(" ")).join("L"),fill:"none",
      stroke:cv(sr.c),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    const last=pts[pts.length-1];
    s.appendChild(el("circle",{cx:last[0],cy:last[1],r:4,fill:cv(sr.c),
      stroke:cv("--surface"),"stroke-width":2}));
    const t=el("text",{x:last[0]+9,y:last[1]+3.5,class:"dlab2"});
    t.textContent=sr.name; s.appendChild(t);
  });
  const cross=el("line",{x1:0,x2:0,y1:M.t,y2:M.t+ih,class:"ax",opacity:"0"});
  s.appendChild(cross);
  const hit=el("rect",{x:M.l,y:M.t,width:iw,height:ih,fill:"transparent"});
  s.appendChild(hit);
  hit.addEventListener("pointermove",ev=>{
    const bb=s.getBoundingClientRect();
    let i=Math.round(((ev.clientX-bb.left)/bb.width*W-M.l)/iw*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",".7");
    showTip(ev,`<b>${months[i]}</b><br>`+live.map(sr=>
      `<span style="color:${cv(sr.c)}">■</span> ${esc(sr.name)} ${
        sr.v[i]==null?"–":(o.fmtT?o.fmtT(sr.v[i]):fm(sr.v[i]))}`).join("<br>"));
  });
  hit.addEventListener("pointerleave",()=>{cross.setAttribute("opacity","0");hideTip()});
  mount.replaceChildren(s);
}

function sparkSVG(v, col){
  const w=78,h=20,lo=Math.min(...v),hi=Math.max(...v);
  const X=i=>i/(v.length-1)*(w-2)+1, Y=x=>h-2-(hi===lo?0.5:(x-lo)/(hi-lo))*(h-5);
  const d="M"+v.map((x,i)=>`${X(i).toFixed(1)} ${Y(x).toFixed(1)}`).join("L");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(${col})" stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="2.2"
      fill="var(${col})"/></svg>`;
}

/* ================= render a sector ================= */
// ★ null 을 전파해야 한다. JS 에서 null+null+null === 0 이라,
//   그냥 더하면 **데이터가 없던 구간이 0 으로 그려진다** (2026-09-29 실측:
//   미국 수입 계열이 2026-02 부터인데 그 앞이 바닥에 붙은 평평한 선으로 나왔다 —
//   "수입이 0이었다"로 읽히지만 실제로는 "그 품목이 아직 없었다"였다).
//   경계에서도 (null+null+v)/3 = v/3 이라 3개월에 걸쳐 가짜로 차오른다.
const ma3 = a => a.map((_, i) => {
  if (i < 2) return null;
  const w = [a[i - 2], a[i - 1], a[i]];
  return w.some(v => v == null) ? null : +((w[0] + w[1] + w[2]) / 3).toFixed(2);
});
let showAll = false;

/* ══════════════════════════════════════════════════════════════════════════
   국가 축 — 단가(P/Q)와 확산도

   왜 이 블록이 섹터 화면 맨 위에 오는가.
   금액만 보면 '밀어내기'와 '프리미엄 확산'이 같은 칸에 들어간다. 2026-08 실측:
     기초화장품  금액 +49.4%  물량 +15.7%  단가 +29.0%   ← 성장의 2/3 가 단가
     메이크업    금액 + 9.9%  물량 + 5.8%  단가 + 3.9%   ← 사실상 물량
   같은 기초화장품인데 미국은 단가가 빠지고(28.2→27.3) 일본은 +42.6% 다.
   미국은 밀어내기, 일본은 프리미엄 침투 — 금액 증가율만으로는 구분되지 않는다.

   단가는 **국가 축에서만** 나온다. 시군구 API 에는 중량 필드가 없다.
   ══════════════════════════════════════════════════════════════════════════ */
const VDC = {premium_expansion:"vd-good", volume_growth:"", push:"vd-bad",
             price_led:"vd-loc", flat:"vd-na", price_erosion:"vd-mix",
             mix_up:"vd-mix", volume_decline:"vd-mix", contracting:"vd-bad",
             unknown:"vd-na", spreading:"vd-good", concentrating:"vd-bad",
             stable:"vd-na"};
const vbadge = v => v ? `<span class="vdi ${VDC[v.code]||""}" title="${esc(v.note||"")}">${
  esc(v.label)}</span>` : "–";
const NCL = {x:[-45,90], y:[-35,60]};

function drawNationQuad(mount, N){
  const W=760,H=420,M={t:18,r:26,b:46,l:56}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const pts = (N.countries||[]).filter(r=>r.qtyYoy!=null && r.priceYoy!=null && r.usd>0);
  if (pts.length < 2){
    mount.innerHTML = '<p class="pnote">물량·단가를 둘 다 계산할 수 있는 국가가 부족합니다 '+
      '(중량 '+N.minWgtKg.toLocaleString()+'kg 미만은 단가를 내지 않습니다).</p>';
    return;
  }
  const [cx0,cx1]=NCL.x, [cy0,cy1]=NCL.y;
  const X = v => M.l + (Math.min(cx1,Math.max(cx0,v))-cx0)/(cx1-cx0)*iw;
  const Y = v => M.t + ih - (Math.min(cy1,Math.max(cy0,v))-cy0)/(cy1-cy0)*ih;
  const maxU = Math.max(...pts.map(p=>p.usd));
  const R = u => 5 + Math.sqrt(Math.max(u,0)/maxU)*24;
  const s = el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img",
    "aria-label":"국가별 물량 대비 단가 변화 사분면"});

  // 우상(프리미엄 확산)은 은은하게, 우하(밀어내기)는 경고색으로 — 두 칸이 갈림길이다
  s.appendChild(el("rect",{x:X(0),y:M.t,width:Math.max(0,M.l+iw-X(0)),
    height:Math.max(0,Y(0)-M.t),fill:cv("--s3"),opacity:.05}));
  s.appendChild(el("rect",{x:X(0),y:Y(0),width:Math.max(0,M.l+iw-X(0)),
    height:Math.max(0,M.t+ih-Y(0)),fill:cv("--crit"),opacity:.045}));

  [-30,0,30,60].filter(v=>v>cy0&&v<cy1).forEach(v=>{
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(v),y2:Y(v),class:v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:M.l-8,y:Y(v)+3.5,class:"tk","text-anchor":"end"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });
  [-30,0,30,60,90].filter(v=>v>=cx0&&v<=cx1).forEach(v=>{
    s.appendChild(el("line",{y1:M.t,y2:M.t+ih,x1:X(v),x2:X(v),class:v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:X(v),y:M.t+ih+16,class:"tk","text-anchor":"middle"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });
  const quad=(x,y,t,a)=>s.appendChild(Object.assign(
    el("text",{x,y,class:"quad","text-anchor":a}),{textContent:t}));
  quad(M.l+iw-4, M.t+13,    "물량↑ 단가↑ · 프리미엄 확산", "end");
  quad(M.l+iw-4, M.t+ih-6,  "물량↑ 단가↓ · 밀어내기(마진 경고)", "end");
  quad(M.l+4,    M.t+13,    "물량↓ 단가↑ · 믹스 개선·정리", "start");
  quad(M.l+4,    M.t+ih-6,  "물량↓ 단가↓ · 수축", "start");
  s.appendChild(Object.assign(el("text",{x:M.l+iw/2,y:H-6,class:"tk","text-anchor":"middle"}),
    {textContent:"물량(중량) YoY →"}));
  s.appendChild(Object.assign(el("text",{x:14,y:M.t+ih/2,class:"tk","text-anchor":"middle",
    transform:`rotate(-90 14 ${M.t+ih/2})`}),{textContent:"단가($/kg) YoY"}));

  const placed=[];
  pts.slice().sort((a,b)=>b.usd-a.usd).forEach(p=>{
    const x=X(p.qtyYoy), y=Y(p.priceYoy), r=R(p.usd);
    const out = p.qtyYoy<cx0||p.qtyYoy>cx1||p.priceYoy<cy0||p.priceYoy>cy1;
    // 허브는 점선 테두리 — 최종 소비지가 아니라서 같은 위치라도 뜻이 다르다
    const c = cv(p.hub ? "--s4" : "--s1");
    const g = el("g",{});
    g.appendChild(el("circle",{cx:x,cy:y,r:r+2,fill:cv("--surface")}));
    g.appendChild(el("circle",{cx:x,cy:y,r,fill:c,opacity:out?.25:(p.hub?.28:.5),
      stroke:c,"stroke-width":p.hub?2:1.5,"stroke-dasharray":p.hub?"4 3":(out?"3 2":"")}));
    g.style.cursor="pointer";
    g.addEventListener("mousemove", e=>showTip(e,
      `<b>${esc(p.name)}</b> ${p.hub?'<span class="pu warn">중계 허브</span>':""}<br>`+
      `금액 $${fm(p.usd)}M · YoY ${pct(p.valueYoy)}<br>`+
      `물량 ${fm(p.wgt)}톤 · YoY ${pct(p.qtyYoy)}<br>`+
      `단가 $${p.asp==null?"–":p.asp.toLocaleString()}/kg · YoY ${pct(p.priceYoy)}<br>`+
      `${esc(p.verdict?.label||"")}${p.hub&&p.why?"<br>※ "+esc(p.why):""}`+
      (out?"<br>※ 축 범위 밖(점선)":"")));
    g.addEventListener("mouseleave", hideTip);
    s.appendChild(g);
    if (r >= 12){
      const txt = p.name.length>9 ? p.name.slice(0,8)+"…" : p.name;
      const w = [...txt].reduce((a,ch)=>a+(/[ㄱ-힝]/.test(ch)?11.2:6),0)+6;
      const free=(lx,ly)=> lx-w/2>M.l+2 && lx+w/2<M.l+iw-2 && ly>M.t+10 && ly<M.t+ih-4 &&
        !placed.some(q=>Math.abs(q.x-lx)<(q.w+w)/2+8 && Math.abs(q.y-ly)<15) &&
        !pts.some(o=>o!==p && Math.abs(X(o.qtyYoy)-lx)<w/2+R(o.usd) &&
                     Math.abs(Y(o.priceYoy)-ly)<R(o.usd)+5);
      let put=null;
      for (const dy of [-(r+7), r+15, -(r+21), r+29]){ if(free(x,y+dy)){put={x,y:y+dy};break;} }
      if (put){
        s.appendChild(Object.assign(el("text",{x:put.x,y:put.y,class:"dlab",
          "text-anchor":"middle"}),{textContent:txt}));
        placed.push({x:put.x,y:put.y,w});
      }
    }
  });
  mount.innerHTML=""; mount.appendChild(s);
}

      <p class="pnote">가로축 <b>물량</b>, 세로축 <b>단가</b>. 오른쪽 <b>위</b>는 가격을 올리고도

        금액 증가율만 보면 이 둘이 같은 칸에 들어갑니다.</p>
      <div id="nquad"></div>
    </section>
    <section class="panel p5">
      <div class="phead"><h2 class="ptitle">성장의 정체</h2>
        <span class="unit">최근 ${N.window}개월 · 전년 동기 대비</span></div>
      <p class="pnote">금액 증가를 단가와 물량으로 쪼갭니다. 로그 분해라 두 기여도의 합이
        정확히 100%입니다.</p>
      <table class="wt"><tbody>
        <tr><td class="l">금액</td><td>$${fm(t.usd||0)}M</td>
          <td class="${t.valueYoy>0?'up':'down'}">${pct(t.valueYoy)}</td></tr>
        <tr><td class="l">물량</td><td>${fm(t.wgt||0)}톤</td>
          <td class="${t.qtyYoy>0?'up':'down'}">${pct(t.qtyYoy)}</td></tr>
        <tr><td class="l">단가</td><td class="hicol">$${t.asp==null?"–":t.asp.toLocaleString()}/kg</td>
          <td class="hicol ${t.priceYoy>0?'up':'down'}">${pct(t.priceYoy)}</td></tr>
        <tr><td class="l">기여도</td>
          <td colspan="2" class="l">단가 <b>${share(t.priceShare)}</b> ·
            물량 <b>${share(t.qtyShare)}</b></td></tr>
      </tbody></table>
      <p style="margin:12px 0 0">${vbadge(t.verdict)}</p>
      <p class="pnote" style="margin-top:8px">${esc(t.verdict?.note||"")}</p>
    </section>

    <section class="panel p12">
      <div class="phead"><h2 class="ptitle">카테고리 × HSK 10단위</h2>
        <span class="unit">$M · $/kg · 최근 ${N.window}개월</span></div>
      <p class="pnote"><b>HS 6단위는 서로 다른 시장을 한 칸에 담고 있습니다.</b>
        예를 들어 330499 안에는 기초화장용(3304.99.1000)과 메이크업용(3304.99.2000)이
        같이 들어가는데 단가가 1.6배 다르고 방향도 다릅니다. 들여쓴 줄이 10단위 실제 값입니다.</p>
      <div class="tscroll"><table class="wt"><thead><tr>
        <th class="l">품목</th><th>$M</th><th>비중</th><th>금액 YoY</th><th>물량 YoY</th>
        <th class="hicol">단가</th><th class="hicol">단가 YoY</th><th class="l">국면</th>
      </tr></thead><tbody>${catRows||`<tr><td class="l" colspan="8">데이터 없음</td></tr>`}</tbody>
      </table></div>
    </section>

    <section class="panel p12">
      <div class="phead"><h2 class="ptitle">국가별 단가</h2>
        <span class="unit">상위 14개국 · $M · $/kg</span></div>
      <p class="pnote">같은 성장이라도 단가가 오르며 큰 것과 내리며 큰 것은 다음 분기가
        다릅니다. <b>밀어내기는 마진과 재고로 돌아옵니다.</b>
        '중계' 표시는 최종 소비지가 아닐 가능성이 큰 재수출 관문입니다 — 이름 위에 근거가 뜹니다.
        <b>단가기여</b>는 금액 변화 중 단가가 설명하는 몫입니다(음수면 단가가 성장을 깎았다는 뜻).</p>
      <div class="tscroll"><table class="wt"><thead><tr>
        <th class="l">국가</th><th>$M</th><th>금액 YoY</th><th>물량 YoY</th>
        <th class="hicol">단가</th><th class="hicol">단가 YoY</th><th>단가기여</th>
        <th class="l">국면</th>
      </tr></thead><tbody>${ctyRows||`<tr><td class="l" colspan="8">데이터 없음</td></tr>`}</tbody>
      </table></div>
    </section>

    <section class="panel p12">
      <div class="phead"><h2 class="ptitle">확산도 — 성장이 넓어지나, 좁아지나</h2>
        <span class="unit">상위 ${B.topN}개국 비중${
          B.coverage!=null?` · 수집국이 전체의 ${B.coverage}%`:""}</span></div>
      <p class="pnote">집중은 피크의 전조입니다. 한 나라가 성장의 대부분을 만들고 있으면
        그 나라의 재고 사이클 한 번에 섹터가 꺾입니다. <b>허브를 뺀 값을 나란히 놓는 이유</b>는
        재수출 증가를 시장 개척으로 오독하지 않기 위해서입니다 — 두 판정이 갈리면 그게 신호입니다.</p>
      <div class="tscroll"><table class="wt"><thead><tr>
        <th class="l">기준</th><th>상위 ${B.topN}국 비중</th><th>전년</th><th>변화</th>
        <th>HHI</th><th class="l">판정</th>
      </tr></thead><tbody>
        <tr><td class="l"><span class="it">전체</span>
            <span class="tk">${(B.all.now.top||[]).map(x=>esc(x.cc)+" "+x.share+"%").join(" · ")}</span></td>
          <td>${share(B.all.now.topShare)}</td><td>${share(B.all.prev.topShare)}</td>
          <td class="${B.all.verdict.chg<0?'up':'down'}">${pp(B.all.verdict.chg)}</td>
          <td>${B.all.now.hhi==null?"–":B.all.now.hhi.toLocaleString()}</td>
          <td class="l">${vbadge(B.all.verdict)}</td></tr>
        <tr><td class="l"><span class="it">중계 허브 제외</span>
            <span class="tk">${(B.exHub.now.top||[]).map(x=>esc(x.cc)+" "+x.share+"%").join(" · ")}</span></td>
          <td>${share(B.exHub.now.topShare)}</td><td>${share(B.exHub.prev.topShare)}</td>
          <td class="${B.exHub.verdict.chg<0?'up':'down'}">${pp(B.exHub.verdict.chg)}</td>
          <td>${B.exHub.now.hhi==null?"–":B.exHub.now.hhi.toLocaleString()}</td>
          <td class="l">${vbadge(B.exHub.verdict)}</td></tr>
      </tbody></table></div>
      <div class="sig" style="margin-top:16px">
        <div class="sigcard"><h4>증가분은 누가 만들었나</h4>
          <div class="sub">상위 ${B.topN}국 밖의 몫 — 오르면 확산</div>
          <ol><li><span class="nm">전체 증가분</span>
            <span class="vl ${B.contribution.totalDelta>0?'up':'down'}">
              ${B.contribution.totalDelta>0?"+":""}$${fm(Math.abs(B.contribution.totalDelta))}M</span></li>
            <li><span class="nm">상위 ${B.topN}국 밖</span>
            <span class="vl">${B.contribution.outsideShare==null?"–":
              B.contribution.outsideShare+"%"}</span></li>
            ${(B.contribution.gainers||[]).slice(0,3).map(g=>
              `<li><span class="nm">${esc(g.cc)}</span><span class="vl up">+$${fm(g.delta)}M</span></li>`).join("")}
          </ol></div>
        <div class="sigcard"><h4>중계 허브</h4>
          <div class="sub">${(B.hub.codes||[]).join(" · ")||"지정 없음"}</div>
          <ol><li><span class="nm">허브 합계</span><span class="vl">$${fm(B.hub.usd)}M</span></li>
            <li><span class="nm">섹터 내 비중</span><span class="vl">${share(B.hub.share)}</span></li>
            <li><span class="nm">YoY</span>
              <span class="vl ${B.hub.yoy>0?'up':'down'}">${pct(B.hub.yoy)}</span></li>
          </ol></div>
        <div class="sigcard${(N.entries||[]).length?"":" empty-c"}"><h4>신규 시장 진입</h4>
          <div class="sub">월 $${N.entryUsd}M 을 연속 2개월 돌파 · 최근 2년</div>
          <ol>${(N.entries||[]).length ? N.entries.map(e=>
            `<li><span class="nm">${esc(e.cc)}</span>
              <span class="vl">${esc(e.since)} · $${fm(e.usd)}M</span></li>`).join("")
            : "<li>최근 2년 내 신규 진입 없음</li>"}</ol></div>
      </div>
      <div class="warn"><b>읽는 법</b> — 이 표의 분모는 <b>세계 전체가 아니라 수집 대상 국가</b>입니다
        ${B.coverage!=null?`(전국 합계의 <b>${B.coverage}%</b>)`:""}.
        나머지는 설정에 올리지 않은 국가들이므로, 비중은 실제보다 크게 나옵니다.
        중계 허브 지정은 근거를 <code>config/sectors/*.yaml</code> 에 적어 두었고 코드가 아니라
        설정입니다 — 시간이 지나면 바뀌기 때문입니다.</div>
    </section>`;

  drawNationQuad(document.getElementById("nquad"), N);
}

function renderSector(S){
  const dom = S.cats.find(c=>c.hs===S.dominant);
  const domShare = dom?.share ?? 0;
  const splitMode = !!S.split && domShare >= 60;
  const rest = S.cats.filter(c=>!dom || c.hs!==dom.hs);
  const fastest = [...S.cats].filter(c=>c.yoy!=null && c.ytd>=S.totals.ytd*0.003)
    .sort((a,b)=>b.yoy-a.yoy)[0];
  const shrink = [...S.cats].filter(c=>c.share_chg!=null).sort((a,b)=>a.share_chg-b.share_chg)[0];

  const statsHTML = [
    [`${esc(S.name)} 수출`, "$"+fm(S.totals.ytd)+"M",
     `<span class="${S.totals.yoy>0?'up':'down'}">${pct(S.totals.yoy)}</span> · 최근 ${S.window}개월`],
    dom ? ["최대 카테고리", esc(dom.name),
      `${dom.share?.toFixed(1)}% · <span class="${dom.share_chg>0?'up':'down'}">${pp(dom.share_chg)}</span>`] : null,
    fastest ? ["최고 성장", esc(fastest.name),
      `<span class="${fastest.yoy>0?'up':'down'}">${pct(fastest.yoy)}</span> · $${fm(fastest.ytd)}M`] : null,
    shrink ? ["최대 비중 축소", esc(shrink.name),
      `<span class="down">${pp(shrink.share_chg)}</span> · YoY ${pct(shrink.yoy)}`] : null,
  ].filter(Boolean).map(([k,v,d]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("");

  document.getElementById("view").innerHTML = `
    <div class="stats">${statsHTML}</div>
    <div class="panels">
      <section class="panel p7">
        <div class="phead"><h2 class="ptitle">로테이션 맵</h2>
          <span class="unit">버블 = 최근 ${S.window}개월 규모</span></div>
        <p class="pnote">가로축은 성장률, 세로축은 <b>섹터 내 비중 변화</b>. 오른쪽 위 = 자기 몫을
          키우며 크는 축, 왼쪽 아래 = 밀려나는 축.</p>
        <div id="map"></div>
      </section>
      <section class="panel p5">
        <div class="phead"><h2 class="ptitle">${splitMode?esc(S.split.domName)+" vs 그 외":"카테고리 비중"}</h2>
          <span class="unit">${splitMode?"기준월 = 100 · 3개월 이동평균":"최근 "+S.window+"개월"}</span></div>
        <p class="pnote" id="p2note"></p>
        <div class="legend" id="lg-idx"></div>
        <div id="idx"></div>
      </section>
      <section class="panel p12">
        <div class="phead"><h2 class="ptitle">카테고리별 월별 추이</h2>
          <span class="unit">백만 USD · 3개월 이동평균</span></div>
        <p class="pnote" id="p3note"></p>
        <div class="legend" id="lg-nb"></div>
        <div id="nb"></div>
      </section>
      <!-- 로테이션 3종(맵 · 지배 vs 그 외 · 월별 추이)이 이 탭의 첫 화면이다.
           탭을 누르자마자 보여야 하는 것은 '어느 카테고리가 몫을 가져가나' 이고,
           단가·확산도는 그 다음에 '그래서 그 성장이 어떤 성장인가' 를 답한다.
           순서를 바꾸려면 이 주석과 함께 옮길 것. -->
      <div id="nation"></div>
      <section class="panel p12">
        <div class="phead"><h2 class="ptitle">카테고리별 상위 수출 시군구</h2>
          <button class="toggle" id="tv" type="button" aria-pressed="false">표 전체 보기</button></div>
        <p class="pnote">제도상 기준은 수출신고서의 <b>제조자 사업장 주소</b>입니다
          (관세청 API 명세 · K-stat 통계가이드). 다만 <b>수출자가 직접 적는 항목</b>이라,
          ODM 에서 완제품을 매입해 수출하는 브랜드사는 자기 주소를 넣는 경우가 많습니다.</p>
        <div class="tscroll"><table id="tbl"></table></div>
        ${S.breakWarning ? `<p class="warn">${esc(S.breakWarning)} — 이 사이트는 개편 전후 시군구를 병합해 표시합니다.</p>` : ""}
        <div class="warn"><b>이 표를 읽는 법</b> — 규범은 공장이지만 실현값은
          <b>수출자 주소</b>에 가깝습니다. 기초화장품 1위가 강남구($1,443M)인 것이 그 증거입니다.
          <b>이것은 제도의 한계가 아니라 신고 품질의 문제라서 품목마다 다릅니다</b> —
          ODM 직수출 비중이 높은 색조에서는 화성이 실제로 1위입니다.
          그러므로 이 표는 '공장 가동률'이 아니라 <b>그 지역 수출 주체의 출하</b>로 읽고,
          특정 ODM 의 가동률이 필요하면 그 회사의 공시를 보십시오.
          또 상위 몇 곳만 싣기 때문에 <b>순위 밖이라 안 보이는 것</b>과
          <b>애초에 안 잡히는 것</b>이 구분되지 않습니다 — 전 시군구는
          <code>scripts/dump_places.py</code> 가 컷 없이 찍습니다(매월 자동 실행, 로그).
          2026-09-01 부로 시군구 × HSK 10단위와 시군구 중량은 관세청 지침에 따라
          비공개입니다(이 사이트는 둘 다 쓰지 않아 직접 영향은 없습니다).</div>
      </section>
      <div id="pinned"></div>
    </div>`;

  renderNation(S);
  drawMap(document.getElementById("map"), S);

  // panel 2
  let idxSeries;
  if (splitMode){
    document.getElementById("p2note").innerHTML =
      `${esc(S.split.domName)}가 ${domShare.toFixed(0)}%라 같은 축에 못 올립니다. 첫 달을 100으로 지수화했습니다.`;
    idxSeries = [
      {name:S.split.domName, c:"--s1", v:ma3(S.split.domIdx)},
      {name:"그 외",         c:"--s2", v:ma3(S.split.restIdx)},
    ];
  } else {
    document.getElementById("p2note").textContent = "상위 카테고리의 최근 추이입니다.";
    idxSeries = S.cats.slice(0,3).map((c,i)=>({name:c.name, c:SER[i], v:ma3(c.m)}));
  }
  document.getElementById("lg-idx").innerHTML = idxSeries.map(s=>
    `<span class="lg"><span class="sw" style="background:var(${s.c})"></span>${esc(s.name)}</span>`).join("");
  lineChart(document.getElementById("idx"), S.months, idxSeries,
    {w:520,h:250,padR:62,zero:!splitMode,label:"추이",
     fmtY:v=>splitMode?Math.round(v):"$"+Math.round(v)+"M",
     fmtT:v=>splitMode?v.toFixed(0):"$"+v.toFixed(1)+"M"});

  // panel 3
  const nbCats = (splitMode ? rest : S.cats).slice(0,5);
  document.getElementById("p3note").textContent = splitMode
    ? `${S.split.domName}(${domShare.toFixed(0)}%)를 빼야 나머지가 보입니다. 범례를 눌러 계열을 켜고 끌 수 있습니다.`
    : "범례를 눌러 계열을 켜고 끌 수 있습니다.";
  const nbSeries = nbCats.map((c,i)=>({name:c.name, c:SER[i], v:ma3(c.m), off:false}));
  const drawNB = () => lineChart(document.getElementById("nb"), S.months, nbSeries,
    {w:980,h:270,padR:82,zero:true,label:"카테고리 월별 수출 추이",
     fmtY:v=>"$"+Math.round(v)+"M", fmtT:v=>"$"+v.toFixed(1)+"M"});
  document.getElementById("lg-nb").innerHTML = nbSeries.map((s,i)=>
    `<button class="lg" type="button" data-i="${i}" aria-pressed="true">
      <span class="sw" style="background:var(${s.c})"></span>${esc(s.name)}</button>`).join("");
  document.getElementById("lg-nb").addEventListener("click", e=>{
    const b=e.target.closest(".lg"); if(!b) return;
    const i=+b.dataset.i;
    if(nbSeries.filter(s=>!s.off).length===1 && !nbSeries[i].off) return;
    nbSeries[i].off=!nbSeries[i].off;
    b.setAttribute("aria-pressed", String(!nbSeries[i].off));
    drawNB();
  });
  drawNB();

  // table
  const drawTable = () => {
    const rows=[];
    S.cats.forEach(c=>{
      (showAll ? c.places : c.places.slice(0,3)).forEach((p,pi)=>rows.push({c,p,pi}));
    });
    document.getElementById("tbl").innerHTML =
      `<thead><tr><th class="l">카테고리</th><th class="l">시군구</th><th>${S.window}M $M</th>
        <th>YoY</th><th>최근${S.recent}M</th><th>가속</th>
        <th class="l">추이 (${S.months[0].slice(2)}–${S.months.at(-1).slice(2)})</th></tr></thead><tbody>` +
      (rows.length ? rows.map(({c,p,pi})=>`<tr class="${pi===0?'newcat':''}">
        <td class="l">${pi===0?`<span class="catcell">${esc(c.name)}</span> <span class="chip">${c.hs}</span>`:""}</td>
        <td class="l">${esc(p.place)}</td>
        <td>${p.ytd.toLocaleString()}</td>
        <td class="${p.yoy>0?'up':'down'}">${p.yoy==null?(p.new?`<span class="chip">신규</span>`:"–"):pct(p.yoy)}</td>
        <td class="${p.q3>0?'up':'down'}">${p.q3==null?"–":pct(p.q3)}</td>
        <td>${p.accel==null?"–":`<span class="chip ${p.accel>0?'up':'down'}">${p.accel>0?"+":""}${p.accel}%p</span>`}</td>
        <td class="l">${sparkSVG(p.v,"--s1")}</td></tr>`).join("")
        : `<tr><td class="l" colspan="7">표시할 시군구가 없습니다 (비교창 $1M 미만 제외).</td></tr>`) +
      "</tbody>";
  };
  // ── 고정 표시 지역 — 화면에서는 뺐다 (2026-09-23, 사용자 판단) ──────────
  // 데이터(cats[].pinned / placesCoverage)는 계속 만든다. 화면에 상설로 두는 대신
  // scripts/dump_places.py 가 카테고리별 **전 시군구**를 컷 없이 로그로 찍는다
  // (워크플로의 '진단 — 시군구 전체 덤프' 단계). 상설 패널보다 그쪽이 낫다:
  //   · 상위 8개가 기초 카테고리의 58% 밖에 설명하지 못하므로 6개 지역만 더 붙여도
  //     '나머지 42%' 문제가 풀리지 않는다
  //   · 지역 귀속은 수출자 자기신고 항목이라 품목마다 품질이 다르다 — 상설 지표로
  //     삼으면 그 편차를 상수처럼 읽게 된다
  // 되살리려면 이 블록에서 pinned 교차표를 다시 그리면 된다 (데이터는 그대로 있다).

  document.getElementById("tv").addEventListener("click", e=>{

/* ================= 유니버스 랭킹 ================= */
let UNI = null, uniSort = "accel", uniDir = -1, uniQ = "", uniPreset = "";
// 프리셋은 '필터', 헤더 클릭은 '정렬'. 둘은 독립이다.
const PRESETS = {
  "":      {t:"전체"},
  qTurn:   {t:"물량 턴어라운드", f:r=>r.qTurn},
  pTurn:   {t:"단가 전환",       f:r=>r.pTurn},
  clean:   {t:"기저 정상만",     f:r=>r.baseIdx==null||r.baseIdx>=0.75},
};
const COLS = [
  {k:"label", t:"항 · 대표품목", l:1},
  {k:"chapter", t:"장", l:1},
  {k:"usd",  t:m=>`${m}M $M`},
  {k:"yoy",  t:"YoY"},
  {k:"accel",t:"가속"},
  {k:"p",    t:"단가 $/kg"},
  {k:"pYoy", t:"P YoY"},
  {k:"kg",   t:"물량 톤"},
  {k:"qYoy", t:"Q YoY"},
];

function uniRows(){
  const q = uniQ.trim();
  let rows = UNI.items;
  if (q) rows = rows.filter(r =>
    r.hs4.includes(q) || (r.label||"").includes(q) || (r.chapter||"").includes(q));
  const pf = PRESETS[uniPreset]?.f;
  if (pf) rows = rows.filter(pf);
  const k = uniSort;
  const val = r => {
    const v = r[k];
    if (v == null) return uniDir < 0 ? -Infinity : Infinity;   // 빈 값은 항상 뒤로
    return typeof v === "string" ? v : +v;
  };
  rows = rows.slice().sort((a,b)=>{
    const x = val(a), y = val(b);
    if (typeof x === "string" || typeof y === "string")
      return String(x).localeCompare(String(y)) * (uniDir < 0 ? -1 : 1);
    return (x - y) * (uniDir < 0 ? -1 : 1);
  });
  return rows.slice(0, q || uniPreset ? 60 : 25);
}

function drawUniTable(){
  const rows = uniRows();
  const nd = n => n==null ? "–" : pct(n);
  const arrow = k => uniSort===k ? (uniDir<0?" ▾":" ▴") : "";
  const th = c => `<th class="${c.l?'l':''} sortable${uniSort===c.k?' sorted':''}"
    data-col="${c.k}" role="button" tabindex="0"
    title="클릭하면 이 열로 정렬합니다">${typeof c.t==="function"?c.t(UNI.window):c.t}${arrow(c.k)}</th>`;
  document.getElementById("unitbl").innerHTML = rows.length ? `
    <table class="wt"><thead><tr>${COLS.map(th).join("")}
      <th class="l">추이</th></tr></thead><tbody>` +
    rows.map(r=>`<tr class="itemrow">
      <td class="l"><span class="it">${esc(r.hs4)}</span>
        ${r.watched?'<span class="pu high">워치</span>':''}
        ${r.baseIdx!=null&&r.baseIdx<0.75?`<span class="pu warn" title="전년 동기 3개월이 그 품목 평년의 ${Math.round(r.baseIdx*100)}% 수준 — 가속이 기저효과일 수 있습니다">기저↓</span>`:''}
        ${r.baseIdx!=null&&r.baseIdx>1.25?`<span class="pu" title="전년 동기 3개월이 평년보다 높았음 — 가속이 과소평가될 수 있습니다">기저↑</span>`:''}
        <span class="tk">${esc(r.label||"–")}</span></td>
      <td class="l" style="font-size:11px;color:var(--ink-3)">${esc(r.chapter)}</td>
      <td>${fm(r.usd)}</td>
      <td class="${r.yoy>0?'up':'down'}">${nd(r.yoy)}</td>
      <td>${r.accel==null?"–":`<span class="chip ${r.accel>0?'up':'down'}">${r.accel>0?"+":""}${r.accel}%p</span>`}</td>
      <td>${r.p==null?"–":r.p.toLocaleString(undefined,{maximumFractionDigits:r.p<100?2:0})}</td>
      <td class="${r.pYoy>0?'up':'down'}">${nd(r.pYoy)}</td>
      <td>${fm(r.kg)}</td>
      <td class="${r.qYoy>0?'up':'down'}">${nd(r.qYoy)}</td>
      <td class="l">${sparkSVG(r.m,"--s1")}</td></tr>`).join("") + "</tbody></table>"
    : `<p class="pnote">조건에 맞는 항이 없습니다.</p>`;
  document.querySelectorAll("#unitbl th.sortable").forEach(h=>{
    const go = () => {
      const k = h.dataset.col;
      if (uniSort === k) uniDir = -uniDir; else { uniSort = k; uniDir = -1; }
      drawUniTable();
    };
    h.addEventListener("click", go);
    h.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} });
  });
}

/* ================= 속보 (10일 단위 잠정치) =================
   이 화면의 핵심은 '어떤 숫자를 크게 보여주는가'다.
   누계 YoY 를 헤드라인으로 두면 조업일수 잡음이 그대로 투자 판단에 들어간다.
   그래서 기본 정렬과 강조는 **점유율 변화(%p)** — 같은 순(旬) 안에서는 모든
   품목이 같은 날짜를 공유하므로 이 축만은 조업일수에 완전히 중립이다.       */
let FLASH = null, flSort = "shareChgPp", flDir = -1;

const FCOLS = [
  {k:"label",      t:"품목", l:1},
  {k:"shareChgPp", t:"점유율 Δ%p", hi:1},
  {k:"share",      t:"점유율 %"},
  {k:"wdYoy",      t:"평일 일평균 YoY"},
  {k:"yoy",        t:"누계 YoY"},
  {k:"usd",        t:"누계 $M"},
  {k:"est",        t:"월 착지추정 $M"},
  {k:"estYoy",     t:"착지 YoY"},
];

function drawFlashTable(){
  const rows = FLASH.items.slice().sort((a,b)=>{
    const x=a[flSort], y=b[flSort];
    if (typeof x === "string" || typeof y === "string")
      return String(x).localeCompare(String(y)) * (flDir<0?-1:1);
    const xv = x==null ? (flDir<0?-Infinity:Infinity) : +x;
    const yv = y==null ? (flDir<0?-Infinity:Infinity) : +y;
    return (xv-yv)*(flDir<0?-1:1);
  });
  const nd = n => n==null ? "–" : pct(n);
  const arrow = k => flSort===k ? (flDir<0?" ▾":" ▴") : "";
  const th = c => `<th class="${c.l?'l':''} sortable${flSort===c.k?' sorted':''}${c.hi?' hicol':''}"
    data-col="${c.k}" role="button" tabindex="0">${c.t}${arrow(c.k)}</th>`;
  document.getElementById("fltbl").innerHTML = `
    <table class="wt"><thead><tr>${FCOLS.map(th).join("")}
      <th class="l">월전체(잠정) 추이</th></tr></thead><tbody>` +
    rows.map(r=>{
      const sp = (r.series||[]).filter(x=>x!=null);
      const segs = Object.entries(r.segs||{}).filter(([,v])=>v!=null)
        .map(([k,v])=>`${k} $${fm(v)}M`).join(" · ");
      return `<tr class="itemrow">
      <td class="l"><span class="it">${esc(r.label)}</span>
        ${r.lumpy?'<span class="pu warn" title="인도(引渡) 단위로 한 번에 계상됩니다. 월 단위 변동이 원래 크므로 추세만 보세요.">건별</span>':''}
        ${r.watch&&r.watch.length?'<span class="pu high" title="워치리스트 10단위 품목과 연결됩니다">워치</span>':''}
        <span class="tk">${esc((r.tickers||[]).join(" · ")||r.hs||"")}</span></td>
      <td class="hicol">${r.shareChgPp==null?"–":
        `<span class="chip ${r.shareChgPp>0?'up':'down'}">${r.shareChgPp>0?"+":""}${r.shareChgPp}%p</span>`}</td>
      <td>${r.share==null?"–":r.share+"%"}</td>
      <td class="${r.wdYoy>0?'up':'down'}">${nd(r.wdYoy)}</td>
      <td class="${r.yoy>0?'up':'down'}">${nd(r.yoy)}</td>
      <td>${fm(r.usd)}</td>
      <td>${r.est==null?"–":fm(r.est)}</td>
      <td class="${r.estYoy>0?'up':'down'}">${nd(r.estYoy)}</td>
      <td class="l">${sp.length>3?sparkSVG(sp,"--s1"):""}
        <span class="tk">${esc(segs)}</span></td></tr>`;
    }).join("") + "</tbody></table>";
  document.querySelectorAll("#fltbl th.sortable").forEach(h=>{
    const go = () => {
      const k=h.dataset.col;
      if (flSort===k) flDir=-flDir; else { flSort=k; flDir=-1; }
      drawFlashTable();
    };
    h.addEventListener("click", go);
    h.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} });
  });
}

      ${wdDiff!=null&&wdDiff!==0 ? `<br><b>이번 순은 평일이 작년보다 ${wdDiff>0?"+":""}${wdDiff}일

    <div class="panel p12">

        번호를 한 칸 밀려 읽으면 산업을 통째로 바꿔 읽게 되므로, 우리가 따로 수집한
        SSD(HSK 8523511000) 실측 시계열과 대조해 확정했습니다
        (레벨 상관 r=0.9999 · 전월비 상관 r=0.977).

      <div class="tscroll" id="fltbl"></div>
    </div>

    ${flashResidual()}

    <div class="panels">
      ${(FLASH.ratios||[]).map(r=>`<div class="panel p6">
        <div class="phead"><h3 class="ptitle">${esc(r.name)}</h3>
          <span class="unit">${esc(r.num)} ÷ ${esc(r.den)}</span></div>
        <div class="stat" style="padding:0">
          <div class="v">${r.prev==null?"–":r.prev} → ${r.now==null?"–":r.now}</div>
          <div class="d"><span class="${r.chgPct>0?'up':'down'}">${r.chgPct==null?"–":pct(r.chgPct)}</span>
            ${r.risingMeans?` · 상승 = ${esc(r.risingMeans)}`:""}</div></div>
        <p class="pnote" style="margin-top:12px">${esc(r.note||"")}</p></div>`).join("")}

    ${rec ? `<div class="warn" style="border-left-color:var(--${rec.ok?"good":"crit"})">
      <b>잠정↔확정 정합성</b> — ${esc(rec.period)} 월전체 잠정 $${fm(rec.flash)}M vs
      확정 통계 $${fm(rec.confirmed)}M = <b>${rec.gapPct>0?"+":""}${rec.gapPct}%</b>
      ${rec.ok ? `(허용 ±${rec.tol}% 이내 — 잠정치와 확정치의 차이는 정상입니다)`
               : `<b>— 허용 ±${rec.tol}% 를 벗어났습니다. 슬롯 매핑이나 단위를 의심해야 합니다.</b>`}
      </div>` : ""}

    ${FLASH.countryVerified && (FLASH.countries||[]).length ? `
    <div class="panel p12">

        </div>` : "")}

    <div class="warn"><b>이 레이어의 한계</b> — ① <b>잠정치</b>입니다. 다음 발표 때 소급 조정됩니다
      (조정 내역은 revisions 표에 남습니다). ② 상위 10대 품목·10대 교역국만 나옵니다.
      HSK 10단위 분해도, <b>품목×국가 교차도 불가능</b>합니다 — 그건 월별 확정 데이터가 나온 뒤
      워치리스트·밸류체인 탭에서 봐야 합니다. ③ 품목 분류는 관세청 속보 기준이라
      우리 워치리스트의 HSK 분류와 경계가 정확히 일치하지 않습니다(예: '컴퓨터 주변기기'의

  drawFlashTable();

/* ================= 2차전지·ESS 심화 =================
   수출액만 보는 레이어가 답하지 못하는 두 가지를 다룬다.
     · 마진이 어디로 가는가  → 원가는 **수입** 데이터에 있다
     · 지금 끌고 있는 단계는 → 단계 간 시차 상관으로 잰다                 */
let BAT = null;
const BSTAGE = {final:"완제품(셀)", component:"부품", material:"소재", equipment:"장비(CAPEX)"};
const BVCLS = {turnaround:"vd-good", accelerating:"vd-good", bottoming:"vd-loc",
               steady:"vd-na", decelerating:"vd-mix", contracting:"vd-bad",
               expanding:"vd-good", compressing:"vd-bad", flat:"vd-na", unknown:"vd-na",
               // 공급기지 판정 (수요시장과 묻는 질문이 다르다 — kortrade/localization.py)
               ramp:"vd-good", running:"vd-good", preparing:"vd-loc", slowing:"vd-bad"};

/* ── 2차전지 시각화 ────────────────────────────────────────────────────────
   이 탭은 분석은 다 하고 있었는데 **표만 있어서 한눈에 안 들어왔다.** 화장품 탭이
   로테이션 맵·지수·추이 3종으로 읽히는 것과 같은 자리를 만든다.

   다만 축은 다르다. 화장품의 축은 '어느 카테고리가 몫을 가져가나'(성장률 × 비중변화)이고,
   2차전지의 축은 **'사이클 어디에 있나'(성장률 × 가속)** 이다. 이 산업은 비중 싸움이
   아니라 증설–가동–재고 사이클이 문제라서, 부호가 바뀌는 자리(턴어라운드)가 핵심이다.
   ────────────────────────────────────────────────────────────────────────── */
const BSCOL = {final:"--s1", component:"--s2", material:"--s3", equipment:"--s4"};
// 최종 수요 판정 — '현지화'와 '점유율 상실'은 한국 수출을 똑같이 줄이지만
// 투자 판단이 정반대다. 색으로 먼저 갈라 준다.
const DVCLS = {share_loss:"vd-bad", demand_down:"vd-bad", onshoring:"vd-loc",
               base_shift:"vd-loc",
               demand_ok_partial:"vd-na", level_only:"vd-na",
               localizing:"vd-loc", share_down_unknown:"vd-mix",
               expanding:"vd-good", share_gain:"vd-good", mixed:"vd-mix",
               partial:"vd-na", unknown:"vd-na"};
const BACL = {x:[-60,120], y:[-70,70]};   // 극단값은 가장자리로 밀고 점선으로 표시만 바꾼다

// 단계 롤업이 아니라 **품목**을 찍는다. 롤업만 보면 한 단계 안에서 갈리는 품목을 못 본다
// (실측: 체인 합계 +13% 인데 ESS셀은 −13% 였다).
const batteryItems = B => (B.stages||[]).flatMap(s =>
  (s.items||[]).map(i => Object.assign({}, i, {stage:s.stage})));

function drawAccelMap(mount, B){
  const W=620,H=420,M={t:16,r:24,b:44,l:56}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const pts = batteryItems(B).filter(r=>r.yoy!=null && r.accel!=null && r.usd>0);
  if (pts.length < 2){
    mount.innerHTML='<p class="pnote">전년 동기 비교가 가능한 12개월 이상 데이터가 아직 없습니다.</p>';
    return;
  }
  const [cx0,cx1]=BACL.x, [cy0,cy1]=BACL.y;
  const X=v=>M.l+(Math.min(cx1,Math.max(cx0,v))-cx0)/(cx1-cx0)*iw;
  const Y=v=>M.t+ih-(Math.min(cy1,Math.max(cy0,v))-cy0)/(cy1-cy0)*ih;
  const maxU=Math.max(...pts.map(p=>p.usd));
  const R=u=>6+Math.sqrt(Math.max(u,0)/maxU)*38;
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img",
    "aria-label":"품목별 성장률 대비 가속 사분면 — 턴어라운드 탐지"});

  // 좌상(감소인데 가속 = 턴어라운드)을 강조한다. 투자 타이밍이 만들어지는 칸이다.
  s.appendChild(el("rect",{x:M.l,y:M.t,width:Math.max(0,X(0)-M.l),
    height:Math.max(0,Y(0)-M.t),fill:cv("--s4"),opacity:.07}));
  // 우하(성장인데 감속 = 피크 주의)
  s.appendChild(el("rect",{x:X(0),y:Y(0),width:Math.max(0,M.l+iw-X(0)),
    height:Math.max(0,M.t+ih-Y(0)),fill:cv("--crit"),opacity:.05}));

  [-50,-25,0,25,50].filter(v=>v>cy0&&v<cy1).forEach(v=>{
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(v),y2:Y(v),class:v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:M.l-8,y:Y(v)+3.5,class:"tk","text-anchor":"end"}),
      {textContent:(v>0?"+":"")+v+"%p"}));
  });
  [-50,0,50,100].filter(v=>v>=cx0&&v<=cx1).forEach(v=>{
    s.appendChild(el("line",{y1:M.t,y2:M.t+ih,x1:X(v),x2:X(v),class:v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:X(v),y:M.t+ih+16,class:"tk","text-anchor":"middle"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });
  const quad=(x,y,t,a)=>s.appendChild(Object.assign(
    el("text",{x,y,class:"quad","text-anchor":a}),{textContent:t}));
  quad(M.l+4,      M.t+13,   "감소 → 가속 · 턴어라운드", "start");
  quad(M.l+iw-4,   M.t+13,   "성장 → 가속", "end");
  quad(M.l+4,      M.t+ih-6, "감소 → 감속 · 악화", "start");
  quad(M.l+iw-4,   M.t+ih-6, "성장 → 감속 · 피크 주의", "end");
  s.appendChild(Object.assign(el("text",{x:M.l+iw/2,y:H-6,class:"tk","text-anchor":"middle"}),
    {textContent:`최근 ${B.window}개월 YoY →`}));
  s.appendChild(Object.assign(el("text",{x:14,y:M.t+ih/2,class:"tk","text-anchor":"middle",
    transform:`rotate(-90 14 ${M.t+ih/2})`}),{textContent:`가속 (최근 ${B.recent}M − ${B.window}M, %p)`}));

  const placed=[];
  pts.slice().sort((a,b)=>b.usd-a.usd).forEach(p=>{
    const x=X(p.yoy), y=Y(p.accel), r=R(p.usd);
    const out = p.yoy<cx0||p.yoy>cx1||p.accel<cy0||p.accel>cy1;
    const c = cv(BSCOL[p.stage]||"--s5");
    const g = el("g",{});
    g.appendChild(el("circle",{cx:x,cy:y,r:r+2,fill:cv("--surface")}));
    g.appendChild(el("circle",{cx:x,cy:y,r,fill:c,opacity:out?.25:.5,
      stroke:c,"stroke-width":out?2:1.5,"stroke-dasharray":out?"3 2":""}));
    g.style.cursor="pointer";
    g.addEventListener("mousemove", e=>showTip(e,
      `<b>${esc(p.label)}</b> <span class="tk">${esc(p.code)}</span><br>`+
      `${esc(BSTAGE[p.stage]||p.stage)} · $${fm(p.usd)}M<br>`+
      `${B.window}M YoY ${pct(p.yoy)} → 최근 ${B.recent}M ${pct(p.recentYoy)}<br>`+
      `가속 ${p.accel>0?"+":""}${p.accel}%p · ${esc(p.verdict?.label||"")}`+
      (out?"<br>※ 축 범위 밖(점선)":"")));
    g.addEventListener("mouseleave", hideTip);
    s.appendChild(g);
    if (r >= 12){
      const txt = p.label.length>9 ? p.label.slice(0,8)+"…" : p.label;
      const w = [...txt].reduce((a,ch)=>a+(/[ㄱ-힝]/.test(ch)?11.2:6),0)+6;
      const free=(lx,ly)=> lx-w/2>M.l+2 && lx+w/2<M.l+iw-2 && ly>M.t+10 && ly<M.t+ih-4 &&
        !placed.some(q=>Math.abs(q.x-lx)<(q.w+w)/2+8 && Math.abs(q.y-ly)<15) &&
        !pts.some(o=>o!==p && Math.abs(X(o.yoy)-lx)<w/2+R(o.usd) &&
                     Math.abs(Y(o.accel)-ly)<R(o.usd)+5);
      let put=null;
      for (const dy of [-(r+7), r+15, -(r+21), r+29]){ if(free(x,y+dy)){put={x,y:y+dy};break;} }
      if (put) { s.appendChild(Object.assign(el("text",{x:put.x,y:put.y,class:"dlab",
        "text-anchor":"middle"}),{textContent:txt})); placed.push({x:put.x,y:put.y,w}); }
    }
  });
  mount.replaceChildren(s);
}

/* 완제품 vs 부품·소재 지수. 화장품의 '기초 vs 그 외'와 같은 자리다.
   두 선이 벌어지면 그게 현지화다 — 완제품은 눕는데 상류가 계속 크는 그림. */
function batteryIndex(B){
  const sm = {}; (B.stages||[]).forEach(s => sm[s.stage] = s.m || []);
  const n = (B.months||[]).length;
  const fin = [], up = [];
  for (let i=0;i<n;i++){
    fin.push(+(sm.final?.[i] || 0));
    up.push(+((sm.component?.[i] || 0) + (sm.material?.[i] || 0)));
  }
  // 기준월은 **둘 다 0 이 아닌 첫 달**로 잡는다. 0 으로 나누면 계열이 통째로 사라진다.
  let b = -1;
  for (let i=0;i<n;i++) if (fin[i] > 0 && up[i] > 0) { b = i; break; }
  if (b < 0) return null;
  return {base: B.months[b],
          fin: fin.map((v,i)=> i<b ? null : +(v/fin[b]*100).toFixed(1)),
          up:  up.map((v,i)=> i<b ? null : +(v/up[b]*100).toFixed(1))};
}

function drawSpread(mount, sp, months){
  const W=760,H=240,M={t:16,r:20,b:34,l:52}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const pts = (sp.series||[]).map((x,i)=>({i,x})).filter(p=>p.x!=null);
  if (pts.length < 6){ mount.innerHTML='<p class="pnote">잔차를 그릴 데이터가 부족합니다.</p>'; return; }
  const ys = pts.map(p=>p.x), lo=Math.min(0,...ys), hi=Math.max(0,...ys), pad=(hi-lo)*0.15||1;
  const X = i => M.l + (i/(months.length-1))*iw;
  const Y = v => M.t + ih - ((v-(lo-pad))/((hi+pad)-(lo-pad)))*ih;
  const s = el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img",
    "aria-label":"마진 프록시 — 원가로 설명되지 않는 판가(회귀 잔차) 추이"});
  [lo-pad, (lo+hi)/2, hi+pad, 0].forEach(g=>{
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(g),y2:Y(g),class:g===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:M.l-8,y:Y(g)+3.5,class:"tk","text-anchor":"end"}),
      {textContent:g.toFixed(1)}));
  });
  months.forEach((m,i)=>{ if(i%6===0) s.appendChild(Object.assign(
    el("text",{x:X(i),y:M.t+ih+16,class:"tk","text-anchor":"middle"}),{textContent:m.slice(2)}));});
  s.appendChild(el("path",{d: pts.map((p,k)=>`${k?"L":"M"}${X(p.i).toFixed(1)},${Y(p.x).toFixed(1)}`).join(""),
    fill:"none", stroke:cv("--s2"), "stroke-width":2, "stroke-linejoin":"round"}));
  const last = pts[pts.length-1];
  s.appendChild(el("circle",{cx:X(last.i),cy:Y(last.x),r:4,fill:cv("--s2"),
    stroke:cv("--surface"),"stroke-width":2}));
  s.appendChild(Object.assign(el("text",{x:X(last.i)-6,y:Y(last.x)-9,class:"dlab","text-anchor":"end"}),
    {textContent:last.x.toFixed(2)+"$/kg"}));
  mount.innerHTML=""; mount.appendChild(s);
}

/* ── 최종 수요 대조 ────────────────────────────────────────────────────────
   이 프로젝트가 반복해서 부딪힌 벽: 對미 ESS 수출 −13% 가 셋 중 무엇인가.
     (a) 미국 수요가 줄었다  (b) 현지 생산으로 옮겨갔다  (c) 점유율을 뺏겼다
   현지화지수는 (a)와 (b)를 부분적으로 가른다. **(c)는 한국 수출 데이터만으로는
   원리적으로 볼 수 없다** — 미국 시장이 두 배가 됐는지 반토막 났는지 알 방법이 없다.
   (b)와 (c)는 투자 판단이 정반대라서 이 구분이 이 패널의 존재 이유다.

   ★ 세 축을 합치지 않는다. 단위(달러 vs MW)도 출처도 갱신주기도 다르다.
     지수화해 방향만 나란히 놓는다. 합치는 순간 근거 없는 '글로벌 공급량'이 된다. */
function renderDemand(host, D){
  if (!host) return;
  if (!D || !D.ok){
    host.innerHTML = `
      <section class="panel p12">
        <div class="phead"><h2 class="ptitle">최종 수요 대조 — 아직 연결 전</h2>
          <span class="unit">무료 키 2개 필요</span></div>
        <p class="pnote">한국 수출만 보면 <b>'현지화'와 '점유율 상실'을 구분할 수 없습니다.</b>

/* 이 탭의 첫 화면. 표로 답하던 것을 그림으로 먼저 답한다 —
   ① 어느 품목이 사이클 어디에 있나 ② 완제품과 상류가 벌어지고 있나
   ③ 단계별로 무엇이 크고 무엇이 꺾였나. */
function renderBatteryCharts(B){
  const host = document.getElementById("bcharts");
  if (!host) return;

  const items = batteryItems(B);

                    .sort((a,b)=>b.usd-a.usd);
  const chips = (B.stages||[]).map(s=>
    `<span class="lg"><span class="sw" style="background:var(${BSCOL[s.stage]||"--s5"})"></span>${
      esc(BSTAGE[s.stage]||s.stage)}</span>`).join("");

  host.innerHTML = `
    <section class="panel p7">
      <div class="phead"><h2 class="ptitle">사이클 맵</h2>

  drawAccelMap(document.getElementById("bmap"), B);

       같은 축에 둔다 — 레벨 비교가 아니라 **방향과 변곡**을 보는 자리다. */
  const aspItems = batteryItems(B)
    .filter(r => (r.aspM||[]).some(v=>v!=null) && r.stage !== "equipment")

     fmtY:v=>"$"+(v>=100?Math.round(v):v.toFixed(1)),
     fmtT:v=>"$"+v.toFixed(2)+"/kg"});
  const lga = document.getElementById("lg-basp");

    lga.innerHTML = aser.map((x,i)=>`<button class="lg" type="button" data-i="${i}"

        esc(x.name)}</button>`).join("");

      b.setAttribute("aria-pressed", String(!aser[i].off));
      drawA();

    drawA();

  if (idx){
    lineChart(document.getElementById("bidx"), B.months,

       {name:"부품+소재", c:"--s3", v:ma3(idx.up)}],
      {w:520,h:250,padR:62,label:"완제품 vs 부품·소재 지수",
       fmtY:v=>Math.round(v), fmtT:v=>v.toFixed(0)});
  } else {
    document.getElementById("bidx").innerHTML =
      '<p class="pnote">완제품과 부품·소재가 함께 잡히는 달이 없어 지수를 만들 수 없습니다.</p>';
  }

  const ser = (B.stages||[]).map(s=>({name:BSTAGE[s.stage]||s.stage,
    c:BSCOL[s.stage]||"--s5", v:ma3(s.m||[]), off:false}));
  const draw = () => lineChart(document.getElementById("bstage"), B.months, ser,
    {w:980,h:270,padR:96,zero:true,label:"단계별 월별 수출 추이",
     fmtY:v=>"$"+Math.round(v)+"M", fmtT:v=>"$"+v.toFixed(1)+"M"});
  const lg = document.getElementById("lg-bst");
  lg.innerHTML = ser.map((s,i)=>`<button class="lg" type="button" data-i="${i}"
    aria-pressed="true"><span class="sw" style="background:var(${s.c})"></span>${esc(s.name)}</button>`).join("");
  lg.addEventListener("click", e=>{
    const b=e.target.closest(".lg"); if(!b) return;
    const i=+b.dataset.i;
    if (ser.filter(s=>!s.off).length===1 && !ser[i].off) return;   // 전부 끄면 빈 축이 남는다
    ser[i].off=!ser[i].off;
    b.setAttribute("aria-pressed", String(!ser[i].off));
    draw();
  });
  draw();
}

/* 시장별 현지화지수 추이. 표의 '0.70 → 1.56' 두 점만으로는 전환이 **언제** 시작됐는지
   알 수 없다. 현지화는 국가 단위로 일어나므로 전체 합계만 보면 미국 전환이 유럽 증가에 묻힌다. */
function drawLocTrend(mount, legend, B){
  if (!mount) return;
  const live = (B.markets||[]).filter(m => (m.mLoc||[]).filter(x=>x!=null).length >= 6)
                              .slice(0, 5);
  if (live.length < 1){
    mount.innerHTML = '<p class="pnote">현지화지수를 그릴 만큼의 월별 데이터가 아직 없습니다.</p>';
    if (legend) legend.innerHTML = "";
    return;
  }
  const ser = live.map((m,i)=>({name: m.market==="ALL"?"전체":m.market,
                                c: SER[i % SER.length], v: ma3(m.mLoc), off:false}));
  const draw = () => lineChart(mount, B.months, ser,
    {w:980,h:250,padR:76,zero:true,label:"시장별 현지화지수 추이",
     fmtY:v=>v.toFixed(1), fmtT:v=>v.toFixed(2)});
  if (legend){
    legend.innerHTML = ser.map((s,i)=>`<button class="lg" type="button" data-i="${i}"
      aria-pressed="true"><span class="sw" style="background:var(${s.c})"></span>${esc(s.name)}</button>`).join("");
    legend.addEventListener("click", e=>{
      const b=e.target.closest(".lg"); if(!b) return;
      const i=+b.dataset.i;
      if (ser.filter(s=>!s.off).length===1 && !ser[i].off) return;
      ser[i].off=!ser[i].off;
      b.setAttribute("aria-pressed", String(!ser[i].off));
      draw();
    });
  }
  draw();
}

function renderBattery(){
  const v = document.getElementById("view");
  if (!BAT){
    v.innerHTML = `<div class="empty"><h3>2차전지·ESS — 아직 수집 전입니다</h3>
      <p>원가(수입)·판가(수출)·장비(CAPEX)를 함께 보는 레이어입니다.</p>
      <code>python scripts/run_watchlist.py &amp;&amp; python scripts/build_battery.py</code></div>`;
    return;
  }
  const t = BAT.total, sp = BAT.spread, lead = (BAT.leadlag||[])[0];
  const li = (BAT.costs||[]).find(c=>c.code===sp.costCode) || (BAT.costs||[])[0];
  const pct1 = n => n==null ? "–" : (n>0?"+":"")+n+"%";

  v.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">체인 전체 (최근 ${BAT.window}개월)</div>
        <div class="v">$${fm(t.usd)}M</div>
        <div class="d">YoY <span class="${t.yoy>0?'up':'down'}">${pct1(t.yoy)}</span>
          → 최근 ${BAT.recent}M <span class="${t.recentYoy>0?'up':'down'}">${pct1(t.recentYoy)}</span></div></div>
      <div class="stat"><div class="k">사이클 판정</div>
        <div class="v" style="font-size:21px">${esc(t.verdict.label)}</div>
        <div class="d">가속 ${t.accel==null?"–":(t.accel>0?"+":"")+t.accel+"%p"}</div></div>
      <div class="stat"><div class="k">양극재 마진 방향</div>
        <div class="v" style="font-size:21px">${esc(sp.linked?sp.verdict.label:"판정 불가")}</div>
        <div class="d">${sp.linked?`잔차 ${sp.e3m} → ${sp.eNow} $/kg`:"원가 연동 미확인"}</div></div>
      <div class="stat"><div class="k">${esc(li?li.label:"리튬")} 수입단가</div>
        <div class="v">$${li&&li.price!=null?li.price:"–"}</div>
        <div class="d">/kg · 3개월 <span class="${li&&li.priceMom3>0?'up':'down'}">${li?pct1(li.priceMom3):"–"}</span>
          — 오르면 양극재엔 호재(판가연동·재고평가)</div></div>
    </div>

    <p class="thesis">수출액만 보면 2차전지는 <b>판가(P) 하락을 수요 감소로 오독</b>합니다.
      양극재 판가는 리튬 가격에 시차를 두고 연동되는 구조이고, <b>원가는 수출이 아니라
      수입 데이터에 있습니다.</b> 우리가 쓰는 품목별 API 는 수입금액·수입중량을 함께
      주는데 그동안 쓰지 않던 절반입니다. 이 탭은 그 절반을 붙여 <b>마진 방향</b>과
      <b>사이클을 끌고 있는 단계</b>를 봅니다.</p>

    <div class="panels">
      <div id="bcharts"></div>
      <div class="panel p12">
        <div class="phead"><h3 class="ptitle">마진 프록시 — 원가로 설명되지 않는 판가</h3>
          <span class="unit">회귀 잔차 $/kg</span></div>
        ${sp.linked ? `
        <p class="pnote">양극재 수출단가 P 를 ${esc(sp.costLabel)} 수입단가 C 에 회귀했습니다:
          <code>P(t) = α + β·C(t−${sp.lag}) + e(t)</code>.
          <b>리튬 원단위(kg/kg)를 상수로 가정하지 않습니다</b> — 출처 없는 상수를 넣으면
          그 가정이 결과를 만듭니다. 대신 β 가 <b>실측 전가율</b>이고, 잔차 e(t) 가
          원가로 설명되지 않는 판가, 즉 <b>마진 프록시</b>입니다. 올라가면 마진이 벌어지는 중입니다.</p>
        <div class="legend">
          <span class="lg"><b>P</b> $${sp.pNow}/kg</span>
          <span class="lg"><b>C</b> $${sp.cNow}/kg</span>
          <span class="lg"><b>β</b> ${sp.beta}</span>
          <span class="lg"><b>시차</b> ${sp.lag}개월</span>
          <span class="lg"><b>수준 R²</b> ${sp.r2}</span>
          <span class="lg"><b>차분 R²</b> ${sp.diffR2}</span>
          <span class="lg"><b>표본</b> ${sp.n}개월</span>
        </div>
        <div id="bspread"></div>
        <div class="warn" style="margin-top:12px"><b>시차 식별</b> —
          ${sp.lagIdentified
            ? `시차별 <b>차분</b> R² 곡선에서 ${sp.lag}개월이 뚜렷이 우세했습니다.`
            : `시차별 차분 R² 곡선이 <b>평탄해 시차가 식별되지 않았습니다</b>
               (${(sp.lagCurve||[]).map(c=>`${c.lag}M:${c.r2}`).join(" · ")}).
               원가 시계열이 매끄러우면 어느 시차를 넣어도 비슷하게 맞습니다 —
               <b>시차 값은 참고로만</b> 보세요. 잔차의 <b>방향</b>은 시차 선택에 크게
               좌우되지 않으므로 그쪽이 더 믿을 만합니다.`}
          <br>※ 시차는 <b>수준이 아니라 차분</b>으로 찾습니다. 수준끼리는 둘 다 추세를 갖고 있어
          어느 시차나 R² 가 높게 나오고, 그러면 '시차 0개월'이 발견이 아니라 계산의 부산물이 됩니다.</div>
        <div class="warn"><b>이 판정은 양극재에만 적용됩니다</b> —
          양극재(에코프로비엠·포스코퓨처엠)는 판가 연동 + 재고평가 구조라
          <b>리튬 상승이 호재</b>입니다. 셀 메이커(삼성SDI·LG엔솔)는 판가 연동 계약 여부에 따라
          중립이거나 원가 압박이라 기제가 다릅니다. 둘을 한 문장으로 묶으면 안 됩니다.
          <b>이 레이어는 셀 마진을 추정하지 않습니다.</b></div>

/* ================= 밸류체인 (해외 현지생산 보정) ================= */
let CHAINS = null, chainMkt = {};
const VCLS = {localizing:"vd-loc", mixed:"vd-mix", contracting:"vd-bad",
              expanding:"vd-good", expanding_local:"vd-good", unknown:"vd-na"};

/* 밸류체인 전용 뷰(체인 탭의 렌더러와 현지화지수 차트)는 제거했다 (2026-09-23).
   배터리 현지화 분석은 '2차전지·ESS' 탭으로 흡수했고, 거기서 원가·장비·선후행과
   함께 읽는 편이 훨씬 낫다. 다만 chains.json 은 계속 만든다 — 바로 아래
   localizationWarn 이 그걸 읽어 워치리스트 각 품목에 현지화 배지를 붙인다
   (자동차 체인 포함). 데이터는 살아 있고 전용 화면만 없앤 것이다. */

function localizationWarn(hsk){
  if (!CHAINS) return null;
  for (const ch of CHAINS.chains){
    for (const v of ch.views){
      // 체인 합계가 아니라 **그 품목**의 판정을 본다.
      // 실측: 체인 전체 +13% 인데 ESS셀만 −13% — 합계로는 안 잡힌다.
      const fi = (v.finals||[]).find(f => hsk.includes(f.code) &&
        (f.verdict.code==="localizing" || f.verdict.code==="mixed"));
      if (fi) return {chain:ch.name, market:v.market==="ALL"?"전체":v.market,
                      item:fi, note:fi.verdict.note, label:fi.verdict.label};
    }
  }
  return null;
}

/* ================= 전산업 스캐너 ================= */
const GC = {consumer:"--s1", ithw:"--s2", heavy:"--s3", content:"--s4"};
const CLAMP = {x:[-70,140], y:[-60,90]};   // 극단값은 가장자리로 밀고 표시만 바꾼다

function drawPQ(mount, WL){
  const W=760,H=430,M={t:18,r:26,b:46,l:56}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const pts = WL.items.filter(r => r.ready && r.qYoy!=null && r.pYoy!=null);
  if (pts.length < 2){
    mount.innerHTML = '<p class="pnote">물량·단가 YoY를 둘 다 계산할 수 있는 품목이 아직 부족합니다 (전년 동기 12개월 필요).</p>';
    return;
  }
  const cx0=CLAMP.x[0], cx1=CLAMP.x[1], cy0=CLAMP.y[0], cy1=CLAMP.y[1];
  const X = v => M.l + (Math.min(cx1,Math.max(cx0,v)) - cx0)/(cx1-cx0)*iw;
  const Y = v => M.t + ih - (Math.min(cy1,Math.max(cy0,v)) - cy0)/(cy1-cy0)*ih;
  const maxU = Math.max(...pts.map(p=>p.usd));
  const R = u => 5 + Math.sqrt(Math.max(u,0)/maxU)*22;

  const s = el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img",
    "aria-label":"물량 대비 단가 변화 사분면 맵"});

  // 사분면 배경 — 우상(수요 확장)만 은은하게 강조
  s.appendChild(el("rect",{x:X(0),y:M.t,width:Math.max(0,M.l+iw-X(0)),
    height:Math.max(0,Y(0)-M.t),fill:cv("--s3"),opacity:.05}));

  [cy0,0,cy1].concat([-30,30,60]).filter(v=>v>cy0&&v<cy1).forEach(v=>{
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(v),y2:Y(v),
      class: v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:M.l-8,y:Y(v)+3.5,class:"tk","text-anchor":"end"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });
  [-50,0,50,100].filter(v=>v>=cx0&&v<=cx1).forEach(v=>{
    s.appendChild(el("line",{y1:M.t,y2:M.t+ih,x1:X(v),x2:X(v), class: v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:X(v),y:M.t+ih+16,class:"tk","text-anchor":"middle"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });

  const quad = (x,y,t,anchor) => s.appendChild(Object.assign(
    el("text",{x,y,class:"quad","text-anchor":anchor}), {textContent:t}));
  quad(M.l+iw-4, M.t+13, "물량↑ 단가↑ · 수요 확장", "end");
  quad(M.l+iw-4, M.t+ih-6, "물량↑ 단가↓ · 점유율 경쟁", "end");
  quad(M.l+4,    M.t+13, "물량↓ 단가↑ · 믹스 개선·감산", "start");
  quad(M.l+4,    M.t+ih-6, "물량↓ 단가↓ · 위축", "start");

  s.appendChild(Object.assign(el("text",{x:M.l+iw/2,y:H-6,class:"tk","text-anchor":"middle"}),
    {textContent:"물량(중량) YoY →"}));
  s.appendChild(Object.assign(el("text",{x:14,y:M.t+ih/2,class:"tk","text-anchor":"middle",
    transform:`rotate(-90 14 ${M.t+ih/2})`}), {textContent:"단가($/kg) YoY"}));

  const placed = [];
  pts.slice().sort((a,b)=>b.usd-a.usd).forEach(p=>{
    const x=X(p.qYoy), y=Y(p.pYoy), r=R(p.usd);
    const clamped = p.qYoy<cx0||p.qYoy>cx1||p.pYoy<cy0||p.pYoy>cy1;
    const c = cv(GC[p.group] || "--s5");
    const g = el("g",{});
    g.appendChild(el("circle",{cx:x,cy:y,r:r+2,fill:cv("--surface")}));   // 2px 겹침 링
    g.appendChild(el("circle",{cx:x,cy:y,r,fill:c,opacity:clamped?.3:.5,
      stroke:c,"stroke-width":clamped?2:1.5,"stroke-dasharray":clamped?"3 2":""}));
    g.style.cursor="pointer";
    const html = `<b>${esc(p.name)}</b><br>${esc((p.tickers||[])[0]||"")}<br>`+
      `금액 $${fm(p.usd)}M · YoY ${pct(p.yoy)}<br>`+
      `물량 ${fm(p.kg)}톤 · YoY ${pct(p.qYoy)}<br>`+
      `단가 $${p.p==null?"–":p.p.toLocaleString()}/kg · YoY ${pct(p.pYoy)}`+
      (clamped?"<br>※ 축 범위 밖(점선)":"");
    g.addEventListener("mousemove", e=>showTip(e, html));
    g.addEventListener("mouseleave", hideTip);
    s.appendChild(g);

    // 큰 품목만 직접 라벨 — 모든 점에 숫자를 붙이지 않는다.
    // 자리가 없으면 라벨을 **버린다**(겹쳐 찍느니 호버로 읽게 한다).
    if (r >= 13){
      const txt = p.name.length>11 ? p.name.slice(0,10)+"…" : p.name;
      // 한글은 글자폭이 font-size 에 가깝고 라틴은 절반쯤이다. 한 글자 6.4px 로
      // 잡았더니 실제보다 40% 좁게 계산돼 라벨이 겹쳤다.
      const w = [...txt].reduce((a,ch)=> a + (/[\u3131-\uD79D]/.test(ch) ? 11.2 : 6), 0) + 6;
      const free = (lx,ly) => lx-w/2 > M.l+2 && lx+w/2 < M.l+iw-2 &&
        ly > M.t+10 && ly < M.t+ih-4 &&
        !placed.some(q => Math.abs(q.x-lx) < (q.w+w)/2+8 && Math.abs(q.y-ly) < 15) &&
        !pts.some(o => o!==p && Math.abs(X(o.qYoy)-lx) < w/2+R(o.usd) &&
                       Math.abs(Y(o.pYoy)-ly) < R(o.usd)+5);
      // 위/아래로만 밀어 올린다. 옆으로 밀면 이웃 버블 위에 얹히기 쉽다.
      let put = null;
      for (const dy of [-(r+7), r+15, -(r+21), r+29, -(r+35), r+43]){
        if (free(x, y+dy)) { put = {x, y:y+dy}; break; }
      }
      if (put){
        s.appendChild(Object.assign(
          el("text",{x:put.x,y:put.y,class:"dlab","text-anchor":"middle"}), {textContent:txt}));
        placed.push({x:put.x, y:put.y, w});
      }
    }
  });
  mount.innerHTML = ""; mount.appendChild(s);
}

function sigCard(title, sub, keys, WL, fmt){
  const rows = keys.map(k => WL.items.find(r=>r.key===k)).filter(Boolean);
  return `<div class="sigcard${rows.length?"":" empty-c"}">
    <h4>${esc(title)}</h4><div class="sub">${esc(sub)}</div>
    <ol>${rows.length ? rows.map(r=>`<li><span class="nm">${esc(r.name)}</span>
      <span class="vl ${fmt(r).n>0?'up':'down'}">${esc(fmt(r).t)}</span></li>`).join("")
      : "<li>해당 품목 없음</li>"}</ol></div>`;
}
