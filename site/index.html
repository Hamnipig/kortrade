<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수출 섹터 로테이션</title>
<meta name="description" content="관세청 시군구별 수출 데이터로 섹터·카테고리 비중 이동을 추적합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f4f1; --surface:#fbfbfa; --surface-2:#f0f0ec;
  --ink:#0d0f0e; --ink-2:#4e5250; --ink-3:#868a86;
  --grid:#e2e2db; --axis:#c4c5bd; --rule:rgba(13,15,14,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --pos:#2a78d6; --neg:#e34948; --mid:#a8a9a2;
  --good:#0ca30c; --crit:#d03b3b;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e100f; --surface:#171917; --surface-2:#1f221f;
  --ink:#f3f4f1; --ink-2:#b9bdb8; --ink-3:#83877f;
  --grid:#282b28; --axis:#3a3e3a; --rule:rgba(243,244,241,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --pos:#3987e5; --neg:#e66767; --mid:#6d716b;
  --good:#0ca30c; --crit:#e05c5c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e100f; --surface:#171917; --surface-2:#1f221f;
  --ink:#f3f4f1; --ink-2:#b9bdb8; --ink-3:#83877f;
  --grid:#282b28; --axis:#3a3e3a; --rule:rgba(243,244,241,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --pos:#3987e5; --neg:#e66767; --mid:#6d716b;
  --good:#0ca30c; --crit:#e05c5c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:26px 48px}

.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  padding-bottom:14px;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 4px}
h1{font-size:clamp(21px,3.4vw,29px);line-height:1.15;margin:0;font-weight:700;
  letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--ink-2);font-size:13px;margin:6px 0 0;max-width:62ch}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.7}
.meta b{color:var(--ink-2);font-weight:500}

/* tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:18px 0 20px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px 10px;
  font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink-3);cursor:pointer;
  display:inline-flex;align-items:baseline;gap:7px;margin-bottom:-1px}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
.tab .tnum{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tab[disabled]{cursor:not-allowed;opacity:.45}
.tab:focus-visible{outline:2px solid var(--s1);outline-offset:-2px;border-radius:2px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--surface);padding:14px 16px 15px}
.stat .k{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;margin-bottom:7px}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1}
.stat .d{font-size:11.5px;color:var(--ink-2);margin-top:7px;font-family:var(--mono)}
.up{color:var(--good)}.down{color:var(--crit)}

.panels{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:16px 16px 14px;min-width:0;display:flex;flex-direction:column}
.p7{grid-column:span 7}.p5{grid-column:span 5}.p12{grid-column:span 12}
@media(max-width:860px){.p7,.p5{grid-column:span 12}}
.ptitle{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.pnote{font-size:11.5px;color:var(--ink-3);margin:4px 0 12px;line-height:1.5}
.phead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.unit{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans)}
.lg:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:2px}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.lg[aria-pressed="false"]{opacity:.35}

svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.tk{fill:var(--ink-3);font-size:10px;font-family:var(--mono)}
.dlab{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--sans)}
.dlab2{fill:var(--ink-2);font-size:10px;font-family:var(--mono)}

table{border-collapse:collapse;width:100%;font-size:12.5px}
.tscroll{overflow-x:auto}
th{text-align:right;font-weight:600;color:var(--ink-3);font-size:10.5px;letter-spacing:.05em;
  padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:7px 9px;border-bottom:1px solid var(--rule);font-family:var(--mono);text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{font-family:var(--sans)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.newcat td{border-top:1px solid var(--rule)}
.catcell{font-weight:600}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;
  border-radius:2px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.chip.down{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.spark{width:78px;height:20px;display:block}
.warn{background:var(--surface-2);border-left:2px solid var(--s4);padding:9px 12px;
  font-size:11.5px;color:var(--ink-2);border-radius:0 3px 3px 0;margin-top:12px;line-height:1.55}

.empty{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:34px 22px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 8px;font-size:16px;color:var(--ink);font-weight:600}
.empty p{margin:0 auto;max-width:56ch;font-size:13px;line-height:1.7}
.empty code{font-family:var(--mono);font-size:12px;background:var(--surface-2);
  padding:2px 6px;border-radius:2px;display:inline-block;margin-top:10px}

#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:7px 10px;font-size:11.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.14);font-family:var(--mono);line-height:1.6;max-width:240px}
#tip[hidden]{display:none}
#tip b{font-family:var(--sans);font-size:12px}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);font-size:11.5px;
  color:var(--ink-3);line-height:1.7}
.foot code{font-family:var(--mono);font-size:11px;background:var(--surface-2);
  padding:1px 5px;border-radius:2px}
.toggle{background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);
  font-family:var(--sans);font-size:11.5px;padding:4px 10px;border-radius:2px;cursor:pointer}
.toggle:hover{color:var(--ink)}
.toggle:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 전산업 스캐너 ===== */
.thesis{color:var(--ink-2);font-size:13px;margin:0 0 16px;max-width:76ch}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.sigcard{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:12px 14px}
.sigcard h4{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.02em}
.sigcard .sub{font-size:11px;color:var(--ink-3);margin-bottom:8px}
.sigcard ol{margin:0;padding-left:0;list-style:none;font-size:13px}
.sigcard li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
  border-top:1px solid var(--rule)}
.sigcard li:first-child{border-top:0}
.sigcard .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sigcard .vl{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.sigcard.empty-c ol{color:var(--ink-3);font-size:12px}
.gname{font-size:12px;font-weight:600;letter-spacing:.02em;margin:26px 0 2px;
  padding-top:14px;border-top:1px solid var(--rule)}
.gthesis{font-size:11.5px;color:var(--ink-3);margin:0 0 8px}
.wt{width:100%;border-collapse:collapse;font-size:12.5px}
.wt th{font-weight:500;color:var(--ink-3);font-size:11px;text-align:right;padding:5px 7px;
  border-bottom:1px solid var(--rule);white-space:nowrap}
.wt td{text-align:right;padding:6px 7px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.wt th.l,.wt td.l{text-align:left;font-family:var(--sans)}
.wt tr.dim td{color:var(--ink-3)}
.wt tbody tr:hover{background:var(--surface-2)}
.wt .it{font-weight:600;color:var(--ink)}
.wt .tk{font-size:11px;color:var(--ink-3);display:block;font-family:var(--sans)}
.pu{display:inline-block;font-size:9.5px;padding:0 4px;border-radius:2px;line-height:15px;
  border:1px solid var(--rule);color:var(--ink-3);margin-left:5px;vertical-align:1px}
.pu.high{border-color:var(--s3);color:var(--s3)}
.idea{font-size:11.5px;color:var(--ink-2);font-family:var(--sans);white-space:normal;
  max-width:44ch;line-height:1.45}
.quad{font-size:10px;fill:var(--ink-3)}

.wt td.hsk{font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.5}
.wt td.cty{font-family:var(--sans);font-size:11px;line-height:1.5}
.wt td.cty .sh{font-family:var(--mono);color:var(--ink-3);font-size:10px}
.wt tr.itemrow td{border-bottom:0;padding-bottom:3px}
.wt tr.idearow td{padding:0 7px 8px;color:var(--ink-3);font-size:11.5px;font-family:var(--sans);
  white-space:normal;line-height:1.5;max-width:none}
.wt tr.itemrow:hover td,.wt tr.itemrow:hover + tr.idearow td{background:var(--surface-2)}
.wt tbody tr:hover{background:none}

.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 12px}
.seg{background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);
  font-family:var(--sans);font-size:11.5px;padding:4px 10px;border-radius:2px;cursor:pointer}
.seg:hover{color:var(--ink)}
.seg.on{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.seg:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.srch{margin-left:auto;background:var(--surface);border:1px solid var(--rule);color:var(--ink);
  font-family:var(--sans);font-size:12px;padding:4px 9px;border-radius:2px;min-width:180px}
.srch:focus{outline:2px solid var(--s1);outline-offset:-1px}
.subtabs{display:flex;gap:6px;margin:0 0 18px}
.subtab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);
  font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 2px 7px;cursor:pointer;
  display:inline-flex;gap:6px;align-items:baseline;margin-right:14px}
.subtab .tnum{font-family:var(--mono);font-size:10.5px}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
.subtab:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

.wt th.sortable{cursor:pointer;user-select:none}
.wt th.sortable:hover{color:var(--ink)}
.wt th.sorted{color:var(--ink);font-weight:600}
.wt th.sortable:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.pu.warn{border-color:var(--s4);color:var(--s4)}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow">관세청 시군구별 품목별 수출입실적</p>
      <h1>수출 섹터 로테이션</h1>
      <p class="sub">통관 데이터를 시군구 단위로 전수 수집해, 어느 카테고리가 비중을 가져가고
        어느 지역이 그 변화를 끌고 있는지 추적합니다. 매월 관세청 공표 직후 자동 갱신됩니다.</p>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>

  <p class="foot" id="foot"></p>
</div>
<div id="tip" hidden></div>

<script>
const SER = ["--s1","--s2","--s3","--s4","--s5"];
const NS = "http://www.w3.org/2000/svg";
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = (t,a={}) => { const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
const fm = n => n>=1000 ? Math.round(n).toLocaleString() : (n>=100 ? Math.round(n) : n.toFixed(1));
const pct = n => n==null ? "–" : (n>0?"+":"") + n.toFixed(Math.abs(n)>=100?0:1) + "%";
const pp  = n => n==null ? "–" : (n>0?"+":"") + n.toFixed(2) + "%p";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tip = document.getElementById("tip");
function showTip(ev, html){
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y < 8) y = ev.clientY + 16;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
const hideTip = () => { tip.hidden = true; };
addEventListener("scroll", hideTip, {passive:true});

let MANIFEST = null, CUR = null, CACHE = {};

// Artifact 배포 시 퍼블리시 스크립트가 채워 넣는다. Pages 에서는 비어 있고 fetch 를 탄다.
const BOOT = (typeof window !== "undefined" && window.__BOOTSTRAP__) || null;
function getJSON(path){
  if (BOOT && BOOT[path]) return Promise.resolve(BOOT[path]);
  return fetch(path, {cache:"no-cache"}).then(r => {
    if (!r.ok) throw new Error(r.status); return r.json();
  });
}

/* ================= charts ================= */
function drawMap(mount, S){
  const W=620,H=400,M={t:16,r:24,b:40,l:52}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const cats = S.cats.filter(c => c.yoy!=null && c.share_chg!=null);
  if (!cats.length){ mount.innerHTML = '<p class="pnote">전년 동기 비교가 가능한 12개월 이상 데이터가 아직 없습니다.</p>'; return; }
  const xs=cats.map(c=>c.yoy), ys=cats.map(c=>c.share_chg);
  const x0=Math.min(-20,Math.min(...xs)-10), x1=Math.max(...xs)+14;
  // 비중변화가 전부 0 근처일 때 축을 거기 맞추면 노이즈를 로테이션으로 오독한다 → 하한 ±0.5%p
  const Y_FLOOR=0.5;
  const yA=Math.max(Math.max(...ys.map(Math.abs))*1.25, Y_FLOOR);
  const X=v=>M.l+(v-x0)/(x1-x0)*iw, Y=v=>M.t+(yA-v)/(2*yA)*ih;
  const vmax=Math.max(...cats.map(c=>c.ytd))||1;
  const R=v=>6+Math.sqrt(Math.max(v,0)/vmax)*44;
  const big=new Set([...cats].sort((a,b)=>b.ytd-a.ytd).slice(0,3).map(c=>c.hs));

  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img",
    "aria-label":"카테고리 로테이션 산점도. 가로축 전년 대비 성장률, 세로축 섹터 내 비중 변화."});
  s.appendChild(el("rect",{x:X(0),y:M.t,width:Math.max(0,M.l+iw-X(0)),height:ih/2,fill:cv("--s1"),opacity:.045}));
  s.appendChild(el("rect",{x:M.l,y:M.t+ih/2,width:Math.max(0,X(0)-M.l),height:ih/2,fill:cv("--neg"),opacity:.05}));

  const step = yA>4 ? 2 : (yA>1.5 ? 1 : 0.5);
  for(let gy=-Math.ceil(yA/step)*step; gy<=yA; gy+=step){
    if(Math.abs(gy)>yA) continue;
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(gy),y2:Y(gy),class:gy===0?"ax":"gl"}));
    const t=el("text",{x:M.l-9,y:Y(gy)+3.5,class:"tk","text-anchor":"end"});
    t.textContent=(gy>0?"+":"")+ (Number.isInteger(gy)?gy:gy.toFixed(1)); s.appendChild(t);
  }
  for(let gx=Math.ceil(x0/20)*20; gx<=x1; gx+=20){
    s.appendChild(el("line",{x1:X(gx),x2:X(gx),y1:M.t,y2:M.t+ih,class:gx===0?"ax":"gl"}));
    const t=el("text",{x:X(gx),y:M.t+ih+18,class:"tk","text-anchor":"middle"});
    t.textContent=gx+"%"; s.appendChild(t);
  }
  let t=el("text",{x:M.l+iw,y:M.t+ih+34,class:"tk","text-anchor":"end"});
  t.textContent="전년 동기 대비 성장률 →"; s.appendChild(t);
  t=el("text",{x:M.l-9,y:M.t-4,class:"tk","text-anchor":"end"});
  t.textContent="비중변화 %p"; s.appendChild(t);

  const placed=[];
  for(const c of [...cats].sort((a,b)=>b.ytd-a.ytd)){
    const cx=X(c.yoy), cy=Y(c.share_chg), r=R(c.ytd);
    const col = c.share_chg>0.02 ? cv("--pos") : (c.share_chg<-0.02 ? cv("--neg") : cv("--mid"));
    const g=el("g",{tabindex:"0",role:"group",
      "aria-label":`${c.name}: 성장률 ${pct(c.yoy)}, 비중변화 ${pp(c.share_chg)}, ${fm(c.ytd)}백만달러`});
    g.appendChild(el("circle",{cx,cy,r,fill:col,"fill-opacity":.2,stroke:col,"stroke-width":2}));
    let two=big.has(c.hs);
    const up=r+(two?20:8);
    let ly=(cy-up<M.t+12)?cy+r+18:cy-up, tries=0;
    const clash=y=>placed.some(p=>Math.abs(p.x-cx)<52 && Math.abs(p.y-y)<15);
    while(clash(ly) && tries<12){
      const d=Math.ceil((tries+1)/2)*19;
      ly = tries%2 ? cy+r+18+d : cy-up-d;
      if(ly<M.t+12) ly=cy+r+18+d;
      if(ly>M.t+ih-6) ly=cy-up-d;
      tries++;
    }
    if(clash(ly)) two=false;          // 끝내 자리가 없으면 값 줄은 접고 이름만
    placed.push({x:cx,y:ly});
    const t1=el("text",{x:cx,y:ly,class:"dlab","text-anchor":"middle"});
    t1.textContent=c.name; g.appendChild(t1);
    if(two){ const t2=el("text",{x:cx,y:ly+12,class:"dlab2","text-anchor":"middle"});
      t2.textContent="$"+fm(c.ytd)+"M"; g.appendChild(t2); }
    const html=`<b>${esc(c.name)}</b> (HS ${c.hs})<br>$${fm(c.ytd)}M · 비중 ${c.share?.toFixed(1)??"–"}%
      <br>YoY ${pct(c.yoy)} → 최근 ${pct(c.q3)}<br>비중변화 ${pp(c.share_chg)} · 가속 ${pp(c.accel)}`;
    g.addEventListener("pointermove",e=>showTip(e,html));
    g.addEventListener("pointerleave",hideTip);
    g.addEventListener("focus",()=>{const b=g.getBoundingClientRect();
      showTip({clientX:b.left+b.width/2,clientY:b.top},html)});
    g.addEventListener("blur",hideTip);
    s.appendChild(g);
  }
  let q=el("text",{x:M.l+iw-4,y:M.t+14,class:"tk","text-anchor":"end"});
  q.textContent="몫을 키우며 성장"; s.appendChild(q);
  q=el("text",{x:M.l+6,y:M.t+ih-8,class:"tk"});
  q.textContent="밀려나는 축"; s.appendChild(q);
  mount.replaceChildren(s);
}

function lineChart(mount, months, series, o){
  const W=o.w||980,H=o.h||260,M={t:12,r:o.padR??58,b:28,l:o.padL??46};
  const iw=W-M.l-M.r, ih=H-M.t-M.b, n=months.length;
  const live=series.filter(s=>!s.off);
  const vals=live.flatMap(s=>s.v).filter(v=>v!=null);
  if(!vals.length){ mount.innerHTML=""; return; }
  let lo=o.zero?0:Math.min(...vals), hi=Math.max(...vals);
  const padv=(hi-lo)*0.12||1; hi+=padv; if(!o.zero) lo-=padv;
  const X=i=>M.l+(n===1?iw/2:i/(n-1)*iw), Y=v=>M.t+(hi-v)/(hi-lo)*ih;

  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":o.label||""});
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4;
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(v),y2:Y(v),class:"gl"}));
    const t=el("text",{x:M.l-8,y:Y(v)+3.5,class:"tk","text-anchor":"end"});
    t.textContent=o.fmtY?o.fmtY(v):Math.round(v); s.appendChild(t);
  }
  months.forEach((m,i)=>{
    if(!m.endsWith("-01")&&!m.endsWith("-07")) return;
    const t=el("text",{x:X(i),y:M.t+ih+17,class:"tk","text-anchor":"middle"});
    t.textContent=m.slice(2).replace("-","."); s.appendChild(t);
  });
  s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:M.t+ih,y2:M.t+ih,class:"ax"}));

  live.forEach(sr=>{
    const pts=sr.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    s.appendChild(el("path",{d:"M"+pts.map(p=>p.join(" ")).join("L"),fill:"none",
      stroke:cv(sr.c),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    const last=pts[pts.length-1];
    s.appendChild(el("circle",{cx:last[0],cy:last[1],r:4,fill:cv(sr.c),
      stroke:cv("--surface"),"stroke-width":2}));
    const t=el("text",{x:last[0]+9,y:last[1]+3.5,class:"dlab2"});
    t.textContent=sr.name; s.appendChild(t);
  });
  const cross=el("line",{x1:0,x2:0,y1:M.t,y2:M.t+ih,class:"ax",opacity:"0"});
  s.appendChild(cross);
  const hit=el("rect",{x:M.l,y:M.t,width:iw,height:ih,fill:"transparent"});
  s.appendChild(hit);
  hit.addEventListener("pointermove",ev=>{
    const bb=s.getBoundingClientRect();
    let i=Math.round(((ev.clientX-bb.left)/bb.width*W-M.l)/iw*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",".7");
    showTip(ev,`<b>${months[i]}</b><br>`+live.map(sr=>
      `<span style="color:${cv(sr.c)}">■</span> ${esc(sr.name)} ${
        sr.v[i]==null?"–":(o.fmtT?o.fmtT(sr.v[i]):fm(sr.v[i]))}`).join("<br>"));
  });
  hit.addEventListener("pointerleave",()=>{cross.setAttribute("opacity","0");hideTip()});
  mount.replaceChildren(s);
}

function sparkSVG(v, col){
  const w=78,h=20,lo=Math.min(...v),hi=Math.max(...v);
  const X=i=>i/(v.length-1)*(w-2)+1, Y=x=>h-2-(hi===lo?0.5:(x-lo)/(hi-lo))*(h-5);
  const d="M"+v.map((x,i)=>`${X(i).toFixed(1)} ${Y(x).toFixed(1)}`).join("L");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(${col})" stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="2.2"
      fill="var(${col})"/></svg>`;
}

/* ================= 유니버스 랭킹 ================= */
let UNI = null, uniSort = "accel", uniDir = -1, uniQ = "", uniPreset = "";
// 프리셋은 '필터', 헤더 클릭은 '정렬'. 둘은 독립이다.
const PRESETS = {
  "":      {t:"전체"},
  qTurn:   {t:"물량 턴어라운드", f:r=>r.qTurn},
  pTurn:   {t:"단가 전환",       f:r=>r.pTurn},
  clean:   {t:"기저 정상만",     f:r=>r.baseIdx==null||r.baseIdx>=0.75},
};
const COLS = [
  {k:"label", t:"항 · 대표품목", l:1},
  {k:"chapter", t:"장", l:1},
  {k:"usd",  t:m=>`${m}M $M`},
  {k:"yoy",  t:"YoY"},
  {k:"accel",t:"가속"},
  {k:"p",    t:"단가 $/kg"},
  {k:"pYoy", t:"P YoY"},
  {k:"kg",   t:"물량 톤"},
  {k:"qYoy", t:"Q YoY"},
];

function uniRows(){
  const q = uniQ.trim();
  let rows = UNI.items;
  if (q) rows = rows.filter(r =>
    r.hs4.includes(q) || (r.label||"").includes(q) || (r.chapter||"").includes(q));
  const pf = PRESETS[uniPreset]?.f;
  if (pf) rows = rows.filter(pf);
  const k = uniSort;
  const val = r => {
    const v = r[k];
    if (v == null) return uniDir < 0 ? -Infinity : Infinity;   // 빈 값은 항상 뒤로
    return typeof v === "string" ? v : +v;
  };
  rows = rows.slice().sort((a,b)=>{
    const x = val(a), y = val(b);
    if (typeof x === "string" || typeof y === "string")
      return String(x).localeCompare(String(y)) * (uniDir < 0 ? -1 : 1);
    return (x - y) * (uniDir < 0 ? -1 : 1);
  });
  return rows.slice(0, q || uniPreset ? 60 : 25);
}

function drawUniTable(){
  const rows = uniRows();
  const nd = n => n==null ? "–" : pct(n);
  const arrow = k => uniSort===k ? (uniDir<0?" ▾":" ▴") : "";
  const th = c => `<th class="${c.l?'l':''} sortable${uniSort===c.k?' sorted':''}"
    data-col="${c.k}" role="button" tabindex="0"
    title="클릭하면 이 열로 정렬합니다">${typeof c.t==="function"?c.t(UNI.window):c.t}${arrow(c.k)}</th>`;
  document.getElementById("unitbl").innerHTML = rows.length ? `
    <table class="wt"><thead><tr>${COLS.map(th).join("")}
      <th class="l">추이</th></tr></thead><tbody>` +
    rows.map(r=>`<tr class="itemrow">
      <td class="l"><span class="it">${esc(r.hs4)}</span>
        ${r.watched?'<span class="pu high">워치</span>':''}
        ${r.baseIdx!=null&&r.baseIdx<0.75?`<span class="pu warn" title="전년 동기 3개월이 그 품목 평년의 ${Math.round(r.baseIdx*100)}% 수준 — 가속이 기저효과일 수 있습니다">기저↓</span>`:''}
        ${r.baseIdx!=null&&r.baseIdx>1.25?`<span class="pu" title="전년 동기 3개월이 평년보다 높았음 — 가속이 과소평가될 수 있습니다">기저↑</span>`:''}
        <span class="tk">${esc(r.label||"–")}</span></td>
      <td class="l" style="font-size:11px;color:var(--ink-3)">${esc(r.chapter)}</td>
      <td>${fm(r.usd)}</td>
      <td class="${r.yoy>0?'up':'down'}">${nd(r.yoy)}</td>
      <td>${r.accel==null?"–":`<span class="chip ${r.accel>0?'up':'down'}">${r.accel>0?"+":""}${r.accel}%p</span>`}</td>
      <td>${r.p==null?"–":r.p.toLocaleString(undefined,{maximumFractionDigits:r.p<100?2:0})}</td>
      <td class="${r.pYoy>0?'up':'down'}">${nd(r.pYoy)}</td>
      <td>${fm(r.kg)}</td>
      <td class="${r.qYoy>0?'up':'down'}">${nd(r.qYoy)}</td>
      <td class="l">${sparkSVG(r.m,"--s1")}</td></tr>`).join("") + "</tbody></table>"
    : `<p class="pnote">조건에 맞는 항이 없습니다.</p>`;
  document.querySelectorAll("#unitbl th.sortable").forEach(h=>{
    const go = () => {
      const k = h.dataset.col;
      if (uniSort === k) uniDir = -uniDir; else { uniSort = k; uniDir = -1; }
      drawUniTable();
    };
    h.addEventListener("click", go);
    h.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} });
  });
}

/* ================= 전산업 스캐너 ================= */
const GC = {consumer:"--s1", ithw:"--s2", heavy:"--s3", content:"--s4"};
const CLAMP = {x:[-70,140], y:[-60,90]};   // 극단값은 가장자리로 밀고 표시만 바꾼다

function drawPQ(mount, WL){
  const W=760,H=430,M={t:18,r:26,b:46,l:56}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const pts = WL.items.filter(r => r.ready && r.qYoy!=null && r.pYoy!=null);
  if (pts.length < 2){
    mount.innerHTML = '<p class="pnote">물량·단가 YoY를 둘 다 계산할 수 있는 품목이 아직 부족합니다 (전년 동기 12개월 필요).</p>';
    return;
  }
  const cx0=CLAMP.x[0], cx1=CLAMP.x[1], cy0=CLAMP.y[0], cy1=CLAMP.y[1];
  const X = v => M.l + (Math.min(cx1,Math.max(cx0,v)) - cx0)/(cx1-cx0)*iw;
  const Y = v => M.t + ih - (Math.min(cy1,Math.max(cy0,v)) - cy0)/(cy1-cy0)*ih;
  const maxU = Math.max(...pts.map(p=>p.usd));
  const R = u => 5 + Math.sqrt(Math.max(u,0)/maxU)*22;

  const s = el("svg",{viewBox:`0 0 ${W} ${H}`, role:"img",
    "aria-label":"물량 대비 단가 변화 사분면 맵"});

  // 사분면 배경 — 우상(수요 확장)만 은은하게 강조
  s.appendChild(el("rect",{x:X(0),y:M.t,width:Math.max(0,M.l+iw-X(0)),
    height:Math.max(0,Y(0)-M.t),fill:cv("--s3"),opacity:.05}));

  [cy0,0,cy1].concat([-30,30,60]).filter(v=>v>cy0&&v<cy1).forEach(v=>{
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(v),y2:Y(v),
      class: v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:M.l-8,y:Y(v)+3.5,class:"tk","text-anchor":"end"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });
  [-50,0,50,100].filter(v=>v>=cx0&&v<=cx1).forEach(v=>{
    s.appendChild(el("line",{y1:M.t,y2:M.t+ih,x1:X(v),x2:X(v), class: v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:X(v),y:M.t+ih+16,class:"tk","text-anchor":"middle"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });

  const quad = (x,y,t,anchor) => s.appendChild(Object.assign(
    el("text",{x,y,class:"quad","text-anchor":anchor}), {textContent:t}));
  quad(M.l+iw-4, M.t+13, "물량↑ 단가↑ · 수요 확장", "end");
  quad(M.l+iw-4, M.t+ih-6, "물량↑ 단가↓ · 점유율 경쟁", "end");
  quad(M.l+4,    M.t+13, "물량↓ 단가↑ · 믹스 개선·감산", "start");
  quad(M.l+4,    M.t+ih-6, "물량↓ 단가↓ · 위축", "start");

  s.appendChild(Object.assign(el("text",{x:M.l+iw/2,y:H-6,class:"tk","text-anchor":"middle"}),
    {textContent:"물량(중량) YoY →"}));
  s.appendChild(Object.assign(el("text",{x:14,y:M.t+ih/2,class:"tk","text-anchor":"middle",
    transform:`rotate(-90 14 ${M.t+ih/2})`}), {textContent:"단가($/kg) YoY"}));

  const placed = [];
  pts.slice().sort((a,b)=>b.usd-a.usd).forEach(p=>{
    const x=X(p.qYoy), y=Y(p.pYoy), r=R(p.usd);
    const clamped = p.qYoy<cx0||p.qYoy>cx1||p.pYoy<cy0||p.pYoy>cy1;
    const c = cv(GC[p.group] || "--s5");
    const g = el("g",{});
    g.appendChild(el("circle",{cx:x,cy:y,r:r+2,fill:cv("--surface")}));   // 2px 겹침 링
    g.appendChild(el("circle",{cx:x,cy:y,r,fill:c,opacity:clamped?.3:.5,
      stroke:c,"stroke-width":clamped?2:1.5,"stroke-dasharray":clamped?"3 2":""}));
    g.style.cursor="pointer";
    const html = `<b>${esc(p.name)}</b><br>${esc((p.tickers||[])[0]||"")}<br>`+
      `금액 $${fm(p.usd)}M · YoY ${pct(p.yoy)}<br>`+
      `물량 ${fm(p.kg)}톤 · YoY ${pct(p.qYoy)}<br>`+
      `단가 $${p.p==null?"–":p.p.toLocaleString()}/kg · YoY ${pct(p.pYoy)}`+
      (clamped?"<br>※ 축 범위 밖(점선)":"");
    g.addEventListener("mousemove", e=>showTip(e, html));
    g.addEventListener("mouseleave", hideTip);
    s.appendChild(g);

    // 큰 품목만 직접 라벨 — 모든 점에 숫자를 붙이지 않는다.
    // 자리가 없으면 라벨을 **버린다**(겹쳐 찍느니 호버로 읽게 한다).
    if (r >= 13){
      const txt = p.name.length>11 ? p.name.slice(0,10)+"…" : p.name;
      // 한글은 글자폭이 font-size 에 가깝고 라틴은 절반쯤이다. 한 글자 6.4px 로
      // 잡았더니 실제보다 40% 좁게 계산돼 라벨이 겹쳤다.
      const w = [...txt].reduce((a,ch)=> a + (/[\u3131-\uD79D]/.test(ch) ? 11.2 : 6), 0) + 6;
      const free = (lx,ly) => lx-w/2 > M.l+2 && lx+w/2 < M.l+iw-2 &&
        ly > M.t+10 && ly < M.t+ih-4 &&
        !placed.some(q => Math.abs(q.x-lx) < (q.w+w)/2+8 && Math.abs(q.y-ly) < 15) &&
        !pts.some(o => o!==p && Math.abs(X(o.qYoy)-lx) < w/2+R(o.usd) &&
                       Math.abs(Y(o.pYoy)-ly) < R(o.usd)+5);
      // 위/아래로만 밀어 올린다. 옆으로 밀면 이웃 버블 위에 얹히기 쉽다.
      let put = null;
      for (const dy of [-(r+7), r+15, -(r+21), r+29, -(r+35), r+43]){
        if (free(x, y+dy)) { put = {x, y:y+dy}; break; }
      }
      if (put){
        s.appendChild(Object.assign(
          el("text",{x:put.x,y:put.y,class:"dlab","text-anchor":"middle"}), {textContent:txt}));
        placed.push({x:put.x, y:put.y, w});
      }
    }
  });
  mount.innerHTML = ""; mount.appendChild(s);
}

function sigCard(title, sub, keys, WL, fmt){
  const rows = keys.map(k => WL.items.find(r=>r.key===k)).filter(Boolean);
  return `<div class="sigcard${rows.length?"":" empty-c"}">
    <h4>${esc(title)}</h4><div class="sub">${esc(sub)}</div>
    <ol>${rows.length ? rows.map(r=>`<li><span class="nm">${esc(r.name)}</span>
      <span class="vl ${fmt(r).n>0?'up':'down'}">${esc(fmt(r).t)}</span></li>`).join("")
      : "<li>해당 품목 없음</li>"}</ol></div>`;
}

const SCAN_KEY = "scan";

function selectTab(key){
  CUR = key; showAll = false;
  location.hash = key;
  [...document.querySelectorAll(".tab")].forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.key === key)));
  if (key === SCAN_KEY){
    if (WATCH || UNI) renderScan(WATCH);
    else document.getElementById("view").innerHTML =
      `<div class="empty"><h3>전산업 스캐너 — 아직 수집 전입니다</h3>
       <p>워치리스트는 <b>품목별 국가별 API</b>를 따로 받습니다. 섹터 수집과 별개의 단계입니다.</p>
       <code>python scripts/run_watchlist.py &amp;&amp; python scripts/build_watchlist.py</code></div>`;
    return;
  }
  const entry = MANIFEST.sectors.find(s => s.key === key);
  if (!entry) return;
  if (!entry.ready){ renderEmpty(entry); return; }
  if (CACHE[key]){ renderSector(CACHE[key]); return; }
  document.getElementById("view").innerHTML = `<div class="empty"><p>불러오는 중…</p></div>`;
  getJSON(`data/${key}.json`)
    .then(d => { CACHE[key]=d; if(CUR===key) renderSector(d); })
    .catch(err => { document.getElementById("view").innerHTML =
      `<div class="empty"><h3>불러오지 못했습니다</h3><p>data/${esc(key)}.json — ${esc(err.message)}</p></div>`; });
}

      `출처: <b>${esc(m.source || "관세청 수출입무역통계 (공공데이터포털 data.go.kr)")}</b> · ` +
      `금액은 신고 미화금액(FOB) 기준 · 원자료는 천 달러 단위이며 달러로 환산 · ` +
      `공표는 매월 15일경, 전월까지 현행화되며 <b>과거 월이 소급 정정</b>됩니다 · ` +
      `섹터 탭은 시군구 API라 HS 6단위까지, 스캐너 탭은 품목별·국가별 API라 <b>HSK 10단위</b>입니다 · ` +
      `수집 범위 ${esc(cov.region_trade?.from ?? "?")}–${esc(cov.region_trade?.to ?? "?")}, ` +
      `${(cov.region_trade?.rows ?? 0).toLocaleString()}행 · ` +
      `소급 정정 감지 ${(cov.revisions ?? 0).toLocaleString()}건`;

    const want = location.hash.slice(1);
    const known = want === SCAN_KEY || (m.sectors||[]).some(s=>s.key===want);
    selectTab(known ? want : ((WATCH||UNI) ? SCAN_KEY : ready[0].key));
  });

const reflow = () => {
  if (CUR === SCAN_KEY && (WATCH||UNI)) renderScan(WATCH);
  else if (CUR && CACHE[CUR]) renderSector(CACHE[CUR]);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", reflow);
addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (k && k !== CUR && (k === SCAN_KEY || MANIFEST?.sectors.some(s=>s.key===k))) selectTab(k);
});
</script>
</body>
</html>
