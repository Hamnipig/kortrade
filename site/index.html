/* ══════════════════════════════════════════════════════════════════════════
   PCB·기판

   이 탭의 중심은 **ASP($/kg)** 다. 이유가 하나뿐이라 분명하다.

   한국 HS 8534(인쇄회로)에는 층수 구분이 없다. 한국 HSK 세 개는 '형성된 회로의
   종류'로 갈린다(테이프·리드프레임형 / 수동소자 형성 / 기타). 층수 세분은
   **중국 체계**이고 코드 번호가 겹쳐 혼동하기 쉽다.

   그래서 AI 서버용 고다층·패키지기판으로의 전환은 한국 데이터에서 금액으로
   보이지 않는다. 금액 ÷ 중량 = ASP 로만 보인다.
     iM증권 PCB Tracker 2026-08 실측: 수출액 +15% / 중량 −3% / ASP +18%
   금액만 보는 화면에서는 "+15% 성장" 하나로 끝난다. 물량이 오히려 줄었다는
   사실이 빠지면 고부가 전환이라는 해석 자체가 성립하지 않는다.

   ★ 중량은 **국가 축에서만** 온다. 시군구 API 에는 중량 필드가 없고,
     2026-09-01 지침으로 시군구 중량·HSK10 은 비공개가 됐다. 지역 축은 금액만이다.
   ══════════════════════════════════════════════════════════════════════════ */
const PCB_KEY = "pcb";
let PCB = null;
const PGCOL = {board:"--s1", material:"--s3", equipment:"--s4"};
const PQV = {mix_up:"vd-good", premium_expansion:"vd-good", volume_growth:"",
             price_led:"vd-loc", flat:"vd-na", push:"vd-bad", price_erosion:"vd-mix",
             volume_decline:"vd-mix", contracting:"vd-bad", unknown:"vd-na",
             turnaround:"vd-good", accelerating:"vd-good", bottoming:"vd-loc",
             steady:"", decelerating:"vd-mix", mergeable:"vd-good",
             caution:"vd-mix", separate:"vd-bad", cost_push:"vd-mix"};
const pvb = v => v ? `<span class="vdi ${PQV[v.code]||""}" title="${esc(v.note||"")}">${
  esc(v.label)}</span>` : "–";

/* 단가 국면 지도. drawNationQuad 와 형태는 같지만 축 범위를 **데이터에서** 잡는다 —
   PCB 의 월별 변동폭은 화장품보다 훨씬 좁아서, 고정 범위를 쓰면 점이 전부
   한가운데 뭉쳐 국면이 안 보인다. */
function drawPcbQuad(mount, pts, minWgt){
  if (!mount) return;
  const live = pts.filter(p=>p.qtyYoy!=null && p.priceYoy!=null && p.usd>0);
  if (live.length < 2){
    // ★ 전역(PCB)을 참조하면 2차전지 탭에서 부를 때 엉뚱한 숫자를 말한다
    const w = minWgt ?? PCB?.minWgtKg ?? BAT?.minWgtKg ?? 1000;
    mount.innerHTML = '<p class="pnote">물량·단가를 둘 다 낼 수 있는 항목이 부족합니다 '+
      '(중량 '+w.toLocaleString()+'kg 미만은 단가를 내지 않습니다).</p>';
    return;
  }
  const W=760,H=400,M={t:18,r:26,b:46,l:58}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const span = (vals, floor) => {
    const a = Math.max(floor, Math.max(...vals.map(v=>Math.abs(v)))*1.3);
    return [-a, a];
  };
  const [cx0,cx1] = span(live.map(p=>p.qtyYoy), 12);
  const [cy0,cy1] = span(live.map(p=>p.priceYoy), 10);
  const X = v => M.l + (Math.min(cx1,Math.max(cx0,v))-cx0)/(cx1-cx0)*iw;
  const Y = v => M.t + ih - (Math.min(cy1,Math.max(cy0,v))-cy0)/(cy1-cy0)*ih;
  const maxU = Math.max(...live.map(p=>p.usd));
  const R = u => 5 + Math.sqrt(Math.max(u,0)/maxU)*24;
  const s = el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"물량 대비 단가 변화 사분면"});

  // 좌상(물량↓ 단가↑ = 고부가 믹스 전환)이 이 산업에서 찾는 칸이다.
  // 우하(물량↑ 단가↓ = 밀어내기)는 경고색.
  s.appendChild(el("rect",{x:M.l,y:M.t,width:Math.max(0,X(0)-M.l),
    height:Math.max(0,Y(0)-M.t),fill:cv("--s3"),opacity:.055}));
  s.appendChild(el("rect",{x:X(0),y:Y(0),width:Math.max(0,M.l+iw-X(0)),
    height:Math.max(0,M.t+ih-Y(0)),fill:cv("--crit"),opacity:.045}));

  const ticks = (lo,hi) => {
    const step = Math.max(1, Math.round((hi-lo)/6));
    const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) out.push(v);
    if(!out.includes(0)) out.push(0);
    return out.sort((a,b)=>a-b);
  };
  ticks(cy0,cy1).forEach(v=>{
    s.appendChild(el("line",{x1:M.l,x2:M.l+iw,y1:Y(v),y2:Y(v),class:v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:M.l-8,y:Y(v)+3.5,class:"tk","text-anchor":"end"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });
  ticks(cx0,cx1).forEach(v=>{
    s.appendChild(el("line",{y1:M.t,y2:M.t+ih,x1:X(v),x2:X(v),class:v===0?"ax":"gl"}));
    s.appendChild(Object.assign(el("text",{x:X(v),y:M.t+ih+16,class:"tk","text-anchor":"middle"}),
      {textContent:(v>0?"+":"")+v+"%"}));
  });
  const quad=(x,y,t,a)=>s.appendChild(Object.assign(
    el("text",{x,y,class:"quad","text-anchor":a}),{textContent:t}));
  quad(M.l+4,    M.t+13,   "물량↓ 단가↑ · 고부가 믹스 전환", "start");
  quad(M.l+iw-4, M.t+13,   "물량↑ 단가↑ · 프리미엄 확산", "end");
  quad(M.l+4,    M.t+ih-6, "물량↓ 단가↓ · 수축", "start");
  quad(M.l+iw-4, M.t+ih-6, "물량↑ 단가↓ · 밀어내기(마진 경고)", "end");
  s.appendChild(Object.assign(el("text",{x:M.l+iw/2,y:H-6,class:"tk","text-anchor":"middle"}),
    {textContent:"물량(중량) YoY →"}));
  s.appendChild(Object.assign(el("text",{x:14,y:M.t+ih/2,class:"tk","text-anchor":"middle",
    transform:`rotate(-90 14 ${M.t+ih/2})`}),{textContent:"ASP($/kg) YoY"}));

  const placed=[];
  live.slice().sort((a,b)=>b.usd-a.usd).forEach(p=>{
    const x=X(p.qtyYoy), y=Y(p.priceYoy), r=R(p.usd);
    const out = p.qtyYoy<cx0||p.qtyYoy>cx1||p.priceYoy<cy0||p.priceYoy>cy1;
    const c = cv(p.hub ? "--s4" : (p.kind==="code" ? "--s2" : "--s1"));
    const g = el("g",{});
    g.appendChild(el("circle",{cx:x,cy:y,r:r+2,fill:cv("--surface")}));
    g.appendChild(el("circle",{cx:x,cy:y,r,fill:c,opacity:out?.25:(p.hub?.28:.5),
      stroke:c,"stroke-width":p.hub?2:1.5,"stroke-dasharray":p.hub?"4 3":(out?"3 2":"")}));
    g.style.cursor="pointer";
    g.addEventListener("mousemove", e=>showTip(e,
      `<b>${esc(p.name)}</b> ${p.hub?'<span class="pu warn">중계 허브</span>':""}<br>`+
      `금액 $${fm(p.usd)}M · YoY ${pct(p.valueYoy)}<br>`+
      `물량 YoY ${pct(p.qtyYoy)}<br>`+
      `ASP $${p.asp==null?"–":p.asp.toLocaleString()}/kg · YoY ${pct(p.priceYoy)}<br>`+
      `${esc(p.verdict?.label||"")}${p.hub&&p.why?"<br>※ "+esc(p.why):""}`+
      (out?"<br>※ 축 범위 밖(점선)":"")));
    g.addEventListener("mouseleave", hideTip);
    s.appendChild(g);
    if (r >= 11){
      const txt = p.name.length>11 ? p.name.slice(0,10)+"…" : p.name;
      const w = [...txt].reduce((a,ch)=>a+(/[ㄱ-힝]/.test(ch)?11.2:6),0)+6;
      const free=(lx,ly)=> lx-w/2>M.l+2 && lx+w/2<M.l+iw-2 && ly>M.t+10 && ly<M.t+ih-4 &&
        !placed.some(q=>Math.abs(q.x-lx)<(q.w+w)/2+8 && Math.abs(q.y-ly)<15);
      let put=null;
      for (const dy of [-(r+7), r+15, -(r+21), r+29]){ if(free(x,y+dy)){put={x,y:y+dy};break;} }
      if (put){
        s.appendChild(Object.assign(el("text",{x:put.x,y:put.y,class:"dlab",
          "text-anchor":"middle"}),{textContent:txt}));
        placed.push({x:put.x,y:put.y,w});
      }
    }
  });
  mount.innerHTML=""; mount.appendChild(s);
}

/* 금액과 물량을 같은 100 에서 출발시킨다. 두 선이 벌어진 만큼이 ASP 다 —
   ★ 계열마다 제 첫 값을 100 으로 잡으면 시작점이 다를 때 비교가 무의미해지므로
     둘 다 **같은 달**을 기준으로 쓴다(최종 수요 축에서 겪은 함정). */
function pcbIndex(D){
  const u = D.headline.m.usd, w = D.headline.m.wgt;
  let b = -1;
  for (let i=0;i<u.length;i++) if (u[i] && w[i]) { b=i; break; }
  if (b < 0) return null;
  const nz = (a,i) => a[i] ? +(a[i]/a[b]*100).toFixed(1) : null;
  return {base: D.months[b],
          usd: u.map((_,i)=>nz(u,i)), wgt: w.map((_,i)=>nz(w,i))};
}

   남은 축이 무엇인지 보여야 다음 순서가 정해진다. */
/* 연결 전일 때 **왜** 비었는지를 화면에 적는다.

     연결된 분기만 테스트하고 있어서 놓쳤다 — 이제 두 분기를 다 렌더한다. */
function intlProbes(D){
  const g = D.intl.diag || {};
  const ps = g.probes || [];
  const bits = [];
  if (g.searched != null) bits.push(`검색 ${g.searched}회 · 후보 ${g.candidates ?? "–"}건`);
  if (g.apiOk != null) bits.push(g.apiOk
    ? "<b>키와 API 호출은 정상</b> — 통계표 선택·파싱 문제입니다"
    : "API 응답에 오류가 있었습니다");
  const head = bits.length ? `<p class="pnote">${bits.join(" · ")}</p>` : "";
  const tbl = ps.length ? `<div class="tscroll"><table class="wt"><thead><tr>
      <th class="l">통계표</th><th class="l">제목</th><th>점수</th><th>연도</th>
      <th>行</th><th>品目</th><th>지표</th><th class="l">판정 · 실제 항목</th>
      </tr></thead><tbody>
      ${ps.map(r=>`<tr class="${r.ok?"":"dim"}">
        <td class="l hsk">${esc(r.id ?? "–")}</td>
        <td class="l dimc" style="max-width:300px;white-space:normal">${esc(r.title||"")}</td>
        <td>${esc(String(r.score ?? "–"))}</td>
        <td>${esc(String(r.year ?? "–"))}</td>
        <td>${esc(String(r.rows ?? "–"))}</td>
        <td>${esc(String(r.nItems ?? "–"))}</td>
        <td>${esc(String(r.nMeas ?? "–"))}</td>
        <td class="l">${r.ok?'<span class="vdi vd-good">채택</span>'
          :'<span class="vdi vd-bad">탈락</span>'}
          <span class="dimc"> ${esc(r.reason||"")}</span>
          ${(r.sample||[]).length?`<br><span class="dimc" style="font-size:11px">실제 항목:
            ${esc((r.sample||[]).join(" · "))}</span>`:""}</td>
      </tr>`).join("")}</tbody></table></div>` : "";
  if (!head && !tbl) return "";
  return `<div style="margin:10px 0 14px">${head}${tbl}
    <p class="pnote">진단 원본은 <code>data/pcb_intl_verify.json</code> 입니다.
      '실제 항목'이 <code>config/pcb_intl.yaml</code> 의 <code>match</code> 와
      다르면 그 문자열만 고치면 됩니다.</p></div>`;
}

const SCAN_KEY = "scan";
const BAT_KEY = "battery";
let WATCH = null;

function selectTab(key){
  CUR = key; showAll = false;
  location.hash = key;
  [...document.querySelectorAll(".tab")].forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.key === key)));
  if (key === BAT_KEY){ renderBattery(); return; }
  if (key === PCB_KEY){ renderPcb(); return; }
  if (key === SCAN_KEY){
    if (WATCH || UNI || FLASH) renderScan(WATCH);
    else document.getElementById("view").innerHTML =
      `<div class="empty"><h3>전산업 스캐너 — 아직 수집 전입니다</h3>
       <p>워치리스트는 <b>품목별 국가별 API</b>를 따로 받습니다. 섹터 수집과 별개의 단계입니다.</p>
       <code>python scripts/run_watchlist.py &amp;&amp; python scripts/build_watchlist.py</code></div>`;
    return;
  }
  const entry = MANIFEST.sectors.find(s => s.key === key);
  if (!entry) return;
  if (!entry.ready){ renderEmpty(entry); return; }
  if (CACHE[key]){ renderSector(CACHE[key]); return; }
  document.getElementById("view").innerHTML = `<div class="empty"><p>불러오는 중…</p></div>`;
  getJSON(`data/${key}.json`)
    .then(d => { CACHE[key]=d; if(CUR===key) renderSector(d); })
    .catch(err => { document.getElementById("view").innerHTML =
      `<div class="empty"><h3>불러오지 못했습니다</h3><p>data/${esc(key)}.json — ${esc(err.message)}</p></div>`; });
}

// 섹터(manifest)와 워치리스트는 **서로 독립**이다. 한쪽이 없어도 다른 쪽은 떠야 한다.
// (초기에 manifest 로딩 실패가 스캐너까지 같이 죽이는 구조였다)
Promise.allSettled([getJSON("data/manifest.json"), getJSON("data/watchlist.json"),
                    getJSON("data/universe.json"), getJSON("data/chains.json"),
                    getJSON("data/flash.json"), getJSON("data/battery.json"),
                    getJSON("data/pcb.json")])
  .then(([mr, wr, ur, cr, fr, br, pr]) => {
    MANIFEST = mr.status === "fulfilled" ? mr.value : {sectors: []};
    WATCH    = wr.status === "fulfilled" ? wr.value : null;
    UNI      = ur.status === "fulfilled" ? ur.value : null;
    CHAINS   = cr.status === "fulfilled" ? cr.value : null;
    FLASH    = fr.status === "fulfilled" ? fr.value : null;
    BAT      = br.status === "fulfilled" ? br.value : null;
    PCB      = pr.status === "fulfilled" ? pr.value : null;
    if (!FLASH) scanPane = UNI ? "uni" : "wl";
    const m = MANIFEST, ready = (m.sectors||[]).filter(s=>s.ready);

    if (!ready.length && !WATCH && !UNI && !FLASH && !BAT && !PCB){
      document.getElementById("view").innerHTML = `
        <div class="empty">
          <h3>아직 데이터가 없습니다</h3>
          <p>첫 수집이 끝나면 이 자리에 대시보드가 나타납니다. GitHub Actions의
          <b>Update trade data</b> 워크플로를 수동 실행하거나, 매월 17일 예약 실행을 기다리세요.</p>
          <code>python scripts/run_update.py --sectors all &amp;&amp; python scripts/build_site.py</code>
        </div>`;
      document.getElementById("meta").textContent = "";
      return;
    }

    const asOf = UNI?.asOf || WATCH?.asOf || ready[0]?.asOf;
    document.getElementById("meta").innerHTML =
      `갱신 <b>${esc(m.generatedAt || WATCH?.builtAt || "–")}</b><br>` +
      (asOf ? `기준월 <b>${esc(asOf)}</b><br>` : "") +
      (FLASH ? `속보 <b>${esc(FLASH.asOf.period)} ${esc(FLASH.asOf.label)}</b><br>` : "") +
      `단위 <b>백만 USD (FOB)</b>`;

    // 탭 배지는 **가장 최신인 레이어**를 보여준다. 속보가 있으면 그게 제일 앞선 숫자다.
    const nScan = FLASH ? `${FLASH.asOf.period} ${FLASH.asOf.label}`
      : (UNI ? UNI.totals.nHs4 + "개 항"
      : (WATCH ? WATCH.items.filter(r=>r.ready).length + "품목" : "미수집"));
    // 탭은 **배열로** 만든다. PCB 는 심화 레이어지만 화장품 바로 옆에 와야 해서
    // (사용자 요청) 섹터 목록 사이에 끼워 넣어야 하기 때문이다. 문자열 연결로는
    // '섹터 앞' 아니면 '섹터 뒤' 둘 중 하나밖에 안 된다.
    //
    // ★ 수집되지 않은 섹터는 탭을 내지 않는다. '미수집' 딱지만 붙은 탭은 누를 게
    //   없는데 자리만 차지하고, 같은 이름의 새 레이어와 겹쳐 보인다
    //   (실제로 '2차전지·ESS' 가 두 개로 보였다).
    const tabs = [{key:SCAN_KEY, name:"전산업 스캐너", num:nScan}];
    if (BAT) tabs.push({key:BAT_KEY, name:"2차전지·ESS", num:BAT.total.verdict.label});
    const secTabs = (m.sectors||[]).filter(s=>s.ready)
      .map(s=>({key:s.key, name:s.name, num:"$"+fm(s.ytd)+"M"}));
    if (PCB){
      // 단월 ASP YoY 를 배지로 — 이 탭에서 제일 먼저 봐야 할 숫자가 단가다.
      const pnum = PCB.headline.month.priceYoy;
      const pTab = {key:PCB_KEY, name:"PCB기판",
                    num:"ASP " + (pnum==null ? "–" : pct(pnum))};
      const at = secTabs.findIndex(t=>t.key==="cosmetics");
      secTabs.splice(at < 0 ? secTabs.length : at + 1, 0, pTab);
    }
    document.getElementById("tabs").innerHTML = tabs.concat(secTabs).map(t=>
      `<button class="tab" role="tab" data-key="${esc(t.key)}" aria-selected="false">
        ${esc(t.name)}<span class="tnum">${esc(t.num)}</span></button>`).join("");
    document.getElementById("tabs").addEventListener("click", e=>{
      const b=e.target.closest(".tab"); if(b) selectTab(b.dataset.key);
    });

    const cov = m.coverage || {};
    document.getElementById("foot").innerHTML =
      `출처: <b>${esc(m.source || "관세청 수출입무역통계 (공공데이터포털 data.go.kr)")}</b> · ` +
      `금액은 신고 미화금액(FOB) 기준 · 원자료는 천 달러 단위이며 달러로 환산 · ` +
      `공표는 매월 15일경, 전월까지 현행화되며 <b>과거 월이 소급 정정</b>됩니다 · ` +
      `섹터 탭은 시군구 API라 HS 6단위까지, 스캐너 탭은 품목별·국가별 API라 <b>HSK 10단위</b>입니다 · ` +
      `수집 범위 ${esc(cov.region_trade?.from ?? "?")}–${esc(cov.region_trade?.to ?? "?")}, ` +
      `${(cov.region_trade?.rows ?? 0).toLocaleString()}행 · ` +
      `소급 정정 감지 ${(cov.revisions ?? 0).toLocaleString()}건`;

    const want = location.hash.slice(1);
    const known = want === SCAN_KEY || (BAT && want === BAT_KEY)
      || (PCB && want === PCB_KEY)
      || (m.sectors||[]).some(s=>s.key===want && s.ready);
    // ★ ready[0].key 로 바로 가면, 섹터 수집이 실패해 ready 가 비었을 때
    //   undefined.key 로 페이지 전체가 죽는다 (배터리 데이터만 있어도 마찬가지였다).
    //   살아 있는 레이어를 순서대로 찾아 떨어지고, 아무것도 없으면 안내를 띄운다.
    const fallback = (WATCH||UNI||FLASH) ? SCAN_KEY
                   : (BAT ? BAT_KEY
                   : (PCB ? PCB_KEY : (ready[0] ? ready[0].key : null)));
    if (known || fallback) selectTab(known ? want : fallback);
    else document.getElementById("view").innerHTML =
      `<div class="empty"><h3>아직 수집된 데이터가 없습니다</h3>
        <p>수집이 한 번도 성공하지 않았거나 <code>site/data/</code> 가 비어 있습니다.
          GitHub Actions 의 <b>Update trade data</b> 워크플로를 실행하세요.</p></div>`;
  });

const reflow = () => {
  if (CUR === BAT_KEY && BAT) renderBattery();
  else if (CUR === PCB_KEY && PCB) renderPcb();
  else if (CUR === SCAN_KEY && (WATCH||UNI||FLASH)) renderScan(WATCH);
  else if (CUR && CACHE[CUR]) renderSector(CACHE[CUR]);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", reflow);
addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (k && k !== CUR && (k === SCAN_KEY || (BAT && k === BAT_KEY) || (PCB && k === PCB_KEY)
      || MANIFEST?.sectors.some(s=>s.key===k))) selectTab(k);
});
</script>
</body>
</html>
