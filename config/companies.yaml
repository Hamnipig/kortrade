# 기업 ↔ 수출 프록시 매핑
#
# 성립 근거: 관세청 시군구별 수출 통계는 「제조장소 우편번호」 기준으로 집계된다.
#   (출처: https://www.data.go.kr/data/15134343/openapi.do 설명문)
#
# ★ 단, 실측(2026-09 전국 스캔)에서 드러난 현실:
#   HS 330499 전국 1위 시군구는 **서울 강남구($1.44B)** 다. 강남에 화장품 공장은 없다.
#   실무에서 수출신고서의 제조장소란에 본사 주소를 적는 경우가 많기 때문이다.
#   즉 이 데이터는 '공장 위치'가 아니라 **'수출신고서에 기재된 주소'** 다.
#
#   따라서 기업을 등록할 때 물어야 할 것은 "공장이 어디냐"가 아니라
#   "수출신고를 어느 주소로 하느냐" 이다. 세 유형으로 갈린다:
#     - 브랜드사 밀집지(강남·송파·마포·용산) = 브랜드사 수출 프록시
#     - 공단지역(화성·음성·세종)             = ODM 제조사 프록시
#     - 본사=공장 동일 도시(강릉)            = 가장 깨끗. 귀속 모호성 최소
#
# purity (신호 순도 등급) — 반드시 discover_hs.py / purity_check 로 실측 검증 후 확정할 것
#   A : 해당 시군구 x HS6 수출이 사실상 단일 기업. 금액 레벨 그대로 사용 가능.
#   B : 동일 지역에 소수 동종업체 존재. 방향성(YoY/MoM)은 유효, 레벨은 주의.
#   C : 다수 업체 혼재. 지역 총계는 참고 지표. 기업 귀속 불가.
#   ? : 미검증. 수집만 하고 판단에 쓰지 말 것.
#
# verified: true 는 공장 소재지를 1차 출처(회사 공시/공식 홈페이지/지자체 자료)로 확인한 경우만.
#   news/위키 기반은 verified: false 로 두고 source 에 근거를 남긴다.

companies:

  파마리서치:
    ticker: "214450"
    market: KOSDAQ
    sido: 강원특별자치도       # 관세청 sidoCd = 51 (42 아님)
    sigungu: 강릉시
    purity: "B"          # 2026-09 실측 근거는 note 참조. A 로 올리려면 실적 회귀 검증 필요
    verified: false
    hs_watch:            # 2026-09 실측으로 330499 단독 집중 확인. 300610 은 강릉 수출 0
      - "330499"
    # 형제 10단위 코드 혼입분(비필러 화장품). 유진투자증권/KITA 10단위 수치와의 잔차 기준.
    # kpi.export_proxy(baseline_usd=...) 에 넣으면 레벨 정확도가 올라간다.
    # 두 가지 추정이 있다. 보수적으로 큰 쪽(470k)을 쓴다.
    #   (a) 2019~2022 월평균 = $352k/월 (cv 0.78) — estimate_baseline() 결과
    #   (b) 유진투자증권 10단위 수치와의 잔차 2022~ 평균 = $5.6M/년 = $467k/월
    # 470k 적용 시 유진 10단위 대비 오차: 2023 -9% / 2024 +11% / 2025 +3%
    # (보정 안 하면 2023 +26% / 2024 +34% / 2025 +11%)
    baseline_usd_month: 470000
    analysis_start: "2023-01"       # 이 이전 구간은 필러 비중이 낮아 회귀에 넣으면 왜곡
    kpi_coverage_ratio: 0.52        # 강릉 수출 / 파마리서치 해외매출 (2025, 환율 1,380 가정)
    kpi_link:
      # 프록시와 연결할 회사 KPI. dart_account 는 kpi_dart.py 가 쓰는 계정과목.
      primary: 별도 매출액
      segment_hint: 의료기기(리쥬란) + 화장품
    note: |
      본사·공장 강원특별자치도 강릉시 과학단지로 77-19(대전동).

      [2026-09 실측 결과] 강원(51) x 후보 HS6 14개를 2025년 전체로 스캔한 결과,
      강릉시 수출은 330499(기초화장품)에 압도적으로 집중된다:
        330499  85,311천$   |  330790 2,339  |  300490 839  |  340130 378
        300610       0천$   <- 조직수복용생체재료 후보였으나 강릉 수출 전무
      즉 리쥬란 계열 수출은 30류가 아니라 **330499 로 신고**되거나, 화장품 라인이
      강릉에서 직접 수출되고 있다. 어느 쪽이든 추적 코드는 330499 하나로 족하다.

      [시계열] 2019 $3.3M -> 2022 $6.6M -> 2023 $20.2M -> 2024 $33.4M -> 2025 $85.3M
               2026 1-8월 $86.8M (YoY +67%, 최근 3M YoY +88%, 가속 +28.6%p)
      2022->2023 구간에서 3배 점프하는 구조적 변곡이 있다.

      [순도 한계 — 반드시 유의] 이 데이터로 확인되는 것은 '강릉시 330499 수출액'이지
      '파마리서치 수출액'이 아니다. 강릉시 내 타사 비중은 API 로 분리 불가하다.
      간접 근거는 월 수출신고 건수(2019년 20건대 -> 2026년 110건대)뿐인데, 건수 증가가
      파마리서치 물량 증가인지 신규 업체 진입인지는 구분되지 않는다.
      등급 A 로 올리려면 파마리서치 분기 실적과의 회귀(kpi.leadlag) 통과가 필요하다.
    sources:
      - https://namu.wiki/w/파마리서치
      - https://www.medipana.com/news/articleView.html?idxno=403637

  휴젤:
    ticker: "145020"
    market: KOSPI
    sido: 강원특별자치도
    sigungu: 춘천시
    purity: "?"
    verified: false
    hs_watch: ["300212"]
    kpi_link: {primary: 연결 매출액, segment_hint: 보툴리눔 톡신}
    note: |
      [2026-09 실측] 춘천시 300212(면역혈청·혈액분획물) 2025년 수출 73,219천$.
      보툴리눔 톡신 제제가 이 코드로 신고되는 것으로 보인다(추정 — 회사 확인 필요).
      모멘텀은 정체: 2026 1-8월 $47.1M vs 2025 동기 $48.1M, 최근 3M YoY -1.3%.
      강릉(파마리서치)의 +88% 와 대조적이다.
    sources: []

  한국콜마:
    ticker: "161890"
    market: KOSPI
    sido: 세종
    sigungu: 세종특별자치시
    purity: "?"
    verified: true
    hs_watch: ["330499", "330491", "330410", "330420"]
    secondary_sites:
      - {sido: 경기, sigungu: 부천시, note: "색조화장품 공장"}
    kpi_link: {primary: 연결 매출액, segment_hint: 화장품 ODM}
    note: |
      세종 공장 = 기초화장품(스킨·토너·로션·앰플·에센스·크림·마스크팩·선케어, 향수, 퍼스널케어).
      부천 공장 = 색조화장품(파우더/유성 베이스).
      ODM이므로 수출 주체가 콜마가 아닌 브랜드사일 수 있음 → 제조장소 기준 집계에 잡히는지
      (수출신고인이 누구인지) 실측 확인 필요.
    sources:
      - https://www.kolmar.co.kr/businessinfo/korea.php

  코스맥스:
    ticker: "192820"
    market: KOSPI
    sido: 경기
    sigungu: 화성시
    purity: "?"
    verified: false      # 공식 페이지가 JS 렌더링이라 미확인. 사업보고서로 재확인 필요
    hs_watch: ["330499", "330410", "330420"]
    kpi_link: {primary: 연결 매출액, segment_hint: 화장품 ODM}
    note: 본사 경기 성남 판교. 국내 공장 소재지 1차 출처 미확인 상태.
    sources: []

  코스메카코리아:
    ticker: "241710"
    market: KOSDAQ
    sido: 충북
    sigungu: 음성군
