# ★ 여기에 **안 넣는 것**
#   에스아이플렉스(비상장): 2021년 본사를 안산→수원 영통구(광교)로 옮겼지만
#     안산 공장을 매각하고 양산을 베트남 법인에 집중시켰다. 수원에서 대규모
#     수출 물량으로 잡힐 가능성이 낮아 '수원=삼성전기' 추정을 흐리지 않는다.
#     수원 숫자가 삼성전기 실적과 크게 어긋나기 시작하면 그때 재검토한다.

