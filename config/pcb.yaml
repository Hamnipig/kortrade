# PCB·기판 레이어
#
# ══════════════════════════════════════════════════════════════════════════
# 왜 이 레이어가 따로 있는가
#
# iM증권 「PCB Tracker」(2026-09-28, 고의영·박정하)가 쓰는 표1 의 축은 넷이다.
#   한국  전국 PCB 수출 YoY · 안산/대구/구미/수원/세종/청주 YoY   ← KITA(=관세청)
#   일본  PCB 수출 YoY · IC기판 생산 YoY                          ← METI
#   대만  CCL/PCB/IC기판 판매 YoY                                 ← MOEA
#   미국  PCB Book-to-Bill Ratio                                  ← GEA(구 IPC)
#
# 이 중 **한국 축은 우리가 이미 받고 있는 데이터로 전부 재현된다.** 그것도 원출처로.
# 나머지 셋은 별도 수집이 필요하고, 그 조사 결과는
# claude/PCB-해외공식통계-무료API-조사.md 에 있다.
#
# ══════════════════════════════════════════════════════════════════════════
# 이 레이어의 중심축은 **ASP($/kg)** 다. 이유가 있다.
#
# 리포트는 "8월 PCB 수출액 +15% / 중량 −3% / ASP +18%('22.10 이후 최고)" 를
# 고다층·패키지기판 믹스 상승의 증거로 읽는다. 일본은 METI 가 品目別
# (일반/고다층/HDI/패키지기판) 생산액을 주니까 믹스를 직접 볼 수 있다.
#
# **한국은 못 본다.** HS 8534 의 한국 HSK 세분 기준은 층수가 아니라
# '형성된 회로의 종류'다(아래 코드 표 참조). 층수 세분은 중국 체계이고
# (중국 8534001000 = 4층 초과), 코드 번호가 겹쳐 혼동하기 쉽다 — 한국에는 없다.
#
#   → 한국에서 고부가 전환을 볼 수 있는 유일한 창은 **금액 ÷ 중량 = ASP** 다.
#     그래서 이 레이어는 P/Q 분해(kortrade/pq.py)를 화면 맨 위에 둔다.
#     금액만 보는 대시보드에서는 '물량이 늘어 +15%' 와 '단가가 올라 +15%' 가
#     같은 칸에 들어간다. AI 서버용 고다층 전환은 정확히 후자로 나타난다.
#
# ★ 중량은 **국가 축(sector_trade, 품목별 국가별 API)에서만** 온다.
#   시군구 API 에는 중량 필드가 없고, 2026-09-01 지침으로 시군구 중량·HSK10 은
#   아예 비공개가 됐다. 그래서 지역 분해(안산·수원…)는 **금액만** 나온다.
#   지역 축에서 ASP 를 기대하지 말 것 — 원리적으로 없다.
#
# ══════════════════════════════════════════════════════════════════════════
# 코드 검증 상태 — status 의 뜻이 여기서는 세 가지다
#
#   probe : 관세율표(2025-01-01 발효) 품명까지 확인했으나 **관세청 OpenAPI 실측
#           전**. 수집은 하되, 응답의 hs_name 이 expect 문자열과 맞아야 집계에
#           들어간다. 빌드가 매번 대조하고 결과를 payload.verify 에 남긴다.
#   active: 실측·품명 대조를 모두 통과해 승격된 것. (첫 수집 전에는 없다)
#   draft : 코드 자체가 불확실하거나 순도가 너무 낮다. **집계에 절대 넣지 않고**
#           규모·단가만 측정해 채택 여부의 근거로 보여준다.
#
# 이 프로젝트는 "미검증 코드로 수집하면 조용히 빈 데이터나 엉뚱한 품목이 쌓인다"는
# 원칙을 지켜 왔다(sectors.py). 다만 '전부 draft' 로 두면 화면이 영원히 비는데,
# 그건 원칙이 아니라 부작용이다. probe 는 그 사이를 **기계 대조**로 메운다 —
# demand.yaml 의 expect 방식과 같다.
#
# ── 출처 ──
# 품명·코드 = 관세율표(국가법령정보센터, 2025-01-01 발효)를 옮긴
#   Korea Tariff Atlas https://pilsunchoi.github.io/KoreaTariffAtlas/
#   이 프로젝트가 OpenAPI 로 이미 실측한 4건(8507602000/8507603000/2841909020/
#   8486402010)과 교차검증해 전부 일치했다. 그래도 1차 출처는 아니므로 probe 다.
# CCL 7410211000 은 독립 2번째 출처로도 확인:
#   https://moneyrecipe.blog/export-statistics/ccl/ (두산 프록시로 사용)
# ══════════════════════════════════════════════════════════════════════════

version: "2026-09-30"

window: 8                  # 비교창(개월)
recent: 3                  # 최근창(개월)
hist: 30                   # 시계열 보관 길이
leadlag_max_months: 6      # 소재·장비 → 완제품 시차 상관 탐색 범위

# 원가(수입 CCL 단가) → 판가(수출 PCB ASP) 회귀 설정. battery 와 같은 구조다.
spread:
  max_lag_months: 4
  min_months: 12
  min_r2: 0.25

# 국가 분해 대상. 중계·재수출 비중이 큰 곳은 hubs 에 따로 적는다.
markets: ["US", "CN", "HK", "TW", "JP", "VN", "TH", "MX", "DE", "HU", "IN"]
hubs:
  HK: 중계무역 허브. 대중국 우회 물량이 섞인다 — 최종 수요지로 읽으면 안 된다.
  VN: 삼성 베트남 생산기지향 부품 공급. 최종 소비가 아니라 **한국 기업의 해외 조립라인**이다.

# ══════════════════════════════════════════════════════════════════════════
# 완제품 — HS 8534 인쇄회로
#
# ★ 한국 HSK 3개는 층수가 아니라 '형성된 회로의 종류' 로 갈린다.
#   8534.00.2000 과 8534.00.9000 은 **사이클이 다를 수 있다.** 이 프로젝트의
#   합산 원칙(월별 증감률 r ≥ 0.6 이어야 합산)대로 빌드가 상관을 재서 보여준다.
#   r < 0.4 로 나오면 합계를 쓰지 말고 코드별로 읽어야 한다.
# ══════════════════════════════════════════════════════════════════════════
board:
  - code: "8534002000"
    label: 인쇄회로 — 테이프·리드프레임형
    status: probe
    purity: medium
    expect: "리드프레임"
    note: >
      공식 품명 '테이프형이나 리드프레임(lead frame) 기능을 하는 회로가 형성된 것'.
      롤투롤 패키지기판(COF/TAB/BGA substrate) 계열이 여기로 들어온다 — 해성디에스
      프록시 후보. 정의가 좁아 세 코드 중 순도가 가장 높다. 2025 수입 $1.8B.
  - code: "8534009000"
    label: 인쇄회로 — 기타
    status: probe
    purity: low
    expect: "기타"
    note: >
      잔여 코드. 일반 다층 PCB(이수페타시스·코리아써킷), FC-BGA·FC-CSP(삼성전기·
      대덕전자·심텍), HDI 가 **전부 섞인다.** 개별 기업 프록시로 쓰면 안 되고
      섹터 지표로만 쓴다. 규모는 가장 크다(2025 수입 $1.4B).
      리포트의 '전국 PCB 수출'은 사실상 이 코드가 끌고 간다.
  - code: "8534001000"
    label: 인쇄회로 — 수동소자 형성
    status: probe
    purity: low
    expect: "수동소자"
    note: >
      '수동소자 부분[인덕턴스·저항기·축전기 등]이 형성된 것'. 규모가 작다
      (2025 수입 $27M). 합계에는 넣되 개별 해석은 하지 않는다.

# ══════════════════════════════════════════════════════════════════════════
# 소재 — CCL·동박·드라이필름. **완제품에 선행한다**(재료를 사야 만든다).
# ══════════════════════════════════════════════════════════════════════════
material:
  - code: "7410211000"
    label: CCL (동박적층판)
    status: probe
    purity: high
    expect: "인쇄회로판"
    cost: true              # 수입 단가를 원가 축으로 쓴다
    note: >
      공식 품명 '인쇄회로판 제조에 적합한 모양인 것'(정제구리, 뒷면 붙인 것).
      **PCB 원판 그 자체**라 순도가 높다 — 두산 전자BG 프록시로 통용된다.
      수출입 양쪽을 다 본다: 수출은 두산의 판매, 수입은 국내 PCB 업체의 원가.
      2025 수입 약 $410~420M.
  - code: "7410110000"
    label: 동박 (전해동박, 뒷면 미부착)
    status: probe
    purity: low
    expect: "정제한 구리"
    note: >
      ⚠ **배터리용 일렉포일(SK넥실리스·롯데EM·솔루스)과 PCB용 동박이 한 코드에
      섞인다.** 한국 HSK 에 분리 코드가 없다. 개별 기업 프록시로 쓸 수 없고,
      2차전지 레이어의 동박(같은 코드)과 **중복**이라는 점도 기억할 것.
      그래도 싣는 이유: CCL 원가의 선행 변수이고, $/kg 축에서 배터리용 극박과
      PCB 용의 믹스 변화가 보일 가능성이 있다(미검증).
  - code: "3701303000"
    label: 감광성 드라이필름 (PCB용)
    status: probe
    purity: medium
    expect: "인쇄회로기판용"
    note: >
      공식 품명이 '인쇄회로기판용'으로 못 박혀 있다 — 용도가 코드에 명시된
      드문 경우다. 한국은 순수출국(동우화인켐·코오롱인더)이라 **수출** 쪽을 본다.
      2025 수입은 $14.8M 로 작다. PCB 생산량(Q)에 비례하는 소모재라
      금액보다 **물량** 축이 의미를 갖는다.
  - code: "7410221000"
    label: CCL (구리합금)
    status: draft
    purity: unknown
    note: >
      2025 수입 $0.03M. 규모가 3~4자릿수 작아 합치면 7410211000 에 묻힌다.
      측정만 하고 집계에는 넣지 않는다.

# ══════════════════════════════════════════════════════════════════════════
# 장비 — CAPEX. **수요가 아니라 증설의 흐름**이라 합계에서 뺀다(battery 와 동일).
# ══════════════════════════════════════════════════════════════════════════
equipment:
  - code: "8456111000"
    label: PCB 레이저 가공기
    status: probe
    purity: medium
    expect: "인쇄회로"
    note: >
      품명 '인쇄회로, 인쇄회로조립품, 제8517호의 부분품 또는 자동자료처리기계의
      부분품의 제조에 전용 또는 주로 사용되는 종류의 것'. 비아홀 드릴링.
      이미 워치리스트에 active 로 올라가 있는 코드다(laser_pcb).
      고다층·패키지기판 증설의 **선행** 지표.
  - code: "8479892010"
    label: 인쇄회로조립품 제조기계
    status: probe
    purity: medium
    expect: "인쇄회로조립품"
    note: >
      품명 '인쇄회로조립품 제조에 전용 또는 주로 사용되는 종류의 것'. SMT·실장
      라인. 2025 수입 $86M. 대조군 8479892090(기타)은 $1.5M 로 무시 가능.
  - code: "8486402040"
    label: 솔더볼 마운터
    status: draft
    purity: unknown
    note: >
      '납볼을 반도체 제조용 인쇄회로기판이나 세라믹기판에 탑재하는 기계'.
      품명은 정확하지만 2025 수입 $1.08M 로 규모가 2~3자릿수 작다.
      합치면 묻히므로 측정만 한다.

# ══════════════════════════════════════════════════════════════════════════
# 시군구 — 리포트 그림16~21 의 6개 지역
#
# ⚠ 관세청 지역 귀속은 「제조장소 우편번호」(제조자 사업장 소재지) 기준이지만
#   **수출자 자기신고 항목**이라 품목·기업마다 품질이 다르다. 화장품에서 실증됐다:
#   화성이 색조에서는 1위인데 기초에서는 8위 밖이었다. PCB 도 같은 한계를 갖는다.
#   '안 잡힌다'가 '생산이 없다'를 뜻하지 않는다.
#
# ★ 2026-09-01 지침으로 시군구 × HS 2·4·6단위 **중량이 비공개**가 됐다.
#   그래서 지역 축은 금액만 나오고, ASP 를 지역별로 쪼갤 수 없다.
# ══════════════════════════════════════════════════════════════════════════
region_codes: ["853400", "741021", "741011"]

# ── 지역 ↔ 기업 귀속 ──────────────────────────────────────────────────────
#
# firms  : 그 시군구 기판 수출에 잡힐 것으로 **추정되는** 기업. 화면의 '(삼성전기 등)'.
# basis  : 그 기업이 그 시군구에 무엇으로 있는가 — 본사 / 공장 / 본사·공장.
#          이게 왜 중요한가: 관세청 지역 귀속은 「제조장소 우편번호」지만 **수출자
#          자기신고 항목**이라 실무에서 본사 주소를 적는 일이 흔하다(화장품 실측:
#          HS 330499 전국 1위가 서울 강남구였다 — 강남에 화장품 공장은 없다).
#          basis 가 '본사'면 그 숫자는 **그 도시의 생산량이 아니라 그 기업의
#          신고분**일 수 있다. 삼성전기 수원이 정확히 이 경우다.
# grade  : 귀속 추정 등급. 레벨을 믿어도 되는지를 가른다.
#          A = 사실상 단일 기업. 금액 레벨 그대로 기업 프록시로 쓸 수 있다.
#          B = 소수 동종업체 혼재. **방향(YoY·가속)은 유효, 레벨은 주의.**
#          C = 다수 혼재. 지역 총계는 참고치이고 기업 귀속은 하지 않는다.
# ★ 어느 등급이든 이건 **소재지 기반 추정**이지 기업별 통관 실적이 아니다.
#   관세청은 기업 단위 수출액을 공개하지 않는다. 화면에 '추정'이라고 못박는다.
#
# ★ 2026-11-11 정정. 이전 설정은 안산에 '심텍', 청주에 '대덕전자', 인천에
#   '대덕전자'를 적어 두고 있었는데 **전부 틀렸다.** 각 사 공식 사업장 안내로
#   재확인한 결과: 심텍은 청주 단일, 대덕전자는 안산(본사·MLB·MTV)+시흥(B1·B4),
#   인천은 비에이치(부평구 본사·서구 제2공장)다. 틀린 기업명을 달아 두면
#   지역 숫자를 그 기업 실적으로 읽는 순간 판단이 통째로 어긋난다.
places:
  - match: 안산
    firms: ["대덕전자(353200)", "코리아써키트(007810)", "인터플렉스(051370)", "티엘비(356860)"]
    basis: 본사·공장
    grade: C
    why: >
      국내 최대 PCB 집적지. 네 곳이 전부 안산 단원구에 본사와 공장을 함께 두고
      있어 **한 기업으로 귀속할 수 없다.** 리포트 그림16.
    caution: >
      코리아써키트·인터플렉스는 같은 영풍 계열이고 인터플렉스 본사 주소
      (강촌로 149)는 코리아써키트 3공장 주소와 같다. 둘을 분리할 방법이 통관
      데이터에는 없다. 인터플렉스·티엘비는 양산 주력이 베트남이라 국내 신고분이
