# 고정 표시 시군구 — 순위와 무관하게 항상 보여준다
#
# 왜 필요한가 (2026-09-23 실측)
#   기초(330499) 상위 8개 시군구가 전부 **브랜드사 본사·물류 거점**이었다.
#     서울 강남구 $1,443M · 인천 제물포구 $930M · 서울 송파구 $565M ·
#     경기 김포시 $387M · 성남시 · 마포구 · 강북구 · 중구
#   상위 8개 합계는 $4,230M 으로 카테고리($7,344M)의 **58%** 에 불과하다.
#   나머지 42% 는 표시되지 않는 시군구에 흩어져 있다.
#
#   반면 기초화장품 ODM 의 핵심 생산지로 알려진 세종(한국콜마)·음성(코스메카)은
#   **어느 카테고리에도 상위 8위 안에 없었다.** 화성은 색조(입술·눈화장)에서는
#   1위인데 기초에서는 8위 밖이다.
#
#   → 컷오프 때문에 안 보이는 것인지, 애초에 그 지역으로 안 잡히는 것인지
#     **구분이 안 됐다.** 고정 표시를 하면 실제 값(0이면 0)이 찍히므로
#     그 질문이 데이터로 답해진다. 0 이라는 사실도 정보다.
#
# 매칭은 부분 문자열이다 — '세종'이 '세종특별자치시'로 오든 '세종 세종시'로 오든 잡힌다.
# ══════════════════════════════════════════════════════════════════════════
pinned_places:
  - match: 화성
    why: 코스맥스·씨앤씨인터내셔널 등 ODM 생산 거점. 색조에서는 1위인데 기초에서는 안 보인다.
  - match: 세종
    why: 한국콜마 세종공장 — 기초·선케어 주력. 상위 8위 안에 없다.
  - match: 음성
    why: 코스메카코리아·한국콜마 음성 — 기초 ODM. 상위 8위 안에 없다.
  - match: 청주
    why: LG생활건강 청주공장. 샴푸에서만 잡힌다(4위).
  - match: 오산
    why: 아모레퍼시픽 오산공장. 눈화장에서만 잡힌다(4위).
  - match: 평택
    why: 코스맥스 평택. 어느 카테고리에도 안 보인다.

