# 중계무역 허브 — 확산도를 계산할 때 **빼고도 한 번 더** 본다
#
# 왜 (2026-09-23)
#   식약처 '26 상반기 발표에서 네덜란드 +220%, 에스토니아 +196%, 영국 +151% 로
#   유럽이 급증했다. 이걸 그대로 '유럽 시장 개척'으로 읽으면 틀린다.
#   로테르담·발트·두바이·홍콩은 **재수출 관문**이고 최종 소비지가 아니다.
#   상당 부분이 러시아·CIS·아프리카로 넘어간다.
#
#   방증: 뷰티경제 2026-08 기초화장품 국가별 단가(관세청 기준)
#     UAE 53.9 / 네덜란드 49.4 / 영국 43.4  vs  미국 27.3 / 일본 29.9 $/kg
#   소비 시장이라면 나오기 어려운 단가 구조다.
#
#   → 허브 포함 확산도와 허브 제외 확산도를 나란히 낸다.
#     둘이 갈리면 그 자체가 신호다 — "확산 중"이 실은 재수출 증가일 수 있다.
#
# ※ 국가코드는 **반드시 따옴표**로 감쌀 것. YAML 1.1 에서 NO(노르웨이)는 불리언이 된다.
# ※ 여기 적는 국가는 countries 목록에 있어야 한다(없으면 validate 가 잡는다).
# ══════════════════════════════════════════════════════════════════════════
