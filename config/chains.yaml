# 밸류체인 — 해외 현지생산 보정용
#
# ── 왜 필요한가 ──
# 수출 데이터의 가장 큰 구멍은 **해외 현지생산**이다. 기업이 미국 공장에서 셀을
# 조립하기 시작하면 국내 셀 수출은 줄지만 그 기업 실적은 오히려 좋아질 수 있다.
# 완제품 수출 감소를 수요 감소로 읽으면 정반대 결론이 나온다.
#
# ── 어떻게 푸는가 ──
# 완제품이 현지로 가도 **부품·소재·장비는 여전히 한국에서 나간다.**
# 그래서 품목 하나가 아니라 단계를 묶어서 본다.
#
#   chain_total    = 완제품 + 부품 + 소재        진짜 수요. 이게 늘면 수요는 살아있다
#   localization   = (부품 + 소재) / 완제품      오르면 현지생산 전환 진행 중
#   equipment      = 장비                        현지 증설의 선행 지표(1~2년 앞섬)
#
# ── 실증 (2026-09-18, 對미) ──
#   완제품 셀   $1,630M → $1,667M  (+2%)
#   부품·소재   $1,093M → $1,407M  (+29%)
#   체인 전체   $2,723M → $3,075M  (+13%)
#   현지화지수  2025 내내 0.35~0.92 → 2026-06 이후 1.35 / 1.54 / 1.83
#   특히 전지 부분품(8507909000) 對미 **+191%**.
#   ESS 셀 −13% 만 보고 수요 위축으로 판단하면 틀린다.
#
# ── 한계 (반드시 같이 읽을 것) ──
#   1. 간접 추정이다. 현지법인 매출·가동률은 통관 데이터에 원리적으로 없다.
#      최종 확인은 DART 연결재무제표 부문정보(지역별 매출)와 대조해야 한다.
#   2. 현지 조달이 늘면(미국산 양극재 채택 등) 상류 프록시도 함께 죽는다.
#      현지화지수가 오르다가 꺾이면 '현지화 완료'일 수도, '수요 위축'일 수도 있다.
#   3. 부품 코드에는 그 체인과 무관한 물량이 섞인다. 절대 수준이 아니라 추세로 읽을 것.

version: 2026-09-18

chains:

  - key: battery
    name: 2차전지
    order: 1
    markets: ["US", "PL", "HU"]        # 현지생산이 진행 중인 시장
    thesis: >
      북미 IRA·유럽 현지화로 셀 조립이 현지로 옮겨가는 중이다. 셀 수출 감소가
      수요 감소인지 현지 전환인지는 부품·소재를 같이 봐야 갈린다.
    stages:
      final:
        - {code: "8507602000", label: "EV셀"}
        - {code: "8507603000", label: "ESS셀"}
        - {code: "8507609000", label: "소형·IT·공구셀"}
      component:
        - {code: "8507909000", label: "전지 부분품"}
      material:
        - {code: "2841909020", label: "양극재 NCM"}
        - {code: "2841909030", label: "양극재 NCA"}
        - {code: "3801101000", label: "음극재 인조흑연"}
      equipment:
        - {code: "8479899050", label: "코팅머신(도포기)"}
    evidence: >
      3801101000 은 품명이 '이차전지 제조용'으로 명시돼 있어 순도가 높다($43M).
      8507909000 '전지 부분품'($881M)은 격리판 외 잔여라 다른 물량이 섞일 수 있으나,
      對미 +191% 라는 움직임 자체가 현지 조립 전환과 시점이 맞는다.
      8479899050 '코팅머신'($157M)은 전극 코터로 2차전지 장비의 대표 코드다.
      ※ 분리막·전해액은 코드 순도가 낮아 제외했다 —
        3920100000(PE필름 $103M)은 포장용이 섞이고, 3824999053(전해액 $33M)은
        규모가 체인 대비 미미하다. 확인 후 추가할 것.

  - key: auto
    name: 자동차
    order: 2
    markets: ["US", "IN", "CA", "DE"]
    thesis: >
      현대차·기아의 미국(HMGMA)·인도 현지생산이 커질수록 완성차 수출은 줄고
      부품(KD 포함) 수출이 는다. 완성차 대수만 보면 실적을 과소평가한다.
    stages:
      final:
        - {code: "8703401000", label: "하이브리드 신차"}
        - {code: "8703801000", label: "BEV 신차"}
        - {code: "8703231010", label: "가솔린 1.5~3.0L 신차"}
        - {code: "8703227000", label: "가솔린 1.0~1.5L 신차"}
        - {code: "8703241010", label: "가솔린 3.0L 초과 신차"}
        - {code: "8703239010", label: "디젤 1.5~2.5L 신차"}
      component:
        - {code: "8708999000", label: "자동차 부품 기타"}
        - {code: "8708400000", label: "기어박스"}
        - {code: "8708290000", label: "차체 부품"}
        - {code: "8708501000", label: "구동 차축"}
        - {code: "8708800000", label: "서스펜션"}
        - {code: "8708309000", label: "브레이크 부품"}
      material: []
      equipment: []
    evidence: >
      완성차 상위 6종 합계가 8703 호의 대부분이다(하이브리드 $11,820M 이 최대).
      부품은 8708 상위 6종 $9,443M. 부품 코드는 현대모비스·현대위아 외
      다수 벤더가 공유하므로 순도는 낮고, **추세와 비율**로만 읽어야 한다.
      ※ 완성차 코드는 '신차'만 담았다. 중고차는 사이클이 달라 제외.
