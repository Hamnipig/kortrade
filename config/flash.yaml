# ══════════════════════════════════════════════════════════════════════
# 국가 슬롯 (flash_country API)  ★ 미검증 — 화면에 띄우지 않는다
#
# 선언 순서는 중국/미국/EU/베트남/홍콩/일본/대만/인도/싱가포르/말레이시아 이지만,
# 실측 규모가 통념과 맞지 않는 구간이 있다 (2026-08 월전체 $B):
#   01 24.11 / 02 16.50 / 03 6.63 / 04 8.82 / 05 8.90 / 06 2.69
#   07 6.47 / 08 2.35 / 09 2.38 / 10 3.36   (01~10 합계 82.21 = 전체의 84%)
#
# slot01 을 중국으로 읽으면 대중 수출이 월 $24B(전체의 24.5%)가 된다. 반도체가
# 전체의 48%인 국면이라 불가능하다고 단정할 수는 없지만, **확인 없이 쓰면 안 된다.**
# 품목 코드 12개를 잘못 읽었던 전례가 있다 — 근거 없이 active 로 올리지 않는다.
#
# 확인 절차: `python scripts/verify_flash.py --countries`
#   품목별국가별 API 로 국가별 전체 수출 월계를 따로 받아 각 슬롯과 상관·레벨을
#   맞춰본다. 결과는 data/flash_verify.json 에 남고, build_flash.py 가 그 파일을
#   보고 화면을 연다. **이 파일의 verified 는 사람이 쓴 기본값이고, 개방권은
#   기계가 확인한 결과에만 준다** — 손으로 true 로 바꿔서 여는 길을 막아 둔 것이다.
#   검증 전까지 수집·저장은 계속하되 화면에는 내보내지 않는다.
# ══════════════════════════════════════════════════════════════════════

country:
  verified: false
  verified_note: >
    선언 순서(중국/미국/EU/베트남/홍콩/일본/대만/인도/싱가포르/말레이시아)와 실측 규모의
    정합을 아직 확인하지 못했다. scripts/verify_flash.py --countries 로 검증 후 개방한다.
  slots:
    "00": {label: 전체 수출, total: true}
    "01": {label: 중국, code: CN}
    "02": {label: 미국, code: US}
    "03": {label: EU, code: EU}
    "04": {label: 베트남, code: VN}
    "05": {label: 홍콩, code: HK}
    "06": {label: 일본, code: JP}
    "07": {label: 대만, code: TW}
    "08": {label: 인도, code: IN}
    "09": {label: 싱가포르, code: SG}
    "10": {label: 말레이시아, code: MY}

# ══════════════════════════════════════════════════════════════════════
# 파생 지표 — 슬롯 두 개를 나눠서 만드는 값
# ══════════════════════════════════════════════════════════════════════
ratios:
  - key: auto_loc
    name: 자동차 현지화지수(속보)
    num: "07"                 # 자동차부품
    den: "03"                 # 승용차
    rising_means: 현지 조립 비중 상승
    note: >
      밸류체인 레이어의 현지화지수를 10일 단위로 앞당겨 본 것이다. 다만 이 API 는
      국가 분해가 없어 **전 세계 합계** 기준이다. 어느 나라에서 현지화가 일어나는지는
      월별 확정 데이터(밸류체인 탭)로 확인해야 한다.
  - key: mem_ssd
    name: 메모리 대비 SSD
    num: "08"                 # 컴퓨터 주변기기(실질 SSD)
    den: "01"                 # 반도체
    rising_means: 완제품(SSD) 쪽으로 무게중심 이동
    note: 둘이 같이 오르면 메모리 사이클, 08만 오르면 SSD 단독 수급이다.
