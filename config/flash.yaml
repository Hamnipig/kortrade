# 속보(旬 단위 잠정치) 레이어 설정
#
# 목적 ─ 확정 월별 통계보다 **2주 먼저** 주요 산업의 방향을 읽는다.
#
#   공표 시점        01~10일 누계 → 11일경
#                    01~20일 누계 → 21일경
#                    01~말일 누계 → 익월 1일경      ← 월전체 '잠정치'
#                    월별 확정치  → 익월 15일경      ← 기존 레이어
#   → 월전체 기준으로 **약 15일**, 상순 기준으로는 **약 35일** 선행한다.
#
# ─────────────────────────────────────────────────────────────────────
# 읽는 법 (이 레이어를 잘못 읽는 세 가지 방법)
#
# 1) 누계 YoY 를 그대로 믿는다  →  틀린다.
#    1~10일 안에 주말/공휴일이 몇 개 들어있는지가 해마다 다르다. 2025년 9월 상순은
#    평일 7일, 2026년 9월 상순은 평일 8일이면 그것만으로 +14% 가 생긴다.
#    관세청 보도자료가 항상 '일평균 수출액'을 병기하는 이유가 이것이다.
#
# 2) 그래서 일평균만 본다  →  이것도 반쪽이다.
#    공휴일(설·추석·대체공휴일)은 해마다 날짜가 바뀌는데, 이 API 는 조업일수를
#    주지 않는다. 우리가 계산할 수 있는 것은 **평일수(월~금)** 뿐이고, 이는
#    공휴일을 반영하지 못한다. 추석이 낀 순(旬)에서는 여전히 틀린다.
#
# 3) 가장 안전한 축 = **점유율(share)**.
#    같은 순(旬) 안에서는 모든 품목이 조업일수를 공유하므로, '전체 수출 대비
#    이 품목의 비중'과 그 전년 대비 변화(%p)는 **조업일수에 완전히 중립**이다.
#    속보에서 산업 간 상대 강도를 볼 때는 이 축을 우선한다.
#
#   그리고 절대 수준을 보고 싶으면 '월 착지 추정'을 쓴다. 단순 비례식
#       추정 = 올해 누계 × (작년 월전체 ÷ 작년 같은 순 누계)
#   은 쓰지 않는다. 이 식의 전년비는 **정의상 누계 YoY 와 정확히 같아서**
#   새 정보가 하나도 없고, 없는 정보를 있는 것처럼 보여주게 된다.
#   대신 남은 기간을 올해의 평일 수로 채운다:
#       ρ   = (올해 누계÷올해 평일수) ÷ (작년 누계÷작년 평일수)
#       추정 = 올해 누계 + ρ × (작년 잔여 일당) × (올해 잔여 평일수)
#   이러면 착지 YoY 와 누계 YoY 가 서로 다른 숫자가 되고, 그 차이가 곧
#   '조업일수 때문에 생긴 착시'의 크기다. (공휴일은 여전히 못 센다.)
# ─────────────────────────────────────────────────────────────────────

version: "2026-09-21a"

unit: 천달러                 # 원본 단위. 수집 시 ×1000 하여 달러로 저장한다.
cumulative: true            # 값은 1일부터의 누계. 구간값은 직접 빼야 한다.

# 착지 추정을 신뢰하는 최소 기준선(달러). 이보다 작은 품목은 추정을 내지 않는다.
min_base_usd: 100000000     # 1억 달러

# 속보 월전체(잠정)와 확정 월별 통계의 허용 괴리. 넘으면 화면에 경고를 띄운다.
# 잠정↔확정 차이는 정상이지만, 5%를 넘으면 매핑이나 단위를 의심해야 한다.
reconcile_tolerance_pct: 5.0

# ══════════════════════════════════════════════════════════════════════
# 품목 슬롯 (flash_item API)
#
# 검증 방법 — 이 API 는 필드명이 itemUsdAmt00~10 으로 **번호뿐**이라 순서를 틀리면
# 산업을 통째로 바꿔 읽게 된다. 그래서 외부 문서의 선언 순서를 믿지 않고,
# **이미 독립적으로 수집해 둔 10단위 실측치와 시계열을 맞춰** 확인했다.
#
#   결정적 검증: slot 08 vs 우리가 따로 모은 SSD(HSK 8523511000) 월별 수출액
#     2025-01 ~ 2026-08 (20개월)
#     레벨 상관 r = 0.9999 · 전월비 증감률 상관 r = 0.977
#     SSD ÷ slot08 비율 0.57~0.93 (중앙값 0.78) — SSD 가 부분집합이므로 1 미만이 맞다
#   => slot08 = 컴퓨터 주변기기 확정. 나머지는 이 순서와 규모(2026-08 월전체)로 정합.
#
# 2026-08 월전체 잠정치 ($B) — 슬롯 규모 검증용 실측 기록
#   00 전체 98.28 / 01 46.83 / 02 4.04 / 03 3.64 / 04 6.88 / 05 1.65
#   06 1.63 / 07 1.42 / 08 6.41 / 09 0.86 / 10 0.51
#   01~10 합계 = 73.87 (전체의 75%) — 10대 품목 합계로 타당한 수준이다.
# ══════════════════════════════════════════════════════════════════════

item:
  verified: true
  verified_note: >
    slot08 을 SSD 실측 시계열과 대조해 r=0.9999 로 확정하고, 나머지는 선언 순서와
    2026-08 규모(반도체 46.8B / 석유 6.9B / 철강 4.0B …)가 모두 정합함을 확인했다.
  slots:
    "00": {label: 전체 수출, total: true}
    "01":
      label: 반도체
      hs: "8541 · 8542"
      tickers: [삼성전자 005930, SK하이닉스 000660]
      note: 2026-08 기준 전체 수출의 48%. 이 슬롯 하나가 속보 전체를 흔든다.
      watch: ["8542311000", "8542321000"]
    "02":
      label: 철강제품
      hs: "72 · 73"
      tickers: [POSCO홀딩스 005490, 현대제철 004020]
      note: 미국 관세·중국 감산의 영향이 가장 빨리 찍히는 슬롯.
    "03":
      label: 승용차
      hs: "8703"
      tickers: [현대차 005380, 기아 000270]
      chain: auto
      stage: final
      note: 해외 현지생산이 늘면 이 슬롯은 줄고 07(부품)은 는다. 둘을 같이 봐야 한다.
    "04":
      label: 석유제품
      hs: "2710"
      tickers: [S-Oil 010950, SK이노베이션 096770, GS 078930]
      note: 유가(P)와 물량(Q)이 섞인다. 금액 증감만으로 정제마진을 읽으면 안 된다.
    "05":
      label: 무선통신기기
      hs: "8517"
      tickers: [삼성전자 005930, LG이노텍 011070]
    "06":
      label: 선박
      hs: "89"
      tickers: [HD한국조선해양 009540, 한화오션 042660, 삼성중공업 010140]
      note: 인도(引渡) 시점에 한 척이 통째로 찍힌다. 월 단위 변동이 원래 크다 — 추세만 본다.
      lumpy: true
    "07":
      label: 자동차부품
      hs: "8708"
      tickers: [현대모비스 012330, 한온시스템 018880, HL만도 204320]
      chain: auto
      stage: component
    "08":
      label: 컴퓨터 주변기기
      hs: "8471 · 8523.51"
      tickers: [삼성전자 005930, SK하이닉스 000660]
      note: >
        실질은 SSD 다. 우리 워치리스트의 8523511000(SSD) 이 이 슬롯의 78%를 차지한다.
        01(반도체)과 함께 움직이면 메모리 사이클, 따로 움직이면 SSD 수급 이슈다.
      watch: ["8523511000"]
