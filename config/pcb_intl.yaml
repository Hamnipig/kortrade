# PCB 해외 대조축 — 일본 METI 생산동태통계 (e-Stat API)
#
# ══════════════════════════════════════════════════════════════════════════
# 왜 일본인가 — 한국 데이터에 **없는 축**이 여기 있다
#
# 한국 HS 8534 에는 층수 구분이 없다. HSK 세 개는 '형성된 회로의 종류'로 갈리고,
# 층수 세분(4층 초과/이하)은 중국 체계다. 그래서 AI 서버용 고다층·패키지기판으로의
# **믹스 전환을 한국 데이터로는 직접 볼 수 없다** — ASP($/kg)로 간접 추정할 뿐이다.
#
# 일본 METI 생산동태통계는 品目別로 쪼개 준다:
#   プリント配線板(片面/両面/多層) · ビルドアップ多層配線板 · フレキシブルプリント配線板
# 이게 한국 ASP 상승이 **진짜 믹스 상승인지** 아니면 구리값·환율인지를 가르는
# 유일한 외부 대조군이다. 리포트(iM증권 2026-09-28)도 일본 축을 그 용도로 쓴다.
#
# ★ 두 나라 숫자를 **더하지 않는다.** 단위(엔 vs 달러)도, 개념(생산 vs 수출)도,
#   집계 모집단도 다르다. 방향과 변곡만 나란히 놓고 본다.
#
# ══════════════════════════════════════════════════════════════════════════
# 확인한 것 / 확인 못 한 것  (2026-09-30, e-Stat 공식 페이지 직접 확인)
#
# 확인됨
#   · API 최신 버전 3.0, 엔드포인트 https://api.e-stat.go.jp/rest/3.0/app/json/...
#   · 전 API 공통 필수 파라미터는 appId 하나. getStatsList 는 고유 필수 파라미터가 없다
#   · getStatsData 는 statsDataId 또는 dataSetId **중 정확히 하나** 필수
#     (둘 다 없거나 둘 다 있으면 에러)
#   · 1회 반환 상한 10만 건. 초과 시 응답의 NEXT_KEY 를 startPosition 에 넣어 이어받는다
#   · 호출 횟수 제한 없음(FAQ 2-Q3). 단 약관 제5조3항·제8조가 과부하 시 제한을 유보
#   · 무료 · 상업적 이용 가능 · **출처 표기 의무**(제7조, 아래 credit)
#
# 확인 못 함 — 그래서 이 파일은 statsDataId 를 **박아 두지 않는다**
#   · 「製品月表 ３５．電子部品」의 현재 statsDataId. 과거 0003058554 로 알려졌으나
#     최근 「時系列表」로 재편된 흔적이 있다(0004014xxx 대). ID 를 상수로 박으면
#     재편 때 조용히 빈 데이터가 쌓인다 — 2차전지 최종 수요 축에서 EIA 라우트를
#     상수로 박았다가 겪은 사고와 같은 구조다.
#   → run_pcb_intl.py 가 **매번 getStatsList 로 찾고**, 무엇을 골랐는지와 후보
#     전체를 data/pcb_intl_verify.json 에 남긴다. 화면이 비면 그 파일이 이유를 말한다.
#   · 品目 코드값. 코드가 아니라 **이름(CLASS @name)으로 매칭**한다. 코드는 개정되지만
#     이름은 남는다. 매칭 결과도 verify 파일에 전부 남긴다.
# ══════════════════════════════════════════════════════════════════════════

version: "2026-09-30"

estat:
  base: "https://api.e-stat.go.jp/rest/3.0/app/json"
  env_key: EJ_ESTAT_APP_ID

  # 経済産業省生産動態統計調査. getStatsList 를 이 코드로 좁히고 그다음 검색어로 거른다.
  stats_code: "00550200"

  # 통계표 후보를 찾을 검색어.
  #
  # ★ 2026-09-30 실측 사고: 앞의 것 하나만 돌고 멈추면 안 된다.
  #   searchWord='電子回路基板' 이 돌려준 47건이 **전부 surveyDate 2010xx 의
  #   옛 표**였다. 최신 시계열표 제목에는 그 단어가 안 들어간다.
  #   지금은 검색어를 전부 돌려 후보를 **합친다**.
  search_words: ["電子回路基板", "プリント配線板", "配線板", "電子部品", "機械器具月報"]

  # 후보 점수. 제목에 이 말이 들어가면 가점 — 「製品月表 ３５．電子部品」/
  # 「機械器具月報（その３５）電子部品」계열을 집어내기 위한 것이다.
  title_bonus: ["電子部品", "電子回路", "製品月表", "機械器具", "時系列"]
  # 월차만 쓴다. 연차표는 시차가 1년이라 트래킹에 쓸모가 없다.
  cycle_prefer: ["月次", "月", "Monthly"]

  # 점수 상위 몇 개까지 **메타(getMetaInfo)로 실제 검증**할 것인가.
  #
  # ★ 점수는 시도 순서일 뿐이고 채택은 메타가 정한다. 제목만 보고 확정하면
  #   「主要製品統計表（時系列）１３４．電子回路基板」처럼 **제목이 곧 한 品目인
  #   표**(= 분해가 아예 없다)가 1위로 올라온다 — 2026-09-30 에 실제로 그랬다.
  #   후보마다 getMetaInfo 가 한 번씩 나간다.
  probe_top: 8

  # 표章項目(tab) — '무엇을 센 값인가'
  # 한 통계표에 여러 vintage(발표월)가 따로 있는 계열이면 최대 이만큼 이어붙인다.
  # 「製品月表」 는 **표 하나가 한 달**이라, 이어붙이지 않으면 시계열이 1개월이다.
  max_tables: 120
  # 2회차부터는 최근 vintage 만 다시 받는다. 일본도 소급 정정을 하므로 최근
  # 구간은 다시 받아야 하지만, 매달 92개 표를 전부 다시 받을 이유는 없다.
  # (DB 에 이미 충분한 월이 쌓였을 때만 적용된다 — 첫 수집은 전 구간을 받는다)
  revision_vintages: 15
  # 채택한 표가 자체로 이만큼의 월을 갖고 있으면 시계열표로 보고 이어붙이지 않는다.
  min_months_single: 24

  # 表章項目(tab/cat) — '무엇을 센 값인가'
  #
  # ★ exclude 가 핵심이다. 실측(2026-09-30)에서 이 축의 항목이
  #   '生産　数量(千個)' / '生産　金額(百万円)' 형태로 왔다. 「製品月表」 계열에는
  #   出荷·在庫 도 같은 축에 들어 있다. '金額' 하나로 맞추면 생산금액 자리에
  #   재고금액이 섞여 들어가고, 그러면 YoY 가 통째로 다른 이야기가 된다.
  measures:
    - key: amt
      label: 생산금액
      match: ["生産　金額", "生産金額", "金額"]
      exclude: ["出荷", "在庫", "輸出", "輸入", "販売"]
    - key: qty
      label: 생산수량
      match: ["生産　数量", "生産数量", "数量"]
      exclude: ["出荷", "在庫", "輸出", "輸入", "販売"]
    # 보너스 — 일본은 在庫 도 준다. 대만 MOEA 를 붙이기 전까지 **재고순환을 볼 수
    # 있는 유일한 축**이다. 재고가 생산보다 먼저 튀면 다음 분기 수출이 꺾인다.
    - key: stock
      label: 재고금액
      match: ["在庫　金額", "在庫金額"]
      exclude: ["出荷", "生産"]
    - key: ship
      label: 출하금액
      match: ["出荷　金額", "出荷金額"]
      exclude: ["在庫", "生産"]

  # 品目. **코드가 아니라 이름으로 맞춘다.** exclude 는 상위 개념이 하위와 같이
  # 잡히는 것을 막는다 (예: '電子回路基板' 총계가 '多層' 매칭에도 걸리는 경우).
  items:
    - key: pcb_total
      label: 전자회로기판 계
      match: ["電子回路基板"]
      why: 일본 기판 산업 전체. 한국 HS 8534 수출과 방향을 맞대는 기준선.
    - key: multilayer
      label: 다층 프린트배선판
      match: ["多層プリント配線板", "多層配線板", "多層"]
      exclude: ["ビルドアップ"]
      why: 고다층. AI 서버 수요가 여기로 나타난다.
    - key: buildup
      label: 빌드업 다층 (패키지기판 프록시)
      match: ["ビルドアップ"]
      why: >
        일본에도 'パッケージ基板' 단독 품목은 없다. 빌드업 다층 배선판이 가장 가까운
        프록시다(이비덴·신코 계열). 한국 8534.00.2000/9000 에 섞여 있는 패키지기판을
        바깥에서 보는 창.
    - key: flexible
      label: 연성(FPC)
      match: ["フレキシブル"]
      why: 모바일향. 서버향(다층·빌드업)과 사이클이 달라 반드시 분리해서 본다.
    - key: single_double
      label: 단면·양면 프린트배선판
      match: ["片面", "両面"]
      exclude: ["多層"]
      why: 저부가 라인. 여기가 빠지면서 다층이 크면 그게 믹스 상승이다.

  start: "2019-01"

  # 出典表示は利用規約 第７条の義務。指定文言をそのまま画面に載せる。
  credit: >
    このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、
    サービスの内容は国によって保証されたものではありません。

# ══════════════════════════════════════════════════════════════════════════
# 아직 붙이지 않은 축 — 키는 필요 없지만 공식 API 가 없어 스크래핑이 필요하다.
# 화면의 '해외 대조축' 패널이 이것들을 '미연결'로 표시한다.
# ══════════════════════════════════════════════════════════════════════════
pending:
  - key: tw_moea
    name: 대만 — CCL·PCB·IC기판 판매·재고
    who: 經濟部統計處 工業產銷存動態調查
    need_key: null
    lag: "익월 23~26일 — 6개 소스 중 가장 빠르다"
    why: >
      **재고순환**을 주는 유일한 축이다. 판매액 대비 재고액이 먼저 튀면 그 다음 분기
      한국 수출이 꺾인다. 리포트의 '7월 IC기판 재고 3MMA +177% vs 판매 +45% → 빌드업'
      이 이 데이터다. 공식 REST API 가 없어 조회폼을 긁어야 한다.
  - key: us_gea
    name: 북미 — PCB Book-to-Bill Ratio
    who: Global Electronics Association (구 IPC)
    need_key: null
    lag: "약 4~5주"
    why: >
      수주/출하 비율. 1.0 초과가 지속되면 수주잔고가 쌓이는 중이다. 상세는 참여기업
      전용이지만 헤드라인 B/B 는 보도자료로 공개된다. API 가 없어 월 1회 스크래핑이
      유일한 경로다.
  - key: us_census
    name: 미국 — HS 8534 수입 (HTS 10단위)
    who: US Census International Trade API
    need_key: CENSUS_API_KEY
    have: true
    lag: "약 5주"
    why: >
      **이미 키가 있다.** HTS 8534.00.0020(3층 초과 다층) / 0080(연성) 이 나뉘어 있어
      한국이 못 보는 다층 vs 연성 분해를 미국 수입 쪽에서 볼 수 있다. 원산지 분해로
      한국 vs 대만 vs 중국 점유율도 나온다. 다음 순서.
  - key: un_comtrade
    name: 국제 — HS 8534 국가별
    who: UN Comtrade
    need_key: COMTRADE_KEY
    lag: "월별 실측 약 9개월 — 실시간 트래킹 불가"
    why: >
      시차가 9개월이라 연간 점유율·국제 비교 전용이다. 대만은 리포터에 포함되지
      않는다(490 Other Asia nes 는 월별 0건). 우선순위 낮음.
