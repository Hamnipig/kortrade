# 2차전지·ESS 심화 레이어
#
# ══════════════════════════════════════════════════════════════════════════
# 왜 따로 만드는가
#
# 밸류체인 레이어(chains.yaml)는 **수출만** 본다. 그것만으로는 답이 안 나오는
# 질문이 둘 있다.
#
#   1. 마진이 어디로 가는가?  — 양극재는 판가(P)가 리튬 가격(C)에 래깅 연동되는
#      구조라, 수출액만 보면 P 하락을 수요 감소로 오독한다. **원가는 수입 데이터에
#      있다.** 우리가 쓰는 품목별 API 는 impDlr/impWgt 를 같이 주는데 그동안
#      수입 쪽을 한 번도 쓰지 않았다.
#   2. 지금 사이클을 끌고 있는 단계가 어디인가? — 장비(CAPEX) → 소재 → 완제품
#      순서로 물결이 지나간다. 어느 단계가 선행하고 있는지는 단계 간 **시차 상관**을
#      재봐야 안다.
#
# ══════════════════════════════════════════════════════════════════════════
# 사용자 제시 코드 목록 감사 (2026-09-22)
#
# 프레임워크(원가 수입 / CAPEX 장비 / 소재 수출 3층 분해 + 래깅 스프레드)는
# **타당하다.** 이 파일의 구조가 그 프레임을 그대로 따른다.
# 다만 개별 코드에는 이 프로젝트가 **이미 실측으로 반박하는 것**이 섞여 있다.
#
# ── 확인된 오류 ────────────────────────────────────────────────────────
#
# ✗ 2841.90.9020 을 'NCM 전구체'라고 적었다 → **양극재(NCM)다.**
#   이 프로젝트 실측: 2841909020 'NCM 리튬염' 수출 $2,650M (watchlist.yaml).
#   전구체가 아니라 완성된 양극활물질이고, **수입이 아니라 수출** 코드다.
#   원가 지표로 쓰면 원가 자리에 매출 단가를 넣는 셈이 된다 — 부호가 뒤집힌다.
#   → 전구체 후보는 2825.40.0000(니켈의 산화물·수산화물)으로 바꿔 draft 로 둔다.
#
# ✗ 3824.99.9038 을 전해액이라고 적었다 → 이 프로젝트 실측은 **3824999053**이다
#   (chains.yaml: '3824999053(전해액 $33M)'). 9038 은 미확인.
#   둘 다 수집해서 규모로 갈라낸다.
#
# ✗ 2804.69.0000 을 '실리콘 음극재'라고 적었다 → 2804.69 는 **금속규소**(순도
#   99.99% 미만 벌크 규소)다. 알루미늄 합금·실리콘 화학 원료로 쓰이는 저가 원자재이고
#   한국은 이걸 주로 **수입**한다. 글 자체가 "단가(P)가 매우 높다"고 했는데
#   금속규소는 정반대로 싸다 — 내부 모순이다. 대주전자재료의 SiOx 음극재는
#   복합소재라 다른 호에 들어간다. **제외**하고, 필요하면 별도 확인 후 넣는다.
#
# ── 정확도가 떨어지는 지점 ─────────────────────────────────────────────
#
# △ 8479.89.9099(기타 고유기능 기계)는 '기타의 기타' 잔여 코드다. 이 프로젝트는
#   이미 **8479899050 '코팅머신(도포기)' $157M** 을 쓰고 있다(chains.yaml).
#   9099 는 세차기부터 산업로봇까지 다 들어오는 바구니라 배터리 프록시로는 훨씬
#   탁하다. 버리지는 않되 **對미 국가 분해로만** 의미가 있는지 측정해서 판단한다.
#
# △ 8543.70.9090 도 같은 성격이다. 이 호에는 전자담배 기기·가정용 미용기기
#   (8543702020)까지 들어간다. 충방전기 신호가 그 안에서 보이는지는 측정 문제다.
#
# △ 7410.11 동박을 "음극재 코팅에 쓰이는 구리막"이라고 적었는데, 동박은 음극
#   활물질을 바르는 **집전체(current collector)** 다. 코팅 대상이지 코팅재가 아니다.
#   같은 이유로 7607.11 알루미늄박도 '양극재 코팅용 소재'가 아니라 양극 집전체다.
#   용어만의 문제가 아니라, 집전체는 **셀 생산량(Q)에 비례**하고 활물질은 조성에
#   따라 달라지므로 읽는 법이 다르다.
#
# △ 7607.11 알루미늄박은 **식품·포장용이 압도적**이다. 배터리용은 소수 지분이라
#   순도가 낮다. 측정해 보고 추세가 셀 생산과 붙는지 확인해야 쓴다.
#
# △ "전해액은 유통기한이 짧아 한국 수출 데이터가 매우 유효하다" → 실측이 반박한다.
#   전해액 수출은 **$33M** 수준으로, 엔켐 매출 규모에 비하면 미미하다. 이미
#   현지(미국·중국) 생산으로 넘어갔다는 뜻이다. 한국 수출로 엔켐을 보면 과소평가한다.
#
# △ "리튬 반등 = ESS 이익률 바닥" → 체인 내 위치에 따라 기제가 다르다.
#   · 양극재(에코프로비엠·포스코퓨처엠): 판가 연동 + 재고평가이익 → 리튬 상승이 **호재**
#   · 셀(삼성SDI·LG엔솔): 판가 연동 계약이면 중립, 아니면 원가 압박
#   둘을 한 문장으로 묶으면 안 된다. 이 레이어는 **양극재 마진**만 추정하고,
#   셀 마진은 추정하지 않는다.
#
# ── 빠진 것 ───────────────────────────────────────────────────────────
#
# + 전지 부분품 8507909000($881M). 對미 **+191%** 로, 현재 이 체인에서 가장 강한
#   현지화 신호다. 장비보다 규모가 5배 크고 이미 실측됐다.
# + 음극재 인조흑연 3801101000($43M). 품명에 '이차전지 제조용'이 명시돼 순도가 높다.
# ══════════════════════════════════════════════════════════════════════════

version: "2026-09-22"

# 마진 프록시 회귀 설정
spread:
  max_lag_months: 4        # P ~ C(t−L) 에서 L 을 0~4 로 훑어 최적 시차를 찾는다
  min_months: 12           # 회귀 최소 표본
  min_r2: 0.25             # 이보다 낮으면 '연동 확인 안 됨'으로 표기하고 스프레드를 내지 않는다
  # ※ 리튬 원단위(kg Li/kg 양극재)를 가정하지 않는다. 출처 없는 상수를 박으면
  #   그 가정이 결과를 만든다. 대신 회귀계수 β 로 **실측 전가율**을 추정한다.

window: 8                  # 비교창(개월)
recent: 3                  # 최근창(개월) — 가속 = 최근 3M YoY − 8M YoY
hist: 30                   # 시계열 보관 길이

# 단계 간 시차 상관을 잴 때 훑을 범위 (장비 → 소재 → 완제품)
leadlag_max_months: 6

# ══════════════════════════════════════════════════════════════════════════
# 원가 — **수입** 코드. imp_usd / imp_wgt 로 $/kg 을 만든다.
