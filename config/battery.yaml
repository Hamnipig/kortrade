cost:
  - code: "2836910000"
    label: 탄산리튬
    status: draft
    for: LFP/ESS
    note: >
      HS 2836.91 = Lithium carbonate. 호 자체는 리튬 탄산염 전용이라 순도가 높을 것으로
      보이나 10단위 실측 전이다. LFP·ESS 라인의 원가 지표.
  - code: "2825200000"
    label: 수산화리튬
    status: draft
    for: NCM/NCA
    note: >
      HS 2825.20 = Lithium oxide and hydroxide. 하이니켈 삼원계의 주 원료.
      양극재(NCM/NCA) 판가와의 래깅 스프레드에서 이쪽이 주 설명변수가 될 가능성이 크다.
  - code: "2825400000"
    label: 니켈 산화물·수산화물 (전구체 후보)
    status: draft
    for: 전구체
    note: >
      사용자 제시 2841.90.9020 은 전구체가 아니라 양극재(수출)라 대체 후보로 넣는다.
      NCM 전구체는 니켈·코발트·망간 복합수산화물이므로 2825.40 계열이 유력하지만
      **미확인**이다. 규모와 상대국(중국 비중)으로 검증한다.

