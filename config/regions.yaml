# 행정구역 개편 대응 매핑
#
# 문제: 이 파이프라인은 시군구를 **이름**으로 키잉한다(시군구 코드를 API가 안 주므로).
#   행정구역이 개편되면 같은 실체가 다른 이름으로 바뀌면서 시계열이 두 동강 난다.
#   실제로 2026-07 인천 개편 직후 '인천광역시 중구'는 -47% YoY 로 보이는데,
#   이는 실제 감소가 아니라 '제물포구'로 이름이 바뀐 것이다. 보정 없이 쓰면 가짜 신호다.
#
# 해결: 조회 시점에 canonical(대표) 이름으로 접어서 본다. 원본 저장값은 건드리지 않는다.
#   analyze.region_monthly(..., canonical=True) / kpi.export_proxy(..., canonical=True)
#
# 아래는 2026-09 실측으로 확인한 것만 기재한다. 추정으로 채우지 말 것.
#   확인 방법: analyze.detect_boundary_changes(store) 가 특정 월부터 사라진 시군구와
#   같은 시도에서 같은 월부터 등장한 시군구를 짝지어 후보로 제시한다.

sigungu_aliases:
  # 2026-07-01 인천 지방행정체계 개편 (실측: 2026-06 까지 구명, 2026-07 부터 신규명)
  인천광역시:
    제물포구:
      canonical: 제물포구
      former: [중구]
      effective: "2026-07"
      evidence: "중구 2025-01~2026-06 존재 후 소멸, 제물포구 2026-07 등장. 금액 수준 연속($119M→$140M)"
    서해구:
      canonical: 서해구
      former: [서구]
      effective: "2026-07"
      evidence: "서구 2026-06 까지, 서해구 2026-07 부터"

# 시도 레벨 개편. sidoCd 자체가 바뀌므로 수집 단계에서 기간별로 코드를 갈아끼워야 한다.
sido_reorg:
  - effective: "2026-07"
    note: 전남광주 통합
    before: {29: 광주광역시, 46: 전라남도}
    after:  {12: 전남광주통합특별시}
    evidence: "코드 29/46 은 2026-06 까지 응답, 2026-08 은 빈 결과. 코드 12 는 2026-08 부터 응답"
    canonical: 전남광주통합특별시

# 시계열 비교 시 주의가 필요한 구간. 리포트에 경고로 표시된다.
breaks:
  - period: "2026-07"
    scope: [인천광역시, 광주광역시, 전라남도]
    reason: 지방행정체계 개편 — 이 시점 전후의 YoY/가속은 개편 보정 후에만 유효
