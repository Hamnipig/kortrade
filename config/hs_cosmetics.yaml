# 화장품 / 에스테틱 섹터 HS 코드 유니버스 (HS 6단위)
#
# tier:
#   core  = 화장품 섹터 정의에 반드시 포함. 섹터 레이어 상시 수집 대상.
#   probe = 기업 레이어에서 신호가 어디에 실리는지 탐색할 후보. discover 모듈이 사용.
#
# ※ 주의: 의료기기·의약품으로 허가된 미용 제품(리쥬란 등 조직수복용생체재료,
#   보툴리눔 톡신, 미용 의료기기)은 HS 33류가 아닌 30류/90류로 신고됩니다.
#   실제 어느 코드에 금액이 실리는지는 반드시 discover_hs.py 로 데이터 확인 후 확정할 것.
#   (아래 30류/90류 코드는 전부 probe 등급 = 미검증 후보)

# [2026-09 전국 스캔 결과] 기준월 2026-08 / 최근 8개월 / 전국 $8.37B
#   기초 330499  $7,349M  비중 87.8%  비중변화 +2.45%p  YoY +34%  가속 +15%p   ← 독주
#   입술 330410  $  356M  비중  4.3%  비중변화 -2.13%p  YoY -13%              ← 붕괴
#   기타두발 330590 $244M  비중  2.9%  YoY +33%  가속 +11%p
#   샴푸 330510  $  155M / 눈 330420 $136M(+3%) / 향수 330300 $63M(+78%, 최고 성장률)
#   파우더 330491 $43M(-2%) / 매니큐어 330430 $19M(-10%)
# → 색조 4종(입술·눈·파우더·매니큐어) 전부 비중 마이너스, 합쳐도 6.6%.
#   색조 ODM 비중이 높은 기업과 기초 중심 기업의 실적 방향이 갈린다.

groups:

  skincare:
    label: 기초화장품
    tier: core
    codes:
      # 시장에서 '필러/기타화장품'으로 추적하는 코드는 10단위 **3304.99.9000**.
      # 관세청 시군구 API 는 6단위만 받으므로 여기서는 330499 로 수집하고,
      # 형제 코드(3304.99.1000/2000/3000) 혼입분은 kpi.export_proxy(baseline_usd=...) 로 보정한다.
      "330499": 기타 미용·메이크업용 제품류와 기초화장용 제품류   # 3304.99.9000(필러 포함) 상위 6단위
      "330491": 가루 (프레스드 여부 불문)

  colorcosmetics:
    label: 색조화장품
    tier: core
    codes:
      "330410": 입술화장용 제품류
      "330420": 눈화장용 제품류
      "330430": 매니큐어용·페디큐어용 제품류

  fragrance:
    label: 향수·화장수
    tier: core
    codes:
      "330300": 향수와 화장수

  haircare:
    label: 두발용
    tier: core
    codes:
      "330510": 샴푸
      "330520": 퍼머넌트 웨이빙용·스트레이트닝용 제품류
      "330530": 헤어래커
      "330590": 기타 두발용 제품류

  bodycare:
    label: 바디·위생용
    tier: core
    codes:
      "330710": 면도용 제품류
      "330720": 인체용 탈취제와 발한 억제제
      "330730": 방향처리한 목욕용 조제품
      "330790": 기타 (33류 기타 조제품)
      "340111": 화장용 비누·표면활성 조제품 (세정용)
      "340130": 피부 세정용 유기계면활성제품   # 클렌징폼·바디워시

  oralcare:
    label: 구강용
    tier: core
    codes:
      "330610": 치약
      "330690": 기타 구강·치아 위생용 제품류

  # ---- 이하 probe: 에스테틱/메디컬 에스테틱. 실제 분류 코드 데이터로 검증 필요 ----

  aesthetic_biomaterial:
    label: 조직수복용생체재료·필러 (후보)
    tier: probe
    note: |
      리쥬란(PN 조직수복용생체재료), HA 필러 등이 어느 코드로 신고되는지 미확정.
      3006.10(멸균 외과용 유착방지재 등), 3004.90(기타 의약품), 3926.90(기타 플라스틱제품)
      후보를 모두 스캔한 뒤 강릉시 수출액과 대조해 확정할 것.
    codes:
      "300610": 멸균한 외과용 제품(캣거트·유착방지재 등)
      "300490": 기타 의약품 (소매용 포장)
      "300590": 기타 드레싱·유사품
      "392690": 기타 플라스틱 제품

  aesthetic_toxin:
    label: 보툴리눔 톡신 (후보)
    tier: probe
    codes:
      "300212": 항혈청과 그 밖의 혈액분획물
      "300249": 기타 백신·미생물배양제
      "300290": 기타 (30.02호)

  aesthetic_device:
    label: 미용 의료기기 (후보)
    tier: probe
    note: 클래시스·원텍·제이시스메디칼 등 HIFU/레이저 장비
    codes:
      "901890": 기타 내과·외과·수의과용 기기
      "901819": 기타 전기식 진단용 기기
      "901850": 기타 안과용 기기
      "854370": 기타 전기기기 (고유기능)

# 섹터 롤업 정의: 대시보드/모멘텀 랭킹에서 쓰는 집계 단위
rollups:
  K-Beauty 전체:
    - skincare
    - colorcosmetics
    - fragrance
    - haircare
    - bodycare
    - oralcare
  기초+색조:
    - skincare
    - colorcosmetics

