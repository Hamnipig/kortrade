# 전산업 워치리스트 — Top-down 스캐너용
#
# 섹터 탭(config/sectors/*.yaml)은 "한 산업을 시군구까지 파고드는" 레이어이고,
# 이 파일은 "전산업을 한 줄씩 훑어 어디를 파야 할지 고르는" 레이어다.
#
# 데이터 출처가 다르다:
#   섹터 탭   : 시군구별 품목별 API (HS 6단위까지만, 지역 분해 가능)
#   워치리스트 : 품목별 국가별 API (HS 10단위 그대로 옴, 국가 분해 가능, 중량 포함)
# 그래서 여기서는 HSK 10단위와 국가별 P·Q 분해가 가능하다.
#
# ── 필드 ──
#   hs6       수집 단위. API 는 6단위로 요청하면 하위 10단위를 전부 돌려준다.
#   hsk       실제로 합산할 10단위 코드들. 6단위 전체가 아니라 이것만 쓴다.
#   tickers   관련 상장사. 표시용이며 수출액과 1:1 매출이 아니다(아래 경고 참조).
#   idea      트래킹 포인트.
#   countries 국가 분해 대상. 비우면 전체 합계만.
#   status    active = 수집·표시 / draft = 코드 미확정, 표시만 하고 수집 제외
#   evidence  active 로 올릴 때 근거가 된 실측값. **검증 없이 active 금지.**
#
# ⚠ 해석상 한계 — 표에도 같은 경고를 띄운다
#   1. 관세청 수출액은 **신고 기준**이지 특정 기업 매출이 아니다. 하나의 HSK 를
#      여러 기업이 공유한다. 전차(8710001000)처럼 사실상 단일 기업인 코드는
#      강한 프록시지만, 기초화장품처럼 수백 개 기업이 쓰는 코드는 섹터 지표일 뿐이다.
#   2. 아래 purity 는 그 구분을 명시한 것이다. high 만 개별 기업 프록시로 쓴다.
#
# ── 합산 원칙 (2026-09-18 전수 감사에서 정립) ──
#   여러 10단위를 한 항목으로 합칠 때는 **월별 증감률 상관**을 먼저 본다.
#     r >= 0.6  같은 사이클 → 합쳐도 된다
#     r <  0.4  다른 사이클 → 합치면 큰 쪽이 작은 쪽을 덮어쓴다. 반드시 분리
#   실제로 이 기준에 걸려 분리한 것: 양극재 NCM/NCA(r=-0.06), 전차 본체/부분품(r=0.13),
#   소스/혼합조미료(r=0.02), 트랙터 소형/대형(r=0.31), MCP/MCO(r=0.52).
#   본체와 부분품은 원칙적으로 분리한다 — 부품 통관이 본체 인도 신호를 오염시킨다.

