name: Update trade data

# 관세청은 매월 15일경 전월까지 자료를 공표한다. 여유를 두고 17일 07:00 KST에 돈다.
# (GitHub Actions cron은 UTC 기준 → 16일 22:00 UTC)
on:
  schedule:
    - cron: "0 22 16 * *"
  workflow_dispatch:          # 수동 실행 (첫 수집은 이걸로 돌린다)
    inputs:
      start:
        description: "수집 시작 YYYYMM"
        default: "202001"
      full_refresh:
        description: "fetch_log 무시하고 전 구간 재수집"
        type: boolean
        default: false

permissions:
  contents: write             # data/ 와 site/data/ 커밋
  pages: write
  id-token: write

concurrency:
  group: trade-update
  cancel-in-progress: false   # 수집 도중 취소되면 DB가 어중간해진다

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 인증키 확인
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY 시크릿이 없습니다. Settings > Secrets and variables > Actions 에 추가하세요."
            exit 1
          fi
          python scripts/check_key.py

      - name: 시도코드 부트스트랩 (최초 1회)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ ! -f data/kortrade.sqlite ]; then
            echo "DB 없음 — 시도코드부터 만듭니다"
            python scripts/bootstrap_codes.py --post "$(date -u -d '-2 month' +%Y%m)"
          else
            echo "DB 있음 — 부트스트랩 건너뜀"
          fi

      - name: 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          START: ${{ inputs.start || '202001' }}
        run: |
          EXTRA=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then EXTRA="--revision-window 999"; fi
          python scripts/run_update.py --start "$START" --sectors all $EXTRA

      - name: 사이트 데이터 생성
        run: python scripts/build_site.py

      # 수집이 중간에 실패해도 그때까지 쓴 수백~수천 콜은 살려야 한다.
      # DB(fetch_log)를 커밋해 두면 재실행이 확정 구간을 건너뛴다.
      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data 2>/dev/null || git add -A data || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 관세청 수출입 갱신"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
