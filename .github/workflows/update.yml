name: Update trade data

# 관세청은 매월 15일경 전월까지 자료를 공표한다. 여유를 두고 17일 07:00 KST에 돈다.
# (GitHub Actions cron은 UTC 기준 → 16일 22:00 UTC)
on:
  schedule:
    - cron: "0 22 16 * *"
  workflow_dispatch:          # 수동 실행 (첫 수집은 이걸로 돌린다)
    inputs:
      start:
        description: "수집 시작 YYYYMM"
        default: "202001"
      full_refresh:
        description: "fetch_log 무시하고 전 구간 재수집"
        type: boolean
        default: false

permissions:
  contents: write             # data/ 와 site/data/ 커밋
  pages: write
  id-token: write

concurrency:
  group: trade-update
  cancel-in-progress: false   # 수집 도중 취소되면 DB가 어중간해진다

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 전에 파일 누락·구버전을 1초 만에 잡는다. 수집 한복판의 ImportError 방지.
      - name: 배포 정합성 점검
        timeout-minutes: 2
        run: python scripts/selfcheck.py

      - name: 인증키 확인
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY 시크릿이 없습니다. Settings > Secrets and variables > Actions 에 추가하세요."
            exit 1
          fi
          set +e
          python scripts/check_key.py
          rc=$?
          set -e
          # 종료코드 2 = 관세청 서버에 연결 자체가 안 됨 (키 문제 아님).
          # 해외 러너에서 간헐적으로 발생한다. 90분을 태우지 말고 바로 끝낸다.
          if [ "$rc" = "2" ]; then
            echo "::error::관세청 API 에 연결되지 않습니다(키 문제 아님). 30분~2시간 뒤 재실행하세요."
            exit 1
          fi
          exit $rc

      # DB **파일**이 있는지로 판단하면 안 된다. 부트스트랩이 중간에 죽어도 빈
      # sqlite 파일은 남으므로, 다음 실행이 "있음"으로 오판하고 수집에서 멈춘다.
      # --if-missing 이 표의 **내용**을 보고 판단한다 (이미 있으면 0콜).
      - name: 시도코드 부트스트랩
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          # 개편 후 표의 기준월은 '조회 가능한 최신월'로 잡는다.
          # 고정 오프셋(-2개월)로 잡으면 2026-08부터 응답하는 통합코드(12)를 놓친다.
          POST=$(python -c "from kortrade.collect import latest_available_yymm; print(latest_available_yymm())")
          echo "개편 후 기준월: $POST"
          python scripts/bootstrap_codes.py --post "$POST" --if-missing

      - name: 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          START: ${{ inputs.start || '202001' }}
        run: |
          EXTRA=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then EXTRA="--revision-window 999"; fi
          python scripts/run_update.py --start "$START" --sectors all $EXTRA

      # 섹터 국가별(HS x 국가). **단가(P/Q)와 확산도가 전적으로 이 수집에 달려 있다.**
      #
      # 왜 따로 도는가 — 위 '수집' 단계는 --sectors 모드라 시군구 API 만 쓴다.
      # 시군구 API 응답에는 **중량 필드가 아예 없어서** 단가를 낼 수 없다.
      # 중량(expWgt)은 품목별-국가별 API 에서만 온다. 그래서 한 번 더 돈다.
      # (2026-09-01 관세청 지침으로 시군구 중량·HSK10 이 비공개가 됐지만, 우리는
      #  원래 둘 다 안 쓰고 있었다. 단가는 처음부터 국가 축에서만 나온다.)
      #
      # 실패해도 파이프라인을 죽이지 않는다 — 단가 패널만 비고 나머지는 그대로다.
      # fetch_log 덕분에 중간에 잘려도 다음 실행이 이어서 받는다(최초 1회 약 2,900콜).
      - name: 수집 — 섹터 국가별 (단가·확산도용, 중량 포함)
        timeout-minutes: 30
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          START: ${{ inputs.start || '202001' }}
        run: |
          EXTRA=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then EXTRA="--revision-window 999"; fi
          python scripts/run_update.py --start "$START" --layer sector $EXTRA

      # 워치리스트는 **다른 API**(품목별 국가별)를 쓴다. 섹터 수집과 분리해 두면
      # 한쪽이 실패해도 다른 쪽 데이터는 살아남는다.
      - name: 수집 — 전산업 워치리스트
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          START: ${{ inputs.start || '202001' }}
        run: |
          EXTRA=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then EXTRA="--revision-window 999"; fi
          python scripts/run_watchlist.py --start "$START" $EXTRA

      # 전산업 유니버스 — 97개 장 전수. 워치리스트 밖에서 뜨는 것을 잡는 레이어.
      - name: 수집 — 전산업 유니버스
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          START: ${{ inputs.start || '202001' }}
        run: |
          EXTRA=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then EXTRA="--revision-window 999"; fi
          python scripts/run_universe.py --start "$START" $EXTRA

      # 속보(10일 단위 잠정치)는 flash.yml 이 1·11·21일에 따로 돌지만, 월별 실행에서도
      # 한 번 맞춰 둔다. 구간당 1콜이라 비용이 없고, 확정치와 잠정치를 같은 커밋에
      # 담아 두면 둘의 괴리(정합성 점검)를 같은 시점 기준으로 볼 수 있다.
      # ★ 월별 확정 파이프라인이 속보 문제로 죽으면 안 된다. 여기는 곁다리다.
      #   continue-on-error + 단계 타임아웃으로 완전히 격리한다.
      - name: 수집 — 속보(10일 단위 잠정치)
        timeout-minutes: 8
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          START=$(python -c "
          from kortrade.collect import current_yymm, shift_yymm
          print(shift_yymm(current_yymm(), -24))")
          python scripts/run_flash.py --start "$START" --budget-seconds 360
          set +e; python scripts/verify_flash.py --items; rc=$?; set -e
          [ "$rc" = "0" ] || echo "::warning::속보 슬롯 매핑 검증 불일치 — data/flash_verify.json 확인"

      - name: 사이트 데이터 생성
        run: |
          python scripts/build_site.py
          python scripts/build_watchlist.py
          python scripts/build_universe.py
          python scripts/build_chains.py
          python scripts/build_battery.py
          python scripts/build_flash.py || echo "속보 건너뜀 (수집 실패)"

      # 진단 — 시군구 전체 덤프. 사이트 파일을 만들지 않고 **로그로만** 남긴다.
      #
      # 화면은 카테고리당 상위 8개 시군구만 싣는데, 기초(330499)는 그 8개가 카테고리의
      # 58% 뿐이다. 그래서 "화성·음성·세종이 안 보인다"가 순위 컷오프 때문인지
      # 애초에 안 잡히는 것인지 구분이 안 됐다. 이 덤프가 그 질문에 답한다.
      # (지역 귀속은 제도상 '제조자 사업장' 기준이지만 수출자 자기신고 항목이라
      #  품목·기업마다 품질이 다르다 — 실제로 화성은 색조에서만 1위다)
      - name: 진단 — 시군구 전체 덤프 (로그 전용)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/dump_places.py --top 30 || echo "덤프 건너뜀"

      # DB 가 GitHub 파일 한도(100MB)에 가까워지면 조용히 push 가 깨진다. 미리 경고한다.
      - name: DB 크기 점검
        if: always()
        run: |
          [ -f data/kortrade.sqlite ] || exit 0
          MB=$(du -m data/kortrade.sqlite | cut -f1)
          echo "DB 크기: ${MB}MB"
          if [ "$MB" -ge 90 ]; then
            echo "::error::DB 가 ${MB}MB 입니다. GitHub 파일 한도 100MB 에 근접했습니다 — 유니버스 적재 단위를 줄이거나 오래된 월을 정리하세요."
          elif [ "$MB" -ge 60 ]; then
            echo "::warning::DB 가 ${MB}MB 입니다. 100MB 한도를 주시하세요."
          fi

      # 수집이 중간에 실패해도 그때까지 쓴 수백~수천 콜은 살려야 한다.
      # DB(fetch_log)를 커밋해 두면 재실행이 확정 구간을 건너뛴다.
      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data 2>/dev/null || git add -A data || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 관세청 수출입 갱신"
            # flash.yml 과 같은 브랜치를 쓴다. 뒤처진 상태면 rebase 후 밀어넣는다.
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
