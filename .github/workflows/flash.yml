name: Update flash (10-day)

# 관세청은 한 달 수출을 네 번 발표한다.
#   01~10일 누계 → 11일경 · 01~20일 누계 → 21일경 · 월전체 잠정 → 익월 1일경
#   월별 확정치 → 익월 15일경   (이건 update.yml 이 17일에 받는다)
# 이 워크플로는 앞의 셋을 받는다. 월전체 잠정만으로도 확정치보다 15일 빠르다.
#
# ★ 단계마다 timeout-minutes 를 건 이유
#   첫 실행이 잡 한도(25분)를 넘겨 통째로 취소됐고, 그러면 **어느 단계가
#   시간을 먹었는지 로그에 남지 않는다.** 단계별로 끊어 두면 범인이 이름으로
#   찍히고, 뒤 단계는 계속 돈다. 단계 합계가 잡 한도보다 작아야 한다
#   (5+2+3+8+6+3+3=30 < 35). tests/test_flash.py 가 이 관계를 고정한다.
on:
  schedule:
    - cron: "0 3 1,11,21 * *"    # 12:00 KST
    - cron: "0 9 1,11,21 * *"    # 18:00 KST (오전 공표가 늦어지는 경우 대비)
  workflow_dispatch:
    inputs:
      months:
        description: "수집할 과거 개월 수 (전년 동기 비교에 최소 24)"
        default: "24"
      window_months:
        description: "1콜당 조회 개월. 응답이 느리면 6이나 3으로 줄인다"
        default: "12"
      verify_countries:
        description: "국가 슬롯 번호↔국가 대응 검증 (응답 크기가 예측 안 되는 호출 — 기본 off)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# ★ update.yml 과 **같은 그룹**을 쓴다. 두 워크플로가 같은 DB 파일을 쓰고
#   같은 브랜치에 push 하므로, 동시에 돌면 커밋이 충돌한다.
concurrency:
  group: trade-update
  cancel-in-progress: false

jobs:
  flash:
    runs-on: ubuntu-latest
    # 단계 타임아웃 합계(30분) + checkout/setup(타임아웃 없는 단계) 보다 넉넉히 위.
    # 잡 한도가 단계 합계보다 낮으면 잡이 먼저 죽어서 범인이 안 찍힌다.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        timeout-minutes: 5
        run: pip install -r requirements.txt

      # ★ 수집을 시작하기 전에 **파일이 다 올라왔는지** 먼저 본다.
      #   zip 으로 갱신하는 구조라 파일 하나를 빼먹기 쉽고, 그러면 수집 한복판에서
      #   ImportError 로 죽는다(실측: battery.py 만 올리고 flash.py 를 빼먹어
      #   'cannot import name ols' 로 멈췄다). 1초짜리 점검으로 먼저 걸러낸다.
      - name: 배포 정합성 점검
        timeout-minutes: 2
        run: python scripts/selfcheck.py

      # 속보 워크플로는 속보 API 2개만 있으면 된다. 시군구 API 상태 때문에 멈출 이유가 없다.
      - name: 인증키 확인
        timeout-minutes: 3
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY 시크릿이 없습니다."
            exit 1
          fi
          set +e; python scripts/check_key.py --only flash_item,flash_country; rc=$?; set -e
          # 종료코드 2 = 관세청 서버 연결 실패 (키 문제 아님). 해외 러너에서 간헐적이다.
          if [ "$rc" = "2" ]; then
            echo "::error::관세청 API 에 연결되지 않습니다(키 문제 아님). 다음 예약 실행에서 다시 시도합니다."
            exit 1
          fi
          exit $rc

      # run_flash.py 가 먼저 1개월 프로브를 던져 응답 속도를 로그에 찍고,
      # 벽시계 예산(7분)을 넘기면 스스로 멈추고 어디까지 했는지 보고한다.
      - name: 수집 — 10일 단위 잠정치
        timeout-minutes: 8
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          MONTHS: ${{ inputs.months || '24' }}
          WIN: ${{ inputs.window_months || '12' }}
        run: |
          START=$(python -c "
          from kortrade.collect import current_yymm, shift_yymm
          import os; print(shift_yymm(current_yymm(), -int(os.environ['MONTHS'])))")
          echo "수집 시작월: $START"
          python scripts/run_flash.py --start "$START" \
            --window-months "$WIN" --budget-seconds 420

      # 수집이 실패하면 **그 자리에서** 응답 원문을 찍는다.
      # (실측: priodMon 이 YYYYMM 인 걸 모르고 추측으로 두 번 고쳤다.
      #  한 번 찍어 봤으면 끝날 일이었다. 다시는 왕복하지 않게 자동으로 남긴다.)
      - name: 실패 시 응답 원문 진단
        if: failure()
        timeout-minutes: 3
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/inspect_flash.py || true

      # 슬롯 번호 ↔ 품목/국가 대응 검증.
      #  --items    는 DB 내부 대조라 API 호출이 0회다. 항상 돈다.
      #  --countries 는 hsSgn 을 비워 보내는 호출이라 응답 크기가 예측되지 않는다.
      #              기본 off 이고, 켜도 5분 예산 안에서만 돈다.
      # 여기서 실패해도 빌드를 죽이지 않는다 — 틀린 매핑으로 화면을 그리는 것보다
      # 경고를 띄우고 국가 슬롯을 닫아 두는 쪽이 낫다.
      - name: 슬롯 매핑 검증
        timeout-minutes: 6
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.verify_countries }}" = "true" ]; then EXTRA="--countries"; fi
          set +e
          python scripts/verify_flash.py --items $EXTRA --budget-seconds 300
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then
            echo "::warning::슬롯 매핑 검증에서 불일치가 나왔습니다. data/flash_verify.json 을 확인하세요. 국가 슬롯은 화면에 표시되지 않습니다."
          fi

      - name: 사이트 데이터 생성
        timeout-minutes: 3
        run: |
          python scripts/build_flash.py
          # 나머지 레이어는 API 호출 없이 DB 만 다시 읽는다. 아직 수집 전이면 건너뛴다.
          python scripts/build_site.py      || echo "섹터 레이어 건너뜀"
          python scripts/build_watchlist.py || echo "워치리스트 건너뜀"
          python scripts/build_universe.py  || echo "유니버스 건너뜀"
          python scripts/build_chains.py    || echo "밸류체인 건너뜀"
          python scripts/build_battery.py   || echo "2차전지 건너뜀"

      - name: 변경분 커밋
        if: always()
        timeout-minutes: 3
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data 2>/dev/null || git add -A data || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "flash: $(date -u +%Y-%m-%d) 10일 단위 잠정치 갱신"
            # 월별 워크플로와 같은 브랜치를 쓴다. 뒤처진 상태면 rebase 후 밀어넣는다.
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: flash
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
